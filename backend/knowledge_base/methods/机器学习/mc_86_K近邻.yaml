    - '**K 值调参曲线**：不同 K 的精度变化'
    - '**距离分布图**：近邻距离直方图'
    - '**最近邻连线图**：二维下样本与近邻连线'
    source: math-modeling-skill
  id: mc_86
  formulas:
  - 闵可夫斯基距离：$d(x, y) = \left( \sum_{j=1}^{m} |x_j - y_j|^p \right)^{1/p}$，其中 $x,y$ 为样本向量，$m$ 为特征维数，$p$ 为距离阶数（$p=2$
    时为欧氏距离）。
  - 分类决策（多数投票）：$\hat{y}(x) = \arg\max_{c} \sum_{i \in N_K(x)} \mathbb{I}(y_i = c)$，其中 $N_K(x)$ 为 $x$ 的 K
    个最近邻集合，$\mathbb{I}(\cdot)$ 为指示函数，$c$ 为类别。
  - 回归决策（均值）：$\hat{y}(x) = \frac{1}{K} \sum_{i \in N_K(x)} y_i$，其中 $K$ 为近邻数，$y_i$ 为近邻样本的目标值。
  - 加权投票（可选）：$w_i = 1/d(x, x_i)$，距离越近权重越大，用于分类或回归中加权聚合近邻结果。
