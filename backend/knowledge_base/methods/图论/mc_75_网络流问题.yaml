method_card:
  name: 网络流问题
  name_en: Network Flow Problem
  category:
  - 图论
  principle: '网络流问题研究在网络中从源点到汇点的最大流量。


    #### 3.1 最大流问题


    **基本概念**：

    - **容量**：每条边的最大流量限制$c(u,v)$

    - **流量**：每条边的实际流量$f(u,v)$

    - **源点**：流出的起点$s$

    - **汇点**：流入的终点$t$


    **流量守恒**：

    $$

    \sum_{v} f(v, u) = \sum_{v} f(u, v), \quad \forall u \neq s, t

    $$


    **容量限制**：

    $$

    0 \leq f(u, v) \leq c(u, v)

    $$


    #### 3.2 Ford-Fulkerson算法


    通过寻找增广路径增加流量，直到不存在增广路径。


    **残差网络**：

    $$

    c_f(u, v) = \begin{cases}

    c(u, v) - f(u, v), & \text{如果}(u, v) \in E \\

    f(v, u), & \text{如果}(v, u) \in E \\

    0, & \text{否则}

    \end{cases}

    $$


    #### 3.3 Edmonds-Karp算法


    Ford-Fulkerson的实现，使用BFS找增广路径。


    **时间复杂度**：$O(VE^2)$


    #### 3.4 Dinic算法


    使用层次图和多路增广，效率更高。


    **时间复杂度**：$O(V^2E)$


    #### 3.5 最小费用最大流


    在最大流的基础上使总费用最小。


    **目标**：

    $$

    \min \sum_{(u,v) \in E} f(u, v) \cdot cost(u, v)

    $$'
  applicable_when:
  - 问题可以抽象为有向图，且每条边有明确的容量限制。
  - 存在一个明确的源点和一个明确的汇点，流从源点出发最终到达汇点。
  - 除源点和汇点外，所有中间节点满足流量守恒，即流入量等于流出量。
  - 每条边的实际流量非负且不超过该边的容量。
  - 若涉及费用，则每条边除容量外还给出单位流量的费用。
  typical_scenarios:
  - 交通运输网络中，需要计算从出发地到目的地能够通过的最大车流量或货物运输量。
  - 通信网络中，需要确定从源节点到目的节点能够传输的最大数据带宽。
  - 管道输送系统中，需要计算从供应站到需求站的最大流体输送量。
  - 任务分配问题中，需要将任务分配给执行者并使完成的任务数量最大。
  - 在最大流基础上考虑运输成本时，需要求解总费用最小的流方案。
