  formulas:
  - 路径长度：h(x) = \sum_{i=1}^{\text{path}} \Delta i + C(\psi)，其中 \Delta i 为节点到子节点的路径长度，C(\psi) 为调整项，\psi 为样本数
  - 调整路径长度：c(\psi) = 2H(\psi - 1) - (2(\psi - 1)/\psi)，其中 H(i) 为调和数，\psi 为样本数
  - 归一化路径长度：H(x) = h(x) / c(\psi)，其中 h(x) 为路径长度，c(\psi) 为调整路径长度
  - 异常得分：s(x, \psi) = 2^{-\frac{E[H(x)]}{c(\psi)}}，其中 E[H(x)] 为归一化路径长度的期望，c(\psi) 为调整路径长度
