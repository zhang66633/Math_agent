paper:
  id: paper_015
  year: 2023
  competition: 研赛
  problem_id: B
  title: 大规模创新类竞赛评审方案研究（NSGA-II与机器学习路线）
  tags:
    problem_type:
    - 优化
    - 评价
    - 预测
    - 综合
    core_models:
    - NSGA-II多目标遗传算法
    - 线性回归
    - 随机森林
    - 决策树
    - XGBoost
    - 主成分分析(PCA)
    - 熵权法
    - 分段回归
    - 遗传算法
    techniques:
    - 非支配排序
    - 拥挤距离
    - 帕累托前沿
    - 交叉验证
    - 3-sigma异常值检测
    - KDE核密度估计
    - 混淆矩阵
    - 灵敏度分析
  problem_ref: ''
  problem_context: 中国研究生数学建模竞赛（华为杯）题目，聚焦于大规模创新类竞赛的评审方案设计。创新类竞赛与有标准答案的竞赛不同，需要评审专家根据评审框架进行独立评审，同一份作品可能得到差异显著的评分。在大规模竞赛中，评审专家数量众多，评分的极差问题尤为突出，单纯依赖评分总和排序不是理想方法。题目提供了模拟数据集（数据1、数据2.1、数据2.2），包含3000份作品、125位评审专家、每位专家评审约120份作品（5m/n），每份作品恰好被5位评审专家评审。数据包含专家编号、作品编号、原始评分、标准分、复议分、奖项等级等信息。题目要求解决四个递进问题：(1)建立数学规划模型优化'交叉分发'方案，最大化评审专家之间作品的交集数量并确保交叉数量均衡，保证均衡性、交叉性、公正性、覆盖率和分散性；(2)分析原始成绩分布特征，设计两种以上评审方案，建立新的标准分计算模型以确保评审公正性和准确性；(3)分析两阶段评审方案优劣，建立极差模型（可采用随机森林等机器学习方法），对非高分且非低分段作品的'大极差'进行精确自动化调整，发掘高创新性作品；(4)建立完整的两阶段评审优化模型，第一阶段筛选作品，第二阶段以极评指标最大化为目标优化评审分配，最终确定作品排名。
  methodology_chain:
  - '问题一建模: 以0-1变量x_ij表示作品i是否被专家j评审，建立多目标规划模型，目标1为最大化所有专家对的交叉值之和，目标2为最小化交叉值标准差，约束为每份作品恰好5位专家评审且每位专家评审数量均匀'
  - '问题一求解: 采用NSGA-II算法，染色体编码为3000×125的实数矩阵，每行选最大5个数标为1进行解码，通过非支配排序和拥挤距离选择，交叉变异迭代求解帕累托前沿'
  - '问题一评价: 定义RWB（评审工作量均衡性）、MEB（作品曝光均衡性）、Max_OR、Min_OR、AOR（平均交叉值）等指标评估方案质量，绘制交叉热力图验证均衡性'
  - '问题二数据预处理: 对奖项等级编码（一等奖=1至未获奖=4），添加复议标记变量，按专家编号和作品编号排序整合数据'
  - '问题二特征分析: 绘制各专家评分分布直方图和KDE曲线，计算偏度峰度散点图，分析作品得分分布特征，绘制专家评分与最终得分散点图及线性拟合线'
  - '问题二评价指标构建: 从专家角度定义专家评分标准差SD_j、评审作品数量、极评指标ESI；从综合角度定义专家专业性评分ER（PCA确定权重）和作品得分合理性评分SRA（熵权法确定权重），加权得综合评审得分IG'
  - '问题二标准分建模: 以标准分、专家专业性评分、平均专家专业性评分（方案一）或加入作品得分合理性评分（方案二）为自变量，以最终得分为因变量，建立线性回归模型，用最小二乘法估计权重'
  - '问题二模型改进: 考虑第二阶段3位专家评审数据，将总评审专家数从5扩展到8，重新训练回归模型，比较两阶段评价指标（MSE和R²），选择方案二并得出最终标准分公式'
  - '问题二结果分析: 分析调整后成绩分布特征，通过混淆矩阵对比新旧获奖等级变化，验证模型改进效果'
  - '问题三数据预处理: 删除学校编码特征，用3-sigma剔除异常值（发现数据2.2中名次8498的疑似违规论文），用z<-2剔除低分段作品，用z>2筛选极差大的作品'
  - '问题三两阶段对比: 绘制两阶段极差和最终成绩的对比图和箱线图，分析第二阶段评审标准更严格、分歧更小的特征'
  - '问题三创新性指标构建: 基于平均分、标准差、中位数、四分位距、偏度构建创新性评价指标I，通过灵敏度分析确定权重ω1=0.1, ω2=0.7, ω3=0.2'
  - '问题三极差建模: 以专家评分标准差、评审作品数量、极评指标、作品标准差和均值、创新性指标为输入，分别用线性回归、决策树、随机森林、XGBoost建模，通过R²、MAE、MSE、RMSE评估选择随机森林为最优模型'
  - '问题三极差调整与相关性分析: 用随机森林模型调整非高分非低分段作品的大极差，通过KDE图确定分段阈值（数据2.1为270.24，数据2.2为249.32），进行分段回归分析极差与创新性的关系'
  - '问题四两阶段模型建立: 第一阶段沿用问题一模型筛选前30%作品进入第二阶段；第二阶段以最大化极评指标ESI为目标函数，约束为每份作品恰好3位专家评审、专家工作量均匀、专家专业性平衡，用遗传算法求解'
  - '问题四结果分析: 选取专业性排名前30位专家参与第二阶段分配，遗传算法迭代约50次达到最优解2654.73，输出具体分配方案'
  key_formulas:
  - name: 问题一多目标规划模型
    latex: \text{Max } Z = \sum_{j_1,j_2} OR_{j_1,j_2}, \quad \text{Min } \sum_{j_1,j_2}(OR_{j_1,j_2}
      - \overline{OR})^2
    description: 目标1最大化所有专家对的交叉值之和，目标2最小化交叉值的方差以确保均衡性
  - name: 交叉值定义
    latex: OR_{j_1,j_2} = \sum_{i=1}^{m} x_{ij_1} \cdot x_{ij_2}, \quad j_1 \neq j_2
    description: 任意两位专家j1和j2评审作品集合的交集大小
  - name: 评审工作量均衡性RWB
    latex: RWB = \sqrt{\frac{1}{n}\sum_{j=1}^{n}\left(\sum_{i=1}^{m}x_{ij} - \frac{5m}{n}\right)^2}
    description: 所有评审员评审作品数量的标准差，越小越均衡
  - name: 作品曝光均衡性MEB
    latex: MEB = \sqrt{\frac{1}{m}\sum_{i=1}^{m}\left(\sum_{j=1}^{n}x_{ij} - 5\right)^2}
    description: 所有作品被评审次数的标准差，越小越均衡
  - name: 专家评分标准差SD_j
    latex: SD_j = \sqrt{\frac{\sum(\text{作品标准分} - \text{作品原始分})^2}{\text{某专家评审作品总数}}}
    description: 衡量专家j评分与标准分的偏差程度
  - name: 极评指标ESI
    latex: ESI = |a - b|, \quad a = \frac{p_j}{N_j}, \quad b = \frac{b_j}{N_j}
    description: 衡量专家评分偏向极端的程度，p_j为给出最高分的次数，b_j为给出最低分的次数
  - name: 专家专业性评分ER
    latex: ER = 0.2573 \times SD_j + 0.6797 \times \text{评审作品数量} + 0.6869 \times ESI
    description: PCA确定权重的专家专业性综合评分
  - name: 作品得分合理性评分SRA
    latex: SRA = 0.0146 \times \text{原始分} + 0.0258 \times \text{标准分} + 0.3611 \times
      \text{第二次评审标准分极差} + 0.0221 \times \text{极差} + 0.5764 \times \text{复议标记}
    description: 熵权法确定权重的作品得分合理性综合评分
  - name: 最终标准分计算模型
    latex: STD_{ij} = 0.765625 \times ER_{ij} - 0.291511 \times SRA_i + 3.76465 \times
      std_{ij}
    description: 问题二最终确定的标准分计算模型，综合专家专业性和作品得分合理性
  - name: 创新性评价指标
    latex: I = 0.1 \times \left(\frac{\mu}{\sigma}\right) + 0.7 \times |Skewness|
      + 0.2 \times \left(\frac{Max}{Q_3}\right)
    description: 综合考虑评分变异程度、偏度和分散程度的创新性评价指标
  - name: 分段回归关系式（数据2.1）
    latex: \text{成绩} = \begin{cases} 1.38 \times I + 0.35 \times \text{极差} + 266,
      & \text{成绩} > 270.24 \\ -0.45 \times I + 1.50 \times \text{极差} + 219.69, & \text{成绩}
      \leq 270.24 \end{cases}
    description: 数据2.1中创新性和极差与成绩的分段回归关系
  - name: 问题四第二阶段目标函数
    latex: \text{Max} \sum_{i}\sum_{j} ESI_j \times x_{ij}
    description: 最大化所有作品分配专家的极评指标之和，以发掘创新性作品
  algorithm_outline:
  - language: python
    description: NSGA-II算法求解问题一交叉分发方案
    code: "def NSGA_II(pop_size, n_gen, m_works=3000, n_experts=125):\n    # 初始化种群:\
      \ 3000x125实数矩阵\n    population = np.random.rand(pop_size, m_works, n_experts)\n\
      \    \n    for gen in range(n_gen):\n        # 解码: 每行选最大的5个数标为1\n        decoded\
      \ = decode(population)  # 3000x125的0-1矩阵\n        \n        # 计算适应度\n      \
      \  fitness = []\n        for ind in decoded:\n            f1 = sum_overlap(ind)\
      \  # 最大化交叉值之和\n            f2 = std_overlap(ind)  # 最小化交叉值标准差\n            fitness.append((f1,\
      \ f2))\n        \n        # 非支配排序\n        fronts = non_dominated_sort(fitness)\n\
      \        \n        # 计算拥挤距离\n        crowding = compute_crowding_distance(fronts,\
      \ fitness)\n        \n        # 选择、交叉、变异\n        parents = select(fronts, crowding)\n\
      \        offspring = crossover_and_mutate(parents)\n        \n        # 合并种群并选择下一代\n\
      \        population = select_next_gen(population, offspring)\n    \n    return\
      \ pareto_front(population)"
  - language: python
    description: 随机森林极差模型训练与评估
    code: 'from sklearn.ensemble import RandomForestRegressor

      from sklearn.model_selection import train_test_split

      from sklearn.metrics import r2_score, mean_absolute_error, mean_squared_error


      # 特征: 专家评分标准差, 评审作品数量, 极评指标, 作品标准差, 作品均值, 创新性指标

      X = data[[''SD_j'', ''review_count'', ''ESI'', ''work_std'', ''work_mean'',
      ''innovation'']]

      y = data[''range_score'']  # 极差


      # 划分训练集和测试集

      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.3, random_state=42)


      # 训练随机森林

      rf = RandomForestRegressor(n_estimators=100, random_state=42)

      rf.fit(X_train, y_train)


      # 评估

      y_pred = rf.predict(X_test)

      r2 = r2_score(y_test, y_pred)

      mae = mean_absolute_error(y_test, y_pred)

      mse = mean_squared_error(y_test, y_pred)

      rmse = np.sqrt(mse)


      # 与线性回归、决策树、XGBoost对比

      # 随机森林在所有指标上表现最优'
  - language: python
    description: 遗传算法求解问题四第二阶段评审分配
    code: "def genetic_algorithm(pop_size, n_gen, m_works=900, n_experts=30):\n  \
      \  # 初始化种群: 900x30实数矩阵\n    population = np.random.rand(pop_size, m_works, n_experts)\n\
      \    \n    for gen in range(n_gen):\n        # 解码: 每行选最大的3个数标为1\n        decoded\
      \ = decode_top3(population)\n        \n        # 计算适应度: sum(ESI_j * x_ij)\n\
      \        fitness = []\n        for ind in decoded:\n            f = sum(ESI[j]\
      \ * ind[i][j] for i in range(m_works) for j in range(n_experts))\n         \
      \   fitness.append(f)\n        \n        # 选择适应度最高的一半作为父代\n        parents =\
      \ select_top_half(population, fitness)\n        \n        # 交叉和变异\n        offspring\
      \ = crossover_and_mutate(parents)\n        \n        # 更新种群\n        population\
      \ = parents + offspring\n    \n    # 输出最优解\n    best_idx = np.argmax(fitness)\n\
      \    return population[best_idx], fitness[best_idx]"
  assumption_analysis:
  - '假设1: 每份作品恰好被5位评审专家评审（题目要求）→ 这是题目明确规定的约束，合理。如果放松为可变数量，需要重新设计分配模型，可能增加优化复杂度但更灵活'
  - '假设2: 每位评审专家评审的作品数量应当是均匀的，设定上下界L和U（U=L+a，a=5）→ 合理，保证工作量均衡。如果a过大，均衡性下降；a过小，可行解空间受限'
  - '假设3: 复议分比原始分更准确，用复议分替代原始评分作为最终评分 → 合理，复议是全面深入的再次评估。但如果复议过程本身存在偏差，可能引入新问题'
  - '假设4: 专家评分分布呈双峰形态，多数专家偏度轻微左偏，峰度接近0 → 基于数据的观察，合理。但样本仅展示5位专家，代表性可能有限'
  - '假设5: 创新性作品的评分呈现广泛分布（部分专家高分、部分低分），争议性源于创新元素 → 合理推断，但创新性不一定总表现为评分分歧，也可能是共识性创新'
  - '假设6: 低分段属于淘汰范围，用z<-2剔除；极差大的作品用z>2筛选 → 基于正态分布假设，在数据量足够大时合理。但若数据非正态，阈值选择需调整'
  - '假设7: 数据2.2中名次为8498的作品可能为''违规论文'' → 合理猜测，但缺乏验证。这些异常值被剔除可能影响模型训练'
  - '假设8: 第二阶段评审标准更严格、分歧更小 → 基于数据观察，但可能因第二阶段作品质量更高而非评审标准变化'
  reusable_patterns:
  - '可复用模式1: 多目标优化中的NSGA-II应用——将分配问题建模为0-1规划，用非支配排序和拥挤距离维护帕累托前沿，适用于任何需要平衡多个冲突目标的资源分配问题（如考场分配、任务调度）'
  - '可复用模式2: 评价指标体系的构建方法论——从多个角度（专家角度、作品角度）设计评价指标，用PCA确定主观权重、熵权法确定客观权重，再加权综合，适用于任何多维度评价问题'
  - '可复用模式3: 分段回归分析——通过KDE图确定阈值，将数据分为不同段分别回归，发现变量间关系的非线性变化，适用于分析变量关系随条件变化的场景'
  - '可复用模式4: 机器学习模型选择与对比框架——同时训练线性回归、决策树、随机森林、XGBoost，用R²、MAE、MSE、RMSE多指标评估，选择最优模型，适用于任何回归预测任务'
  - '可复用模式5: 两阶段评审模型设计——第一阶段广泛筛选，第二阶段精细评审，结合优化分配和标准分计算，适用于任何需要多轮筛选的评审或选拔场景'
  - '可复用模式6: 异常值检测与处理流程——用3-sigma原则检测异常值，结合业务逻辑判断（如名次8498疑似违规），适用于数据清洗和预处理'
  common_pitfalls:
  - mistake: 在问题一中直接使用单目标优化，忽略交叉值均衡性
    solution: 应建立多目标优化模型，同时最大化交叉值总和和最小化交叉值标准差，使用NSGA-II等算法求解帕累托前沿
  - mistake: 在问题二标准分建模中仅使用第一阶段5位专家数据，忽略第二阶段数据
    solution: 应考虑两阶段评审专家数量不同（5位vs8位），分别建模并比较，最终选择包含第二阶段数据的改进模型
  - mistake: 在问题三中直接用线性回归拟合极差与创新性的关系
    solution: 应先通过KDE图确定分段阈值，发现关系在不同分数段可能反转，采用分段回归分析
  - mistake: 在机器学习模型选择中仅看R²指标
    solution: 应综合考虑R²、MAE、MSE、RMSE多个指标，随机森林虽然R²最高但也要验证其他指标是否一致最优
  - mistake: 在问题四中忽略专家专业性平衡约束
    solution: 第二阶段分配不仅要考虑极评指标最大化，还要约束每份作品分配的专家专业性尽可能平衡，避免某些作品分配到专业性差异过大的专家组合
  - mistake: 在数据预处理中直接删除所有异常值而不分析原因
    solution: 应分析异常值产生的原因（如名次8498可能为违规论文），判断是否应剔除，避免误删有价值数据
  difficulty: 3
  difficulty_level: hard
  analysis:
    problem_summary: 针对大规模创新类竞赛评审中评分差异大、缺乏标准答案的问题，建立从交叉分发方案优化、标准分计算模型改进、极差调整到完整两阶段评审模型的系统解决方案
    key_assumptions:
    - 每份作品恰好被5位（第一阶段）或3位（第二阶段）评审专家评审
    - 每位评审专家评审的作品数量均匀，上下界差不超过5
    - 复议分比原始分更准确，用复议分替代原始评分
    - 创新性作品评分呈现广泛分布，争议性源于创新元素
    - 低分段作品用z<-2剔除，极差大的作品用z>2筛选
    decision_variables: x_ij ∈ {0,1}：作品i是否被专家j评审；在问题四中，x_ij表示第二阶段作品i是否分配给专家j
    objective: 问题一：最大化专家对交叉值之和并最小化交叉值方差；问题二：最小化标准分计算模型的MSE并最大化R²；问题三：最小化极差模型的预测误差；问题四：最大化极评指标ESI之和
    constraints: 每份作品恰好被5位（或3位）专家评审；每位专家评审作品数量在[L,U]范围内；每份作品分配的专家专业性平衡（问题四）
  model:
    approach: 论文采用递进式建模思路，四个问题层层深入。问题一建立多目标0-1规划模型，用NSGA-II求解最优交叉分发方案，确保评审的均衡性和交叉性。问题二在数据分析基础上，从专家角度和作品角度构建评价指标体系（ER和SRA），用PCA和熵权法确定权重，再以标准分、ER、SRA等为自变量建立线性回归模型计算最终得分，并考虑第二阶段数据改进模型。问题三针对极差问题，构建创新性评价指标，用随机森林等四种机器学习模型拟合极差，选择最优模型进行调整，并通过分段回归分析极差与创新性的非线性关系。问题四整合前三问成果，建立两阶段评审优化模型：第一阶段筛选作品，第二阶段以极评指标最大化为目标、专家专业性为约束，用遗传算法求解最优分配方案，最终用问题二的标准分模型确定排名。
    innovation: 1) 将NSGA-II多目标优化创新性地应用于评审交叉分发问题，同时优化交叉值总和与均衡性；2) 构建了专家专业性评分(ER)和作品得分合理性评分(SRA)双维度评价体系，分别用PCA和熵权法确定权重；3)
      提出创新性评价指标，通过分段回归发现极差与创新性关系随分数段反转的现象；4) 建立完整的两阶段评审优化模型，将评审分配与标准分计算有机结合。
    solution_method: Python编程实现，使用numpy进行矩阵运算，sklearn实现线性回归、决策树、随机森林和XGBoost，matplotlib/seaborn进行可视化，自编NSGA-II和遗传算法求解优化问题
  evaluation:
    strengths:
    - 建模思路清晰递进，四个问题层层深入，前一问的成果为后一问提供基础
    - 评价指标体系构建全面，从专家和作品两个角度设计指标，主客观权重结合
    - 方法选择多样且有理有据，通过多模型对比选择最优方案
    - 对数据的探索性分析深入，通过可视化发现数据特征和规律
    - 创新性地引入创新性评价指标，并通过分段回归发现非线性关系
    weaknesses:
    - 问题一中NSGA-II最终只生成1个解集，帕累托前沿可能不够丰富
    - 问题二中线性回归模型较为简单，未考虑特征间交互作用和非线性关系
    - 问题三中创新性指标的权重通过灵敏度分析确定，但未给出严格的优化准则
    - 问题四中遗传算法的收敛性缺乏理论保证，且未与其他优化算法对比
    - 部分假设（如复议分更准确、异常值为违规论文）缺乏充分验证
    - 论文中部分符号和公式存在笔误（如'差度'应为'偏度'，'见味'应为'意味'）
    lessons: 这篇论文展示了如何将多目标优化、统计回归、机器学习等方法系统性地应用于一个复杂的评审方案设计问题。最重要的启示是：面对复杂实际问题时，需要将问题分解为递进的子问题，每个子问题选择合适的方法，并将前一问的成果作为后一问的输入。同时，评价指标的设计要全面考虑多个维度，模型选择要通过多指标对比验证。此外，数据探索性分析是建模的基础，通过可视化可以发现数据中的关键特征和规律，为后续建模提供方向。
