    key_concepts:
    - 逻辑回归
    chart_types:
    - '**决策边界图**：二维特征下的分类边界'
    - '**ROC 曲线**：不同阈值下的 TPR/FPR'
    - '**系数图**：各特征系数（含显著性）'
    - '**概率分布图**：正负类的预测概率分布'
    - '**校准曲线**：预测概率 vs 实际频率'
    source: math-modeling-skill
  id: mc_85
  formulas:
  - 线性组合：$z = w^T x + b$，其中 $w$ 为权重向量，$x$ 为特征向量，$b$ 为偏置。
  - sigmoid 函数：$\sigma(z) = \frac{1}{1 + e^{-z}}$，将实数映射到 $(0,1)$。
  - 分类概率：$P(y=1|x) = \sigma(w^T x + b) = \frac{1}{1 + e^{-(w^T x + b)}}$。
  - 单样本损失：$L = -[y \log \hat{p} + (1-y) \log(1-\hat{p})]$，其中 $\hat{p}=P(y=1|x)$。
  - L2 正则化目标：$J(w) = -\frac{1}{n}\sum_{i=1}^{n}[ y_i \log \hat{p}_i + (1-y_i) \log(1-\hat{p}_i) ] + \frac{\lambda}{2}\|w\|^2$，$\lambda$
    为正则强度。
