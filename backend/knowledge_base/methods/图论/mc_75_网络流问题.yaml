  formulas:
  - 流量守恒：$$\sum_{v} f(v, u) = \sum_{v} f(u, v), \quad \forall u \neq s, t$$ 其中 $f(u,v)$ 表示边 $(u,v)$ 上的流量，$s$
    为源点，$t$ 为汇点。
  - 容量限制：$$0 \leq f(u, v) \leq c(u, v)$$ 其中 $c(u,v)$ 表示边 $(u,v)$ 的容量。
  - 残差容量：$$c_f(u, v) = \begin{cases} c(u, v) - f(u, v), & (u, v) \in E \\ f(v, u), & (v, u) \in E \\ 0,
    & \text{否则} \end{cases}$$ 其中 $c_f(u,v)$ 表示残差网络中边 $(u,v)$ 的剩余容量。
  - 最小费用最大流目标：$$\min \sum_{(u,v) \in E} f(u, v) \cdot cost(u, v)$$ 其中 $cost(u,v)$ 表示边 $(u,v)$ 上单位流量的费用。
