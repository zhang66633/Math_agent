  content_md: |
    # 遗传算法原理与应用

    > **难度**:进阶 · **预计学习时长**:50 分钟 · **主讲智能体**:🧩 建模手 · **方法类别**:优化

    ## 🎯 学习目标

    学完本单元,你应该能够:

    - 说出遗传算法(GA)的完整流程,理解选择、交叉、变异各自的角色
    - 针对具体问题设计编码方案(二进制/排列/实数),并把约束「装」进适应度函数
    - 手工完成一代 GA 的演化计算(选择概率、交叉、变异)
    - 掌握常用参数区间,知道早熟收敛的表现与对策
    - 在论文中规范地报告 GA 实验结果(多次运行、均值方差、收敛曲线)

    ## 📖 核心概念

    ### 1. 生物隐喻与算法框架

    GA 模拟自然演化:个体(解)组成种群,适应度(目标值)决定繁殖机会,交叉重组基因,变异引入新基因。一轮迭代(一代):

    $$\text{编码} \to \text{初始种群} \to \boxed{\text{评估适应度} \to \text{选择} \to \text{交叉} \to \text{变异}} \to \text{新一代}$$

    > 💡 建模心法:**编码是 GA 成功的一半**。好的编码让交叉/变异操作保持可行性(如 TSP 用排列编码),差的编码会产生大量不可行解,靠罚函数硬压,收敛缓慢。

    ### 2. 三种主流编码

    | 编码 | 基因形式 | 适用问题 | 典型交叉 |
    |------|----------|----------|----------|
    | 二进制 | 0/1 串 | 0-1 组合、参数离散化 | 单点/两点交叉 |
    | 排列 | 城市/任务序列 | TSP、调度、排序 | PMX、OX |
    | 实数 | 浮点向量 | 连续参数优化 | 模拟二进制(SBX)、BLX-$\alpha$ |

    二进制编码连续参数时注意精度:10 位编码区间 $[0,10]$ 的分辨率为 $10/(2^{10}-1) \approx 0.0098$。

    ### 3. 三个算子各司其职

    - **选择**:适应度高的个体获得更多复制机会——决定「谁繁殖」。常用**轮盘赌**(概率正比于适应度)与**锦标赛**(随机抽 $k$ 个比,冠军晋级,通常 $k=2,3$)
    - **交叉**:两个父代交换基因片段——负责**开采**已知好区域。单点交叉:随机切点后交换尾部
    - **变异**:小概率随机翻转/扰动基因——负责**探索**新区域、维持种群多样性、防早熟

    三者配比失衡的典型症状:交叉率过低 → 收敛慢;变异率过高 → 退化为随机搜索;选择压过强 → 早熟(多样性丧失)。

    ### 4. 精英保留与收敛曲线

    每代把历史最优个体**原样复制**进下一代(精英策略),保证最优值单调不降。没有精英保留的 GA,收敛曲线会像心电图一样上下抖动——论文里的收敛曲线图通常要求单调,原因就在此。

    ## 🧮 公式与结论

    ### 轮盘赌选择

    个体 $i$ 被选中的概率正比于适应度 $f_i$(要求 $f_i > 0$):

    $$P(i) = \frac{f_i}{\sum_j f_j}, \qquad \text{期望复制数} = n \cdot \frac{f_i}{\sum_j f_j}$$

    种群大小 $n$ 固定时,适应度高于均值的个体期望复制数大于 1。

    ### 模式定理(Schema Theorem)

    长度为 $l$、含有 $o(H)$ 个固定位、阶为 $\delta(H)$ 的模式 $H$,在比例选择、单点交叉、变异下,下一代中的期望数量满足:

    $$E[m(H, t+1)] \geq m(H, t)\,\frac{f(H)}{\bar f}\left[1 - p_c \frac{\delta(H)}{l-1} - o(H)\,p_m\right]$$

    解读:低阶、短定义距、适应度高于均值的模式数量按指数增长——GA 的搜索实质是**在并行地统计好「积木块」**,这也是 GA 隐含并行性的来源。

    ### 常用参数区间

    | 参数 | 典型值 | 说明 |
    |------|--------|------|
    | 种群大小 | 50–200 | 太小多样性差,太大评估开销高 |
    | 交叉率 $p_c$ | 0.6–0.9 | 主导开采能力 |
    | 变异率 $p_m$ | 0.01–0.1(二进制);$1/l$ 是经典取值 | 主导探索能力 |
    | 锦标赛规模 $k$ | 2–3 | $k$ 越大选择压越强 |
    | 终止条件 | 固定代数 / 最优值多代无改进 | 论文中两者都要报告 |

    ## 💡 经典例题

    ### 例题 1:一代 GA 全程手算

    > 用 5 位二进制编码求 $\max f(x) = x^2$,$x \in [0, 31]$ 整数。初始种群:01101(13)、11000(24)、01000(8)、10011(19)。执行一代选择(轮盘赌)、单点交叉(切点在第 4 位后)、变异(概率 0.1,实际翻转 1 位)。

    **① 评估适应度**:$f = (169, 576, 64, 361)$,总和 $1170$。

    **② 选择(轮盘赌)**:各概率 $169/1170 = 0.144$,$576/1170 = 0.492$,$64/1170 = 0.055$,$361/1170 = 0.309$。设随机数一次实现选出 2、1、4、2 号(这是一次抽样结果,重复实验会不同),父代配成两对:(11000, 01101) 与 (10011, 11000)。

    **③ 交叉**(切点在第 4 位后):

    - 1100|0 × 0110|1 → 11001(25)、01100(12)
    - 1001|1 × 1100|0 → 10010(18)、11001(25)

    **④ 变异**:翻转 10010 的第 2 位 → 11010(26)。

    **⑤ 新一代**:25、12、26、25。适应度 $(625, 144, 676, 625)$:

    $$\text{最大适应度}: 576 \to 676,\qquad \text{平均适应度}: 292.5 \to 517.5$$

    **解析**:一代之内种群质量全面上升,这就是选择-交叉-变异循环的缩影。注意两点:①适应度最高的 24 号(576)被选两次、其基因片段在子代中高频出现——「优秀基因扩散」;②变异也可能产生坏解(本例翻转若落在别处可能降质),它是双刃剑,概率必须小。

    ### 例题 2:TSP 的 PMX 交叉(排列编码)

    > 父代 $P_1 = [1,2,3,4,5,6]$,$P_2 = [2,4,6,1,3,5]$,交叉段为第 3–4 位。用部分匹配交叉(PMX)求两个子代。

    **① 建立映射**:段内对应 $3 \leftrightarrow 6$,$4 \leftrightarrow 1$。

    **② 子代 1**:把 $P_1$ 的第 3–4 位换成 $P_2$ 的段 [6, 1],得到 [1, 2, 6, 1, 5, 6];扫描段外:位置 1 的「1」与段内「1」冲突 → 按映射 $1 \to 4$ 换成 4;位置 6 的「6」冲突 → 按映射 $6 \to 3$ 换成 3。得 $O_1 = [4, 2, 6, 1, 5, 3]$。

    **③ 子代 2**:把 $P_2$ 的段换成 $P_1$ 的 [3, 4],得 [2, 4, 3, 4, 3, 5];位置 2 的「4」冲突 → 换 1;位置 5 的「3」冲突 → 换 6。得 $O_2 = [2, 1, 3, 4, 6, 5]$。

    **检验**:$O_1, O_2$ 都是 $\{1,\dots,6\}$ 的排列 ✓。PMX 的精髓:**先交换段,再按映射修复冲突**,保证子代仍是合法路径——这就是「编码决定算子设计」的实例。

    ### 例题 3:GA 求解 TSP 的实验报告(真实数据)

    > 15 城 TSP(坐标用 `np.random.seed(7); np.random.rand(15, 2)` 生成,精确最优 3.5184,由 Held-Karp 动态规划求得)。GA 配置:种群 50、OX 交叉率 0.85、交换变异率 0.1、精英 3、预算 4650 次路径评估。

    **实验**:独立运行 10 次,最优解相对精确解的差距:

    - 平均 gap **6.47%**,最好一次 **0.00%**(命中精确最优)
    - 首次达到「与最优差距 1% 以内」所需评估次数中位数 **3477**(预算的 3/4)

    **解析**:GA 在 10 次运行中只有 1 次完全求解,且要花掉大部分预算——这就是竞赛论文里**必须报告均值与方差**的原因:只报最好的一次会严重误导。同一实例上,蚁群算法 10 次全中、205 次评估即达标(参见《蚁群算法与组合优化》单元)——组合优化问题上的算法选择,靠的就是这类公平对比实验。

    ## ⚠️ 常见易错点

    1. **适应度出现负数或零,直接套轮盘赌**。概率必须为正;常见处理:线性变换 $f' = f - f_{\min} + \varepsilon$,或改用锦标赛选择(只比大小,天然免疫尺度问题)
    2. **变异率开太大**。$p_m = 0.5$ 的「变异」等于随机扰动半个基因,算法退化为随机搜索;二进制编码的经典值是 $1/l$($l$ 为串长)
    3. **不保留精英,收敛曲线不单调**。论文里图难看还在其次,更要命的是最优解可能被交叉变异「淘汰」,白跑
    4. **编码产生不可行解,只用罚函数硬扛**。排列问题用普通单点交叉会产生重复城市;正确做法是换 PMX/OX 这类**保可行性算子**(罚函数是第二道保险,不是第一道)
    5. **适应度不缩放导致早熟**。演化初期出现「超级个体」,轮盘赌下几代内占领全种群,搜索停滞;对策:适应度缩放(线性/秩缩放)、增大锦标赛规模下限、增大变异率
    6. **只跑一次就报告结果**。随机算法单次运行无统计意义;规范报告 = 多次独立运行 + 均值/标准差/最优值 + 收敛曲线

    ## ✏️ 自测练习(选择题)

    **第 1 题**某 GA 问题的适应度函数可能出现负值(如利润为负的组合),下列处理最稳妥的是:

    A. 对适应度取绝对值后继续用轮盘赌
    B. 改用锦标赛选择:随机抽 $k$ 个个体比适应度,冠军晋级,只依赖序关系
    C. 把负适应度的个体全部淘汰,只保留正值个体
    D. 给所有适应度加上一个足够大的常数后仍按原概率公式选择

    <details><summary>查看答案与解析</summary>
    **答案:B**。轮盘赌要求概率为正,负适应度无法直接归一化;绝对值会扭曲「-5 比 -1 差」的事实,且同样无法处理 0。锦标赛选择只比较大小,对适应度的平移、缩放天然免疫,是竞赛中更稳妥的默认选择。「全部淘汰负值个体」会提前丧失多样性,易早熟;「加常数」只能让概率变正,但选择压力会被常数大小改变,仍需调参,不如直接换锦标赛。
    </details>

    **第 2 题**用 5 位二进制编码整数 $x \in [0, 31]$,编码串 $11010$ 对应的实数值(整数)为:

    A. 25
    B. 11
    C. 26
    D. 21

    <details><summary>查看答案与解析</summary>
    **答案:C**。按「高位在前」解码:$11010_2 = 2^4 + 2^3 + 2^1 = 16 + 8 + 2 = 26$。25 是 $11001_2$——把第三位的 1 错看成 0;11 是把位序从右往左读($01011_2$);21 是 $10101_2$,常见的手滑型错误。若区间是 $[0, 10]$ 而非 $[0, 31]$,还需按 $\frac{26}{2^5-1} \times 10$ 换算——分母是 $2^l - 1$ 而不是 $2^l$,这是编码设计的经典细节。
    </details>

    **第 3 题**TSP 用 PMX 交叉,父代 $P_1 = [1,2,3,4,5,6]$,$P_2 = [2,4,6,1,3,5]$,交叉段为第 3–4 位。子代 1($O_1$)为:

    A. $[1,2,6,1,5,6]$
    B. $[4,2,6,1,5,3]$
    C. $[2,1,3,4,6,5]$
    D. $[1,2,6,4,5,3]$

    <details><summary>查看答案与解析</summary>
    **答案:B**。段内映射:$3 \leftrightarrow 6$,$4 \leftrightarrow 1$。把 $P_1$ 的第 3–4 位换成 $P_2$ 的段 $[6,1]$,得 $[1,2,6,1,5,6]$,再按映射修复冲突:位置 1 的「1」与段内「1」冲突 → 换 4;位置 6 的「6」冲突 → 换 3。得 $O_1 = [4,2,6,1,5,3]$ ✓(仍是 $\{1,\dots,6\}$ 的合法排列)。「$[1,2,6,1,5,6]$」是**只换段不修复**的产物,含重复城市,非法;「$[2,1,3,4,6,5]$」是另一个子代 $O_2$,把两个子代搞混;「$[1,2,6,4,5,3]$」漏修了位置 1 的冲突。PMX 的精髓:先交换段,再按映射修复,保证子代仍是合法路径。
    </details>

    ## 🏆 竞赛实战链接

    - **出镜频率**:GA 是竞赛论文里出现最多的元启发式之一,常用于 TSP 类路径问题、任务调度、参数标定。注意:**能用精确算法的问题(指派、运输)不要上 GA**——方法选择失当是评委眼中的硬伤
    - **论文加分点**:①编码方案与「为什么这样编码」的说明;②可行解保持手段(保可行性算子 + 罚函数的配合);③多运行统计报告与收敛曲线;④与其他算法(SA/PSO/ACO)的公平对比(统一评估预算,参见《启发式算法综合实战》单元)
    - **组合建议**:GA 种群全局搜索 + 局部搜索杂交(即 Memetic 算法),是竞赛里性价比很高的一招

    ## 💻 代码实现

    ```python
    import numpy as np

    rng = np.random.default_rng(42)


    def decode(bits):
        """5 位二进制串 → 整数"""
        return int(sum(b << (4 - i) for i, b in enumerate(bits)))


    POP, BITS, PC, PM, GEN = 20, 5, 0.9, 0.05, 30
    pop = rng.integers(0, 2, (POP, BITS))  # 初始种群

    for gen in range(GEN):
        fit = np.array([decode(ind) ** 2 for ind in pop], dtype=float)
        p = fit / fit.sum()  # 轮盘赌概率
        parents = pop[rng.choice(POP, POP, p=p)]
        off = parents.copy()
        for i in range(0, POP, 2):  # 单点交叉
            if rng.random() < PC:
                k = int(rng.integers(1, BITS))
                off[i, k:], off[i + 1, k:] = parents[i + 1, k:].copy(), parents[i, k:].copy()
        mask = rng.random((POP, BITS)) < PM  # 变异
        off = off ^ mask
        pop = off

    print("最优个体:", max(decode(ind) for ind in pop), "适应度:", max(decode(ind) ** 2 for ind in pop))
    # 典型输出:最优个体 31,适应度 961(31^2 即全局最优)
    ```

    > 30 代内通常收敛到全局最优 $31^2 = 961$;把 `rng.default_rng(42)` 换成无种子可观察随机性。真实问题中把 `decode` 换成你的目标函数即可。

    ## 📚 延伸阅读

    - **教材**:Holland, *Adaptation in Natural and Artificial Systems* — GA 的开山之作,模式定理出处
    - **经典书**:Goldberg, *Genetic Algorithms in Search, Optimization and Machine Learning* — 锦标赛选择、参数建议都出自此书
    - **视频**:B 站搜索「遗传算法 旅行商」,配合可视化理解交叉变异效果最佳
    - **进阶关联**:单点迭代版 GA → 《模拟退火算法》单元;连续优化版 → 《粒子群优化算法》单元;如何选型与对比 → 《启发式算法综合实战》单元;组合优化的另一强者 → 《蚁群算法与组合优化》单元

    ## 🧠 小结

    1. GA = 编码 + 种群 + (选择 → 交叉 → 变异) 循环;选择管「谁繁殖」,交叉管「开采」,变异管「探索」
    2. 编码决定算子设计:二进制/排列/实数三大类,排列问题必须用保可行性的 PMX/OX 交叉
    3. 轮盘赌要求适应度为正;锦标赛只看序,是竞赛中的稳妥默认
    4. 模式定理:低阶、短距、高适应度的模式指数增长——GA 在并行积累「积木块」
    5. 实验报告规范:多次运行 + 均值/标准差 + 收敛曲线 + 公平预算对比;「全局最优」不能乱写
