name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,ocr,search]"
      # 沙箱默认后端是 docker；runner 上 docker daemon 可用但镜像不存在，
      # 不构建的话所有沙箱执行都会失败（2026-10 CI 实测 6 个失败全源于此）。
      # 构建失败不阻塞后续步骤——executor 在镜像缺失时会自动回退 subprocess。
      - name: Build sandbox image
        working-directory: backend
        run: docker build -t mathmodel-sandbox -f Dockerfile.sandbox . || echo "::warning::sandbox image build failed, tests will fall back to subprocess"
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Run tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
