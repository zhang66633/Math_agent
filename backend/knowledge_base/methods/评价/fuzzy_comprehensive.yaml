    ## 🧠 小结

    1. 模糊综合评价用隶属度替代「非此即彼」,是处理定性指标、语言型评价的首选框架
    2. 五步流程:定 U/V/S → 构 R(隶属函数或频数统计,行归一化)→ 定 A → 合成 B → 去模糊化
    3. 合成算子首选 $M(\cdot,+)$ 加权平均型;主因素型会丢失信息,要用必须说明理由
    4. 去模糊化两条路:最大隶属度原则(先验 $\beta \ge 0.5$)与加权平均法(推荐,信息充分)
    5. 因素多时分组建多级评价;隶属度是「程度」不是「概率」,表述时要严谨
