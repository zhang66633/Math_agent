  content_md: |
    # 动态规划与最优子结构

    > **难度**:进阶 · **预计学习时长**:60 分钟 · **主讲智能体**:🧩 建模手 · **方法类别**:优化

    ## 🎯 学习目标

    前置单元:《线性规划与单纯形法》(理解「最优性条件」的思维方式)。学完本单元,你应该能够:

    - 用「最优子结构 + 重叠子问题」两个性质判断一个问题是否适合动态规划(DP)
    - 掌握 DP 三要素:状态定义、状态转移方程、边界条件,并会手工填一张小规模 DP 表
    - 理解 Bellman 方程,以及它与 LP、贪心的适用边界
    - 认识「维数诅咒」,知道状态爆炸时如何降维或转向启发式

    ## 📖 核心概念

    ### 1. DP 的两个前提性质

    - **最优子结构**:问题的最优解包含其子问题的最优解。这是 DP 正确性的根基——反例:给朋友买生日礼物,「自己买得最便宜」与「整体最省」互相冲突(还要考虑对方感受),就不具备最优子结构
    - **重叠子问题**:递归求解时,同一个子问题被反复计算。没有重叠,直接分治即可(如归并排序);有重叠,DP 用空间换时间

    ### 2. 三件套:状态、转移、边界

    | 要素 | 含义 | 自检问题 |
    |------|------|----------|
    | **状态** $f(i, j, \dots)$ | 子问题的最优值,下标刻画「当前局面」 | 这个状态能否唯一决定未来?不能就加维 |
    | **转移方程** | $f(\text{状态}) = \text{opt}\{f(\text{前驱}) + \text{增量}\}$ | 每个前驱状态是否可达?增量含义清楚吗? |
    | **边界条件** | 最小子问题的值 | 初始化用 0 还是 $\pm\infty$? |

    > 💡 建模心法:DP 的难点九成在**状态定义**。定义状态前先问:「要做出后续决策,我还需要知道什么?」需要什么就装进状态里。

    ### 3. 记忆化与递推

    - **自顶向下(记忆化搜索)**:递归 + 缓存,只算用到的子问题——状态空间大但实际触达少时适用
    - **自底向上(填表)**:按拓扑序(依赖顺序)迭代——空间可滚动压缩,竞赛中最常用

    ### 4. Bellman 方程

    DP 的数学表达。对确定性多阶段决策:

    $$f(s) = \min_{a \in A(s)}\left\{ c(s, a) + f(s') \right\}$$

    $f(s)$ 是从状态 $s$ 出发到终点(或从起点到 $s$)的最优代价,$a$ 是决策,$s'$ 是决策后的新状态。带随机性时取期望:

    $$V(s) = \max_{a}\left\{ R(s, a) + \gamma \sum_{s'} P(s' \mid s, a)\, V(s') \right\}$$

    这是马尔可夫决策过程(MDP)的核心方程,也是强化学习的源头——DP 家族的通用语言。

    ## 🧮 公式与结论

    ### DP 与三大范式的适用边界

    | 方法 | 需要的性质 | 典型例子 |
    |------|-----------|----------|
    | 贪心 | 贪心选择性质(局部最优可扩张成全局最优) | Dijkstra、最小生成树 |
    | 分治 | 子问题相互独立 | 归并排序、快速幂 |
    | DP | 最优子结构 + 重叠子问题 | 背包、最短路、序列比对 |
    | LP/IP | 线性结构(或可线性化) | 资源分配、运输、指派 |

    资源分配类问题可以同时用 LP 与 DP 求解:利润函数**线性**时是 LP(参见《线性规划建模实战》单元),**非线性**(学习曲线、规模效应)时 DP 更自然——会看到两种方法殊途同归,是建模成熟度的体现。

    ### 两个高频转移方程

    **0-1 背包**($n$ 件物品,价值 $v_i$、重量 $w_i$,容量 $W$):

    $$dp[i][w] = \max\left(dp[i-1][w],\ dp[i-1][w-w_i] + v_i\right), \qquad dp[0][\cdot] = 0$$

    第一项表示不装第 $i$ 件,第二项表示装($w \geq w_i$ 时)。时间复杂度 $O(nW)$——注意它关于 $W$ 是**伪多项式**:$W$ 按数值而非二进制位数计,因此背包仍是 NP-hard,只是对小容量数值高效。

    **最短路径(Bellman 方程,有向无环图)**:

    $$f(v) = \min_{u \to v}\left\{ f(u) + c(u, v) \right\}$$

    按拓扑序从左到右递推,一次遍历即得——比 Dijkstra 更简单,且**允许负权边**(只要无负环)。

    ## 💡 经典例题

    ### 例题 1:多阶段最短路径(反向递推)

    > 从 A 到 D 必须依次经过 B 层、C 层各一点,边权:$\mathrm{A}\to\mathrm{B}_1/\mathrm{B}_2/\mathrm{B}_3$ 为 2/4/3;$\mathrm{B}_1\to\mathrm{C}_1/\mathrm{C}_2$ 为 7/4,$\mathrm{B}_2\to\mathrm{C}_1/\mathrm{C}_2$ 为 3/2,$\mathrm{B}_3\to\mathrm{C}_1/\mathrm{C}_2$ 为 4/1;$\mathrm{C}_1\to\mathrm{D}$ 为 1,$\mathrm{C}_2\to\mathrm{D}$ 为 5。求最短路及其长度。

    **状态定义**:$f(v)$ = 从 $v$ 到 D 的最短距离。**边界**:$f(D) = 0$。

    **从右往左递推**:

    - $f(\mathrm{C}_1) = 1$,$f(\mathrm{C}_2) = 5$
    - $f(\mathrm{B}_1) = \min(7 + 1,\ 4 + 5) = \min(8, 9) = 8$
    - $f(\mathrm{B}_2) = \min(3 + 1,\ 2 + 5) = \min(4, 7) = 4$
    - $f(\mathrm{B}_3) = \min(4 + 1,\ 1 + 5) = \min(5, 6) = 5$
    - $f(\mathrm{A}) = \min(2 + 8,\ 4 + 4,\ 3 + 5) = \min(10, 8, 8) = 8$

    **答案**:最短距离 8,且**不唯一**:$\mathrm{A} \to \mathrm{B}_2 \to \mathrm{C}_1 \to \mathrm{D}$ 与 $\mathrm{A} \to \mathrm{B}_3 \to \mathrm{C}_1 \to \mathrm{D}$ 都是最优(4+3+1 与 3+4+1)。

    **解析**:「分层图 + 反向递推」是竞赛路径规划的母模板。每个节点只算一次、每次只比较两条入边,总工作量是边数的线性级别;而枚举全部路径是 $3 \times 2 = 6$ 条(本题)到指数级(层数变多时)。DP 的威力就是**把指数枚举折叠成逐层比较**。

    ### 例题 2:0-1 背包(手填 DP 表)

    > 3 件物品:价值/重量为 (6, 2)、(10, 3)、(12, 4),容量 $W = 5$。求最大价值。

    **转移**:$dp[i][w] = \max(dp[i-1][w],\ dp[i-1][w-w_i] + v_i)$。逐行填表:

    | $w$ | 0 | 1 | 2 | 3 | 4 | 5 |
    |-----|---|---|---|---|---|---|
    | 不装任何物品 | 0 | 0 | 0 | 0 | 0 | 0 |
    | 物品 1(6, 2) | 0 | 0 | 6 | 6 | 6 | 6 |
    | 物品 2(10, 3) | 0 | 0 | 6 | 10 | 10 | **16** |
    | 物品 3(12, 4) | 0 | 0 | 6 | 10 | 12 | **16** |

    - $dp[2][5] = \max(dp[1][5]=6,\ dp[1][2]+10 = 16) = 16$(装物品 2,剩容量 2 装物品 1)
    - $dp[3][5] = \max(dp[2][5]=16,\ dp[2][1]+12 = 12) = 16$(物品 3 装不下就放弃,保持 16)

    **答案**:最大价值 16,装物品 1 + 2(重量 $2+3=5$ 恰好用满)。**回溯**:从 $dp[3][5]$ 往前查,值从 $dp[2][5]$ 继承说明物品 3 未选;$dp[2][5] \neq dp[1][5]$ 说明物品 2 已选;$dp[1][2]=6$ 说明物品 1 已选。

    **解析**:填表顺序 = 拓扑序;每个格子只做一次比较,总复杂度 $O(nW)$。留意 $W$ 大(如 $10^6$)而 $n$ 小的情况——$O(nW)$ 依然太大,此时改用分支定界或启发式(参见《遗传算法原理与应用》单元),DP 不是万能的。

    ### 例题 3:资源分配(DP 与 LP 的对话)

    > 4 台设备分配给甲、乙、丙三个车间,各车间获 $x$ 台时的利润为:

    | $x$ | 0 | 1 | 2 | 3 | 4 |
    |-----|---|---|---|---|---|
    | 甲 $g_1$ | 0 | 4 | 7 | 9 | 10 |
    | 乙 $g_2$ | 0 | 3 | 5 | 8 | 8 |
    | 丙 $g_3$ | 0 | 2 | 5 | 6 | 9 |

    **反向递推**:设 $f_k(s)$ = 把 $s$ 台设备分配给第 $k$ 个及之后车间的最大利润:

    $$f_k(s) = \max_{0 \leq x \leq s}\left\{ g_k(x) + f_{k+1}(s - x) \right\}$$

    - $f_3(s) = g_3(s)$:0、2、5、6、9($s = 0\dots 4$)
    - $f_2(4) = \max\{g_2(0)+9,\ g_2(1)+6,\ g_2(2)+5,\ g_2(3)+2,\ g_2(4)+0\} = \max\{9, 9, 10, 10, 8\} = 10$
    - $f_1(4) = \max\{g_1(0)+10,\ g_1(1)+8,\ g_1(2)+5,\ g_1(3)+2,\ g_1(4)+0\}$。先算 $f_2(3) = \max\{6, 5, 7, 8, 8\} = 8$,$f_2(2) = \max\{5, 4, 5, 5\} = 5$,$f_2(1) = \max\{2, 3\} = 3$,$f_2(0) = 0$。于是 $f_1(4) = \max\{10,\ 4+8=12,\ 7+5=12,\ 9+3=12,\ 10+0=10\} = 12$

    **答案**:最大利润 12,最优方案**不唯一**:(1, 1, 2) 得 $4+3+5=12$;(2, 0, 2) 得 $7+0+5=12$;(3, 1, 0) 得 $9+3+0=12$。

    **解析**:本题若利润函数是线性的,它就是一个 LP(变量 $x_1,x_2,x_3$,约束 $x_1+x_2+x_3 \leq 4$)——这正是《线性规划与单纯形法》单元的「三要素」。**利润线性 → LP;利润非线性 → DP**。同一道题的两张面孔,建议在论文中主动写出这种对比,展示模型选择的思考过程。

    ## ⚠️ 常见易错点

    1. **状态定义含糊,下标含义不明**。$dp[i]$ 的 $i$ 是「前 $i$ 件」还是「第 $i$ 件」?写代码前先用一句话写清楚,否则转移方程必错
    2. **转移时数组越界/负下标**。$dp[i-1][w-w_i]$ 在 $w < w_i$ 时不存在;要么先判 `if w >= w_i`,要么把不合法状态初始化成 $-\infty$
    3. **初始化用错值**。max 问题用 $-\infty$(或 0,取决于状态语义),min 问题用 $+\infty$;边界错一格,全表错一半
    4. **硬套 DP 到没有最优子结构的问题**。带全局耦合(如「总预算在各部门间再分配」)或多智能体博弈时,局部最优拼不出全局最优,先验证性质再动手
    5. **状态维数爆炸(维数诅咒)**。三件套里加一维,复杂度就乘一个因子;背包 $O(nW)$ 在 $W$ 大时失效,多维状态更甚——考虑状态压缩、滚动数组或转启发式
    6. **把「递推」当「递归」写导致重复计算**。裸递归解斐波那契是指数复杂度;竞赛代码一律记忆化或迭代,并在论文里写明复杂度

    ## ✏️ 自测练习(选择题)

    **第 1 题**硬币面值为 1、5、11,要凑出 15 元。动态规划求得的最少硬币数与贪心策略(每次先取最大面值)的结果分别是:

    A. 3 枚与 3 枚
    B. 5 枚与 3 枚
    C. 3 枚与 5 枚
    D. 4 枚与 5 枚

    <details><summary>查看答案与解析</summary>
    **答案:C**。DP:$f(n) = \min\{f(n-1), f(n-5), f(n-11)\} + 1$,$f(0) = 0$,$f(15) = \min\{f(14)+1,\ f(10)+1,\ f(4)+1\} = \min\{5, 3, 5\} = 3$,最优方案是 $5+5+5$。贪心先取 11,剩 4 只能再取 4 枚 1 元,共 **5 枚**。贪心失败的原因:最大面值的选择与最优子问题不兼容——贪心选择性质不成立。这正是「为什么需要 DP」的经典反例:局部最优拼不出全局最优。「4 枚」是把问题算成了凑 14 元的结果。
    </details>

    **第 2 题**0-1 背包:3 件物品价值/重量为 $(6, 2)$、$(10, 3)$、$(12, 4)$,容量 $W = 5$。最大总价值为:

    A. 18(装物品 1 与 3)
    B. 12(只装物品 3)
    C. 22(装物品 2 与 3)
    D. 16(装物品 1 与 2)

    <details><summary>查看答案与解析</summary>
    **答案:D**。转移 $dp[i][w] = \max(dp[i-1][w],\ dp[i-1][w-w_i] + v_i)$,填表得 $dp[3][5] = 16$:装物品 1+2,重量 $2+3=5$ 恰好用满。「18」按价值贪心先拿 12 再拿 6,但重量 $4+2=6>5$ 超重,不可行;「22」更离谱,重量 $3+4=7>5$;「12」是只装单件物品 3 的可行解,但放弃物品 2 的收益是错误决策。DP 的每个格子只做一次比较,把指数级组合折叠成 $O(nW)$ 填表。
    </details>

    **第 3 题**有人说:「0-1 背包是 NP-hard 问题,而 DP 给出了 $O(nW)$ 的多项式算法,这说明 P = NP。」该说法错在:

    A. $O(nW)$ 关于输入规模不是多项式:$W$ 在输入中只占 $\log_2 W$ 位,复杂度随 $W$ 的数值指数增长
    B. 背包问题其实不是 NP-hard,$O(nW)$ 是真正的多项式算法
    C. $O(nW)$ 中的 $n$ 是物品数,与输入规模无关
    D. DP 解背包只对小容量有效,所以它不算算法

    <details><summary>查看答案与解析</summary>
    **答案:A**。$O(nW)$ 是**伪多项式**复杂度:输入编码 $W$ 只需 $\log_2 W$ 个二进制位,而算法耗时随 $W$ 的数值(即 $2^{\log_2 W}$)线性增长,相对于输入长度是指数级。它不推翻 P≠NP。实践含义:容量数值小时 DP 非常高效,$W$ 很大时立即转向分支定界或启发式——判断「$W$ 的数值大小」是竞赛中选算法的关键一步。「背包不是 NP-hard」与事实相反;「$n$ 与输入规模无关」把问题答偏了。
    </details>

    ## 🏆 竞赛实战链接

    - **出镜频率**:多阶段决策类题目是国赛常客。2020 国赛 B「穿越沙漠」是典型的多阶段资源决策(水量、补给策略,DP/博弈思路);路径规划、资源分配、任务排序类问题都绕不开 DP
    - **论文加分点**:①画出**阶段-状态示意图**(分层图/网格),把转移方程写清楚并解释每项含义;②给出复杂度分析与伪多项式说明;③DP 结果与贪心/枚举做小规模对照,验证正确性
    - **与 LP 的关系**:能用 LP 就用 LP(有全局最优性理论);LP 写不出(非线性利润、时序耦合、整数规模)再考虑 DP——两个单元的对比本身就可写入论文的模型选择章节

    ## 💻 代码实现

    ```python
    from functools import lru_cache
    import numpy as np


    # 自顶向下:记忆化(斐波那契)
    @lru_cache(maxsize=None)
    def fib(n):
        return n if n < 2 else fib(n - 1) + fib(n - 2)


    print(fib(30))  # 832040, 指数级裸递归 → 线性记忆化

    # 自底向上:0-1 背包(例 2)
    v, w, W = [6, 10, 12], [2, 3, 4], 5
    n = len(v)
    dp = np.zeros((n + 1, W + 1), dtype=int)
    for i in range(1, n + 1):
        for k in range(W + 1):
            dp[i][k] = dp[i - 1][k]  # 不装
            if k >= w[i - 1]:  # 装(注意下标偏移)
                dp[i][k] = max(dp[i][k], dp[i - 1][k - w[i - 1]] + v[i - 1])
    print(dp[n][W])  # 16

    # 分层图最短路(例 1):节点按拓扑序编号,dp[v] = min(dp[u] + c(u,v))
    # 边表:(起点, 终点, 权值), 拓扑序: A=0, B1..B3=1..3, C1..C2=4..5, D=6
    edges = [
        (0, 1, 2),
        (0, 2, 4),
        (0, 3, 3),
        (1, 4, 7),
        (1, 5, 4),
        (2, 4, 3),
        (2, 5, 2),
        (3, 4, 4),
        (3, 5, 1),
        (4, 6, 1),
        (5, 6, 5),
    ]
    N, INF = 7, float("inf")
    dp = [INF] * N
    dp[6] = 0  # 终点 D 距离 0
    for u in range(N - 1, -1, -1):  # 按拓扑序倒推
        for a, b, c in edges:
            if a == u:
                dp[a] = min(dp[a], dp[b] + c)
    print(dp[0])  # 8
    ```

    ## 📚 延伸阅读

    - **教材**:《算法导论》第 14、15 章(DP 与贪心)— 最优子结构讲得最严谨
    - **经典书**:Bellman, *Dynamic Programming* — 开山之作,Bellman 方程的出处
    - **进阶关联**:大规模组合问题 DP 失效 → 《遗传算法原理与应用》《蚁群算法与组合优化》单元;多目标下的动态决策 → 《多目标优化与NSGA-II》单元;DP 的最优性条件视角 → 《凸优化与KKT条件》单元

    ## 🧠 小结

    1. DP 的前提:最优子结构(局部最优拼出全局最优)+ 重叠子问题(值得缓存);缺一不可
    2. 三件套:状态定义(最花心思)、转移方程、边界条件;填表顺序 = 依赖拓扑序
    3. Bellman 方程是 DP 的通用语言,随机化后就是 MDP/强化学习的根基
    4. 复杂度常写 $O(\text{状态数} \times \text{决策数})$,伪多项式要注明(背包 $O(nW)$)
    5. 方法选择:线性 → LP;贪心性质 → 贪心;最优子结构 → DP;全都不满足且规模大 → 启发式
