    - '**参数敏感性图**：参数b对算法性能的影响'
    source: math-modeling-skill
  id: mc_64
  formulas:
  - 包围猎物：\vec{D} = |\vec{C} \cdot \vec{X}^*(t) - \vec{X}(t)|，其中 \vec{X}^*(t) 为当前最优鲸鱼位置，\vec{X}(t) 为当前鲸鱼位置，\vec{C}
    为摇摆系数。
  - 位置更新：\vec{X}(t+1) = \vec{X}^*(t) - \vec{A} \cdot \vec{D}，其中 \vec{A} 为收敛系数，随迭代从2线性递减到0。
  - 螺旋更新：\vec{X}(t+1) = \vec{D}' \cdot e^{bl} \cdot \cos(2\pi l) + \vec{X}^*(t)，其中 \vec{D}' = |\vec{X}^*(t)
    - \vec{X}(t)|，b 为对数螺旋形状常数，l 为[-1,1]随机数。
  - 收敛系数：\vec{A} = 2a \cdot \vec{r}_1 - a，其中 a 从2线性递减到0，\vec{r}_1 为[0,1]随机向量。
  - 摇摆系数：\vec{C} = 2 \cdot \vec{r}_2，其中 \vec{r}_2 为[0,1]随机向量。
