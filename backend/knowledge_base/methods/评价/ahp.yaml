    ## 🧠 小结

    1. AHP 三步:建层次结构 → 成对比较矩阵(1-9 标度)→ 求权重 + 一致性检验;两两比较是它区别于「直接打分法」的核心
    2. 权重求法:特征值法最准,和积法、方根法适合手算;三者在小规模问题上结果几乎一致
    3. 一致性是生命线:$CR = \dfrac{(\lambda_{\max}-n)/(n-1)}{RI} < 0.1$ 才可接受,失败要定位矛盾元素并复核修正
    4. 层次总排序把准则权重与方案得分线性合成,是最终排名的直接依据;总排序也要做一致性检验
    5. AHP 的价值在「结构化人的判断」,但要清醒认识到它依赖主观判断——用敏感性分析和主客观组合赋权来兜底
