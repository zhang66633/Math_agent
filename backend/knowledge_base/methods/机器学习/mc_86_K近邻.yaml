method_card:
  name: K近邻
  name_en: K-Nearest Neighbors, KNN
  category:
  - 机器学习
  principle: 'KNN 是一种**基于实例**的惰性学习算法：不做显式训练，预测时直接找与待测样本最近的 K 个训练样本，按多数投票（分类）或均值（回归）给出结果。原理直观、实现简单，适合中小规模数据。


    #### 3.1 基本原理


    **距离度量**（闵可夫斯基距离，$p=2$ 时是欧氏距离）：

    $$

    d(x, y) = \left( \sum_{j=1}^{m} |x_j - y_j|^p \right)^{1/p}

    $$


    **分类决策**（多数投票）：

    $$

    \hat{y}(x) = \arg\max_{c} \sum_{i \in N_K(x)} \mathbb{I}(y_i = c)

    $$


    其中 $N_K(x)$ 是 $x$ 的 K 个最近邻集合。


    **回归决策**（均值）：

    $$

    \hat{y}(x) = \frac{1}{K} \sum_{i \in N_K(x)} y_i

    $$


    **加权投票**（可选）：距离越近权重越大，$w_i = 1/d(x, x_i)$。


    #### 3.2 使用条件与常见坑


    | 条件/坑 | 说明 | 应对 |

    |---------|------|------|

    | **必须特征缩放** | 量纲差异大时距离被大尺度特征主导 | 用 StandardScaler/MinMaxScaler 先归一化 |

    | K 值选择 | K 太小过拟合，太大欠拟合 | 交叉验证选 K（常用 3-15 的奇数） |

    | 维度灾难 | 高维下距离区分度急剧下降 | 先用 PCA（05 §4）降维或换模型 |

    | 预测耗时 | 无训练但有预测 O(n)，样本大时慢 | 大数据集换决策树/逻辑回归 |

    | 类别不平衡 | 多数类邻居占优 | 加权投票或过采样 |

    | 特征冗余 | 无关特征污染距离 | 特征选择后再用 |


    #### 3.3 适用范围


    | 题型类型 | 典型问题 | 特征 |

    |---------|---------|------|

    | 分类预测 | 品种识别、相似匹配 | 中小规模 |

    | 回归预测 | 相似样本估值 | 连续目标 |

    | 异常检测 | 距离异常点 | 无标签可用 |

    | 缺失值填充 | 用近邻均值填充 | 05 §1.1 |'
  applicable_when:
  - 数据已完成特征缩放（如 StandardScaler/MinMaxScaler），避免量纲差异主导距离。
  - 样本规模为中小规模，预测耗时 O(n) 可接受。
  - 特征维度不高，或已通过 PCA 等降维缓解维度灾难。
  - 类别分布相对均衡，或已采用加权投票/过采样处理不平衡。
  - 特征已做选择，去除了无关特征对距离的污染。
  typical_scenarios:
  - 样本量中小规模、特征维度不高时，用 KNN 做分类预测（如品种识别、相似匹配）。
  - 目标为连续变量且样本间相似性有实际意义时，用 KNN 做回归估值。
  - 无标签数据中需要基于距离识别异常点时，可用 KNN 的距离异常检测。
  - 数据存在缺失值时，可用近邻均值对缺失值进行填充。
  code_snippets:
  - language: python
    description: K近邻 实现要点
    code: "import numpy as np\nimport matplotlib.pyplot as plt\nfrom sklearn.datasets import load_iris\n\
      from sklearn.neighbors import KNeighborsClassifier\nfrom sklearn.preprocessing import StandardScaler\n\
      from sklearn.model_selection import train_test_split, cross_val_score\nfrom sklearn.metrics import\
      \ accuracy_score\n\ndef knn_classification(X_train, y_train, X_test, y_test, k=5, weights='distance'):\n\
      \    \"\"\"\n    KNN 分类\n    :param X_train: 训练特征\n    :param y_train: 训练标签\n    :param X_test:\
      \ 测试特征\n    :param y_test: 测试标签\n    :param k: 近邻数\n    :param weights: 'uniform' 等权 / 'distance'\
      \ 距离加权\n    :return: 模型, 预测结果, 准确率\n    \"\"\"\n    # 关键：KNN 对特征尺度极度敏感，必须先标准化\n    scaler = StandardScaler()\n\
      \    X_train_s = scaler.fit_transform(X_train)\n    X_test_s = scaler.transform(X_test)\n\n    model\
      \ = KNeighborsClassifier(n_neighbors=k, weights=weights, p=2)\n    model.fit(X_train_s, y_train)\n\
      \n    y_pred = model.predict(X_test_s)\n    acc = accuracy_score(y_test, y_pred)\n\n    return model,\
      \ y_pred, acc, scaler\n\ndef tune_k(X_train, y_train, X_test, y_test, k_range=range(1, 21)):\n \
      \   \"\"\"调 K：交叉验证找最优近邻数（奇数优先）\"\"\"\n    scaler = StandardScaler()\n    X_train_s = scaler.fit_transform(X_train)\n\
      \    X_test_s = scaler.transform(X_test)\n\n    cv_means, test_accs = [], []\n    for k in k_range:\n\
      \        model = KNeighborsClassifier(n_neighbors=k, weights='distance')\n        cv = cross_val_score(model,\
      \ X_train_s, y_train, cv=5).mean()\n        model.fit(X_train_s, y_train)\n        test_accs.append(accuracy_score(y_test,\
      \ model.predict(X_test_s)))\n        cv_means.append(cv)\n\n    best_k = k_range[int(np.argmax(cv_means))]\n\
      \n    plt.figure(figsize=(8, 6))\n    plt.plot(list(k_range), cv_means, 'o-', label='CV Accuracy')\n\
      \    plt.plot(list(k_range), test_accs, 's-', label='Test Accuracy')\n    plt.axvline(best_k, color='r',\
      \ linestyle='--', label=f'Best K={best_k}')\n    plt.xlabel('K')\n    plt.ylabel('Accuracy')\n \
      \   plt.title('KNN: Accuracy vs K')\n    plt.legend()\n    plt.grid(alpha=0.3)\n    plt.show()\n\
      \    return best_k\n\n# 端到端示例（可直接运行）\nif __name__ == '__main__':\n    data = load_iris()\n    X_train,\
      \ X_test, y_train, y_test = train_test_split(\n        data.data, data.target, test_size=0.3, random_state=42)\n\
      \    model, y_pred, acc, scaler = knn_classification(X_train, y_train, X_test, y_test, k=5)\n  \
      \  print(f\"K=5 准确率: {acc:.4f}\")\n    best_k = tune_k(X_train, y_train, X_test, y_test)\n    print(f\"\
      交叉验证最优 K = {best_k}\")\n"
