  unit_id: modeler_sa_01
  content_md: |
    # 模拟退火算法

    > **难度**:进阶 · **预计学习时长**:45 分钟 · **主讲智能体**:🧩 建模手 · **方法类别**:优化

    ## 🎯 学习目标

    学完本单元,你应该能够:

    - 讲清退火的物理隐喻,写出 Metropolis 接受准则并会计算接受概率
    - 设计一套完整的 SA:初始温度、冷却计划、内循环长度、终止条件
    - 为具体问题(连续/组合)设计合适的邻域结构,并解释为什么邻域决定成败
    - 用真实实验数据说明 SA 的适用边界,并与其他算法做公平对比

    ## 📖 核心概念

    ### 1. 物理隐喻:退火 = 可控的「犯错」

    金属加热后缓慢冷却,原子在高温下剧烈运动(全局探索),温度降低后逐渐稳定(收敛到低能态)。SA 把它翻译成算法:**温度高时允许接受变差的解(跳出局部最优),温度低时只接受改进(精细收敛)**。Metropolis 等人 1953 年提出采样准则,Kirkpatrick 等人 1983 年把它变成优化算法。

    ### 2. Metropolis 准则

    从当前解 $x$ 随机生成邻域解 $x'$,目标为最小化 $f$:

    - 若 $f(x') < f(x)$:无条件接受($x \leftarrow x'$)
    - 若 $f(x') \geq f(x)$:以概率 $\exp\left(-\dfrac{f(x') - f(x)}{T}\right)$ 接受

    温度 $T$ 是唯一的「容错旋钮」:同一差解,高温下容易接受,低温下几乎必拒绝。

    ### 3. 冷却计划(Cooling Schedule)三要素

    | 要素 | 常用方案 | 说明 |
    |------|----------|------|
    | 初始温度 $T_0$ | 接受率法:做若干随机移动,取 $T_0 = -\overline{\Delta} / \ln \chi_0$ | $\overline{\Delta}$ 为平均恶化量,$\chi_0$ 为目标初始接受率(常取 0.8–0.9) |
    | 降温函数 | 几何降温 $T_{k+1} = \alpha T_k$,$\alpha \in [0.8, 0.99]$ | $\alpha$ 接近 1 则慢而稳 |
    | 内循环长度 | 每温度下 $L$ 次移动($L$ 与邻域规模同阶) | 保证近似「热平衡」 |

    终止条件三选一:$T < T_{\min}$、总评估次数到预算、连续多轮最优值无改进(竞赛中预算约束最实际)。

    ### 4. 邻域结构:SA 的真正灵魂

    邻域 = 「从当前解一步能走到哪些解」。同一问题,邻域不同,算法表现天差地别:

    - 连续问题:高斯扰动 $x' = x + \mathcal{N}(0, \sigma)$,步长 $\sigma$ 需随温度收缩
    - TSP:**交换两个城市**(swap)很弱——破坏了太多边;边交换 **2-opt**(反转一段)更强,大量边被保留
    - 调度问题:交换两个任务、把任务挪到另一位置

    > 💡 建模心法:**SA 只做「本地小动作」**。若你的邻域覆盖了几乎整个解空间,SA 就退化成了随机重启——它靠的是「相近的解质量也相近」这个光滑性假设。

    ## 🧮 公式与结论

    ### 接受概率的直观量级

    $$\text{接受概率} = \exp\left(-\frac{\Delta}{T}\right), \quad \Delta = f(x') - f(x) \geq 0$$

    | 情形 | 概率 | 直觉 |
    |------|------|------|
    | $\Delta \ll T$ | $\approx 1$ | 高温/小幅恶化:几乎照单全收 |
    | $\Delta = T$ | $e^{-1} \approx 0.368$ | 分水岭 |
    | $\Delta \gg T$ | $\approx 0$ | 低温/大幅恶化:几乎必拒 |

    ### 几何降温的步数计算

    从 $T_0$ 降到 $T_{\min}$ 需要的温度台阶数:

    $$k = \frac{\ln(T_{\min}/T_0)}{\ln \alpha}$$

    例:$T_0 = 100,\ T_{\min} = 0.01$:$\alpha = 0.9$ 时 $k = \ln(10^{-4})/\ln 0.9 \approx 87$ 步;$\alpha = 0.99$ 时 $k \approx 916$ 步——降温率从 0.9 调到 0.99,计算量涨 10 倍,这是「慢降温换质量」的代价。

    ### 理论保证(知道即可)

    Geman 兄弟证明:取**对数降温** $T_k = T_0 / \ln(1+k)$ 且内循环充分长时,SA 以概率 1 收敛到全局最优。但该进度慢到不可用;实践中的几何降温**没有**全局收敛保证——所以 SA 的结果在论文里只能说「高质量近似解」。

    ## 💡 经典例题

    ### 例题 1:离散能量地形上的手算

    > 状态空间 $\{1,2,3,4,5\}$,能量 $E = [10,\ 4,\ 8,\ 2,\ 6]$,邻域为相邻状态(±1)。从 $x=1$ 出发,求全局最小(在 $x=4$,$E=2$)。

    **观察**:$x=2$ 是局部最小($E=4$),贪心下降会停在这里。看 SA 如何跨越:

    **高温阶段 $T = 10$**:

    - 从 1 移到 2:$\Delta = 4 - 10 = -6 < 0$,接受
    - 从 2 移到 3:$\Delta = 8 - 4 = 4$,接受概率 $e^{-4/10} = e^{-0.4} \approx 0.670$
    - 从 2 退回 1:$\Delta = 6$,接受概率 $e^{-0.6} \approx 0.549$

    **低温阶段 $T = 1$**:

    - 从 2 移到 3:$\Delta = 4$,接受概率 $e^{-4} \approx 0.018$——几乎必拒,解被「冻住」

    **解析**:高温时上坡概率超过一半,粒子能在 $\{1,2,3\}$ 之间自由游走,一旦落入 3 就有机会滑向 4;低温时任何上坡都被拒绝,只能下坡——这正是「先探索、后收敛」的温度戏法。整条轨迹 $1 \to 2 \to 3 \to 4$ 就完成了一次「跳出局部最优」。

    ### 例题 2:TSP 上 SA 的真实表现(实验数据)

    > 15 城 TSP(`np.random.seed(7); np.random.rand(15, 2)`,精确最优 3.5184)。SA 配置:随机初始路径、swap 邻域、$T_0 = 5$、$\alpha = 0.995$、预算 5000 次评估。

    **实验**:独立 10 次运行:平均 gap **9.62%**,最好一次 0.00%;首次达到 1% 误差内所需评估中位数 **1116** 次。

    **解析**:同样的 15 城实例,蚁群算法 10 次全中、平均 205 次评估达标(参见《蚁群算法与组合优化》单元)——差距不在算法原理,而在**邻域**:swap 一步破坏 4 条边、保留 $n-4$ 条,信息损失大;换成 2-opt 或结合 Lin-Kernighan 式的局部搜索,SA 才能追上。这个实验是「邻域设计决定算法成败」最直接的证据。

    ### 例题 3:初始温度与降温率的选择(手算)

    > 连续优化问题,初步采样 100 次随机移动,平均恶化量 $\overline{\Delta} = 30$。按接受率法设计 $T_0$,并估算降温成本。

    **初始温度**:取目标初始接受率 $\chi_0 = 0.9$:

    $$T_0 = -\frac{\overline{\Delta}}{\ln \chi_0} = -\frac{30}{\ln 0.9} \approx -\frac{30}{-0.105} \approx 285$$

    **降温预算**:若 $\alpha = 0.95$,内循环 $L = 20$,从 $T_0 = 285$ 降到 $T_{\min} = 0.01$:温度台阶数 $k = \ln(28500)/\ln(1/0.95) = \ln 28500 / 0.0513 \approx 10.258/0.0513 \approx 200$ 轮,总评估数 $\approx 200 \times 20 = 4000$——一张「预算表」就出来了。

    **解析**:接受率法的好处是 $T_0$ 不靠拍脑袋:初始接受率 0.9 意味着算法开局几乎在随机游走(充分探索),随后逐轮收紧。竞赛论文里把这三行计算写出来,参数设置就从「玄学」变成了「有依据」。

    ## ⚠️ 常见易错点

    1. **初始温度拍脑袋**。$T_0$ 太小 → 开局就冻住,等于带重启的贪心;$T_0$ 太大 → 预算浪费在纯随机游走上。用接受率法或做预实验
    2. **接受准则方向写反**。最大化问题中「更差」意味着 $f(x') < f(x)$,接受概率应为 $\exp((f(x')-f(x))/T)$(指数内是负数);两种情形统一写成 $\exp(-\Delta/T)$,其中 $\Delta$ = 新解目标减当前解目标,但最小化与最大化对「差解」的定义相反
    3. **只记录当前解,不记录历史最优**。SA 允许走差路,最终返回的必须是**整个轨迹上的最优**,不是最后一步停留的解——少存一个变量,答案就错了
    4. **邻域步长不随温度收缩**。连续问题里固定大步长,低温阶段永远在最优解周围震荡、精度上不去;步长应随 $T$ 递减或采用自适应步长
    5. **内循环太短**。每温度只走 1–2 步就降温,系统根本达不到该温度下的平衡,退火动力学失真;$L$ 取邻域规模同量级
    6. **宣称「SA 求得全局最优」**。几何降温无全局收敛保证,论文应写「以概率意义逼近最优」+ 多次运行统计;需要保证就换精确算法或分支定界

    ## ✏️ 自测练习(选择题)

    **第 1 题**最小化问题中,当前温度 $T = 10$,邻域解使目标值恶化 $\Delta = 5$。该解被接受的概率约为:

    A. $e^{-5} \approx 0.0067$
    B. $e^{-1} \approx 0.368$
    C. $1 - 5/10 = 0.5$
    D. $e^{-0.5} \approx 0.607$

    <details><summary>查看答案与解析</summary>
    **答案:D**。接受概率 $P = \exp(-\Delta/T) = \exp(-5/10) = e^{-0.5} \approx 0.607$——高温下小幅恶化照单全收。$e^{-5}$ 漏了除以温度 $T$;$e^{-1}$ 是把 $\Delta/T = 0.5$ 记成了 1(即 $\Delta = T$ 的分水岭情形);$0.5$ 是线性化的错误直觉。温度是唯一的「容错旋钮」:同一差解,低温下几乎必拒——这正是「先探索、后收敛」的温度戏法。
    </details>

    **第 2 题**理论上能保证 SA 以概率 1 收敛到全局最优的降温函数是什么?实践中为什么不用它?

    A. 对数降温 $T_k = T_0 / \ln(1+k)$,因为收敛太慢,计算上不可用
    B. 几何降温 $T_{k+1} = \alpha T_k$,因为它只在 $\alpha$ 接近 1 时收敛
    C. 对数降温,因为它会发散
    D. 指数降温,因为它需要先估计最优值

    <details><summary>查看答案与解析</summary>
    **答案:A**。Geman 兄弟证明:对数降温 $T_k = T_0/\ln(1+k)$ 配充分长的内循环,SA 以概率 1 收敛到全局最优,但从 $T_0 = 100$ 降到 $T = 1$ 需要 $k \approx e^{100} - 1$ 轮,慢到不可用。实践中用几何降温 $T_{k+1} = \alpha T_k$($\alpha \in [0.8, 0.99]$),速度快但**没有**全局收敛保证——所以论文里只能说「高质量近似解」,措辞必须谨慎。「对数降温会发散」与定理结论相反;几何降温无论 $\alpha$ 取值都没有全局收敛保证。
    </details>

    **第 3 题**用 SA 求解 TSP 时,swap(交换两个城市)与 2-opt(反转一段路径)两种邻域,2-opt 通常明显更强,原因是:

    A. swap 一步只改变 1 条边,改动太小容易卡死
    B. 2-opt 一步改变 4 条边,探索更彻底
    C. 2-opt 每次只断开并重连 2 条边,保留了路径绝大部分结构,更符合「相近解质量相近」的光滑性假设
    D. 两者本质等价,强弱差异只来自随机种子

    <details><summary>查看答案与解析</summary>
    **答案:C**。swap 交换两个城市会破坏 4 条边($i-1\to i,\ i\to i+1,\ j-1\to j,\ j\to j+1$),信息损失大;2-opt 反转一段只断开 2 条边并换 2 条新边,保留了其余 $n-2$ 条边的结构。SA 依赖「相近的解质量也相近」的光滑性假设,改动越小的邻域越能精细搜索。「2-opt 改 4 条边」把两个算子的边数记反;swap 改的是 4 条而非 1 条;两者差异是结构性的,与随机种子无关。同实例实验:swap 邻域平均 gap 9.62%,换成 2-opt 后同样预算下质量显著提升。
    </details>

    ## 🏆 竞赛实战链接

    - **出镜频率**:SA 常作为**对比算法**或**局部精修器**出现:与 GA/PSO 同题对比(证明所选算法更优)、接在 GA 后做局部搜索(即 Memetic 思路)、求解中等规模的 TSP/VRP/排班问题
    - **论文加分点**:①冷却计划的**依据**(接受率法算 $T_0$、预算表算 $\alpha$);②邻域设计与「连通性」论证;③参数敏感性:$\alpha$ 取几档做对比,画出「质量-时间」权衡
    - **组合建议**:单点迭代的特点让 SA 极易与任何算法级联(「先 GA 全局、再 SA 局部」),是竞赛中性价比极高的混合策略

    ## 💻 代码实现

    ```python
    import numpy as np

    rng = np.random.default_rng(42)

    # 15 城 TSP(与本文实验同实例,精确最优 3.5184)
    np.random.seed(7)
    pts = np.random.rand(15, 2)
    d = np.sqrt(((pts[:, None] - pts[None]) ** 2).sum(-1))
    n = len(pts)


    def tour_len(t):
        return sum(d[t[i], t[(i + 1) % n]] for i in range(n))


    tour = rng.permutation(n).tolist()
    cur = tour_len(tour)
    best_tour, best = tour.copy(), cur

    T, alpha, budget = 5.0, 0.995, 5000
    evals = 0
    while evals < budget:
        t = tour.copy()
        i, j = rng.choice(n, 2, replace=False)  # swap 邻域
        t[i], t[j] = t[j], t[i]
        fp = tour_len(t)
        if fp < cur or rng.random() < np.exp((cur - fp) / T):
            tour, cur = t, fp  # Metropolis 准则
        if cur < best:
            best_tour, best = tour.copy(), cur  # 记录历史最优!
        T *= alpha
        evals += 1

    print("最优路径长度: %.4f" % best)  # 多次运行均值约 3.857(精确最优 3.5184)
    ```

    > 把 swap 换成 2-opt(反转一段)后,同样的预算下解的质量会显著提升——动手改一行 `t[i:j] = t[i:j][::-1]` 试试。

    ## 📚 延伸阅读

    - **原始文献**:Kirkpatrick, Gelatt & Vecchi (1983), *Optimization by Simulated Annealing*, Science — 四页讲透退火与优化
    - **教材**:《现代优化计算方法》(邢文训、谢金星)第 3 章 — 冷却计划与收敛性
    - **进阶关联**:GA 与 SA 的对比 → 《遗传算法原理与应用》《启发式算法综合实战》单元;组合优化的另一路线 → 《蚁群算法与组合优化》单元

    ## 🧠 小结

    1. SA = 局部搜索 + 可控容错:Metropolis 准则用温度调节「接受差解」的概率,先探索后收敛
    2. 冷却计划四件套:$T_0$(接受率法)、降温函数(几何 $\alpha$)、内循环 $L$、终止条件;预算意识贯穿始终
    3. 邻域是灵魂:改动要小(保光滑性)、连通(保可达性);TSP 用 2-opt 远胜 swap
    4. 对数降温有全局收敛保证但不可用;几何降温实用但无保证——论文措辞留余地
    5. 返回历史最优而非当前解;SA 单点串行,极易与 GA 等算法级联做混合策略
