  title: 2021 年高教社杯全国大学生数学建模竞赛题目
  full_text: "2021 年高教社杯全国大学生数学建模竞赛题目 \n（请先阅读“全国大学生数学建模竞赛论文格式规范”） \n \nB 题   乙醇偶合制备C4\
    \ 烯烃 \n \nC4 烯烃广泛应用于化工产品及医药的生产，乙醇是生产制备C4 烯烃的原料。\n在制备过程中，催化剂组合（即：Co 负载量、Co/SiO2\
    \ 和HAP 装料比、乙醇浓度\n的组合）与温度对C4 烯烃的选择性和C4 烯烃收率将产生影响（名词解释见附录）。\n因此通过对催化剂组合设计，探索乙醇催化偶合制备C4\
    \ 烯烃的工艺条件具有非常\n重要的意义和价值。 \n某化工实验室针对不同催化剂在不同温度下做了一系列实验，结果如附件1 和\n附件2 所示。请通过数学建模完成下列问题：\
    \ \n(1) 对附件1 中每种催化剂组合，分别研究乙醇转化率、C4 烯烃的选择性与温\n度的关系，并对附件2 中350 度时给定的催化剂组合在一次实验不同时间的测试结\n\
    果进行分析。 \n(2) 探讨不同催化剂组合及温度对乙醇转化率以及C4 烯烃选择性大小的影响。 \n  (3) 如何选择催化剂组合与温度，使得在相同实验条件下C4\
    \ 烯烃收率尽可能 \n高。若使温度低于350 度，又如何选择催化剂组合与温度，使得C4 烯烃收率尽可\n能高。 \n(4) 如果允许再增加5 次实验，应如何设计，并给出详细理由。\
    \ \n \n \n \n \n附录：名词解释与附件说明 \n \n温度：反应温度。 \n选择性：某一个产物在所有产物中的占比。 \n时间：催化剂在乙醇氛围下的反应时间，单位分钟（min）。\
    \ \nCo 负载量： Co 与SiO2 的重量之比。例如，“Co 负载量为1wt%”表示Co\n与SiO2 的重量之比为1:100，记作“1wt%Co/SiO2”，依次类推。\
    \ \nHAP：一种催化剂载体，中文名称羟基磷灰石。 \n\n\n \nCo /SiO2 和HAP 装料比：指Co/SiO2 和HAP 的质量比。例如附件1\
    \ 中编号为\nA14 的催化剂组合“33mg 1wt%Co/SiO2-67mg HAP-乙醇浓度1.68ml/min”指\nCo/SiO2 和HAP 质量比为33mg：67mg\
    \ 且乙醇按每分钟1.68 毫升加入，依次类推。 \n乙醇转化率：单位时间内乙醇的单程转化率，其值为100 %  (乙醇进气量-乙\n醇剩余量)/乙醇进气量。\
    \ \nC4 烯烃收率：其值为乙醇转化率  C4 烯烃的选择性。 \n \n附件1：性能数据表。表中乙烯、C4 烯烃、乙醛、碳数为4-12 脂肪醇等均为\n\
    反应的生成物；编号A1~A14 的催化剂实验中使用装料方式I，B1～B7 的催化剂实\n验中使用装料方式II。 \n附件2：350 度时给定的某种催化剂组合的测试数据。\n"
