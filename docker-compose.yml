# MathModelAgent 统一编排 —— 本地全栈 / 云端单后端 一双文件
#
# 本地开发（全栈：后端 + 前端 + redis + chromadb）:
#   docker compose --profile dev up -d --build
#   前端 http://localhost:5174（/api 与 /api/ws 经容器内 nginx 反代到 backend，
#   见 nginx.conf；前端构建默认同源，无需额外 build args）
#
# 云服务器（仅后端；对外经 Cloudflare 隧道，前端走 Pages，见 docs/deploy-cloud.md）:
#   docker compose up -d --build
#   生产环境变量写入 backend/.env（参考 backend/.env.production.example）
#
# 端口约定: 后端 8002（对齐 backend/Dockerfile EXPOSE 8002，默认仅本机监听）；
#          前端 5174；redis 6379；chromadb 8001（均为 127.0.0.1 仅本机）。
# CHROMA_HTTP_URL 不在此文件设置——需要连接远程 chromadb 时在 backend/.env 配置。

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8002:8002"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/knowledge_base:/app/knowledge_base
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8002/api/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── 以下为本地开发全栈组件（--profile dev）──

  frontend:
    profiles: ["dev"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5174:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    profiles: ["dev"]
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"   # 仅本机；后端无 redis 时自动回退 fakeredis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  chromadb:
    profiles: ["dev"]
    image: chromadb/chroma:latest
    ports:
      - "127.0.0.1:8001:8000"   # 仅本机；连接时在 backend/.env 设 CHROMA_HTTP_URL=http://localhost:8001
    volumes:
      - ./backend/data/chroma_db:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
