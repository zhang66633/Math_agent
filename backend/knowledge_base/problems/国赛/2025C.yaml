problem:
  id: "prob_042"
  year: 2025
  competition: "国赛"
  problem_id: "C"
  title: "NIPT 的时点选择与胎儿的异常判定"
  full_text: |
    NIPT（Non-invasive Prenatal Test，即无创产前检测）是一种通过采集母体血液、检测
    胎儿的游离DNA片段、分析胎儿染色体是否存在异常的产前检测技术，目的是通过早期检测
    确定胎儿的健康状况。根据临床经验，畸型胎儿主要有唐氏综合征、爱德华氏综合征和
    帕陶氏综合征，这三种体征分别由胎儿21号、18号和13号"染色体游离DNA片段的比例"
    （简称"染色体浓度"）是否异常决定。NIPT的准确性主要由胎儿性染色体（男胎XY，
    女胎XX）浓度判断。通常孕妇的孕期在10周~25周之间可以检测胎儿性染色体浓度，且如果
    男胎的Y染色体浓度达到或高于4%、女胎的X染色体浓度没有异常，则可认为NIPT的结果是
    基本准确的，否则难以保证结果准确性要求。同时，实际中应尽早发现不健康的胎儿，
    否则会带来治疗窗口期缩短的风险，早期发现（12周以内）风险较低；中期发现（13-27周）
    风险高；晚期发现（28周以后）风险极高。

    实践表明，男胎Y染色体浓度与孕妇孕周数及其身体质量指数（BMI）紧密相关。通常根据
    孕妇的BMI值进行分组（例如：[20,28)，[28,32)，[32,36)，[36,40)，40以上）分别确定
    NIPT的时点（相对孕期的时间点）。由于每个孕妇的年龄、BMI、孕情等存在个体差异，
    对所有孕妇采用简单的经验分组和统一的检测时点进行NIPT，会对其准确性产生较大影响。
    因此，依据BMI对孕妇进行合理分组，确定各不同群组的最佳NIPT时点，可以减少某些孕妇
    因胎儿不健康而缩短治疗窗口期所带来的潜在风险。

    为了研究各类孕妇群体合适的NIPT时点，并对检测的准确性进行分析，附件给出了某地区
    （大多为高BMI）孕妇的NIPT数据。在实际检测中，经常会出现测序失败（比如：检测时点
    过早和不确定因素影响等）的情况。同时为了增加检测结果的可靠性，对某些孕妇有多次
    采血多次检测或一次采血多次检测的情况。试利用附件提供的数据建立数学模型研究如下
    问题：

    问题1 试分析胎儿Y染色体浓度与孕妇的孕周数和BMI等指标的相关特性，给出相应的关系
    模型，并检验其显著性。

    问题2 临床证明，男胎孕妇的BMI是影响胎儿Y染色体浓度的最早达标时间（即浓度达到或
    超过4%的最早时间）的主要因素。试对男胎孕妇的BMI进行合理分组，给出每组的BMI区间
    和最佳NIPT时点，使得孕妇可能的潜在风险最小，并分析检测误差对结果的影响。

    问题3 男胎Y染色体浓度达标时间受多种因素（身高、体重、年龄等）的影响，试综合考虑
    这些因素、检测误差和胎儿的Y染色体浓度达标比例（即浓度达到或超过4%的比例），根据
    男胎孕妇的BMI，给出合理分组以及每组的最佳NIPT时点，使得孕妇潜在风险最小，并分析
    检测误差对结果的影响。

    问题4 由于孕妇和女胎都不携带Y染色体，重要的是如何判定女胎是否异常。试以女胎孕妇
    的21号、18号和13号染色体非整倍体（AB列）为判定结果，综合考虑X染色体及上述染色体
    的Z值、GC含量、读段数及相关比例、BMI等因素，给出女胎异常的判定方法。

    附录1 附件中各列数据的说明（A样本序号至AE胎儿是否健康，含孕妇年龄/身高/体重/BMI/
    孕周、各染色体Z值与GC含量、读段数、Y/X染色体浓度、非整倍体检测结果等）
    附录2 Z值（Z-score）的计算公式 Z=(X-μ)/σ
  background: "NIPT通过母血中胎儿游离DNA片段浓度判断染色体异常，准确性受检测时点影响。需在测序失败、重复检测等真实数据条件下，按BMI等特征分组确定最佳检测时点并最小化潜在风险。"
  objectives:
    - "分析胎儿Y染色体浓度与孕妇孕周数、BMI等指标的相关特性并建立关系模型，检验显著性"
    - "对男胎孕妇BMI合理分组，给出各组BMI区间与最佳NIPT时点使潜在风险最小，并分析检测误差影响"
    - "综合考虑身高体重年龄等多因素、检测误差与达标比例，给出分组与最佳时点"
    - "建立女胎染色体异常（21/18/13号非整倍体）的判定方法"
  data_description: "某地区（大多为高BMI）孕妇NIPT检测数据，含A-AE列：样本序号、孕妇代码、年龄、身高、体重、末次月经时间、IVF妊娠方式、检测时间与抽血次数、孕周、BMI、总读段数与比对/重复比例、GC含量、13/18/21/X/Y染色体Z值与GC含量、Y/X染色体浓度、被过滤读段比例、非整倍体检测结果、怀孕与生产次数、胎儿是否健康。存在测序失败与多次检测记录。"
  deliverables:
    - "Y染色体浓度与孕周/BMI的关系模型及显著性检验"
    - "男胎BMI分组方案与各组最佳NIPT时点"
    - "女胎异常判定方法"
    - "数学模型、求解代码与误差分析"
  tags:
    problem_type: ["statistics", "prediction", "classification"]
    difficulty: "hard"
  linked_papers: []
