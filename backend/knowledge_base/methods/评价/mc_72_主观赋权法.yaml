    - '**专家意见对比图**：各专家意见对比'
    - '**意见收敛图**：德尔菲法意见收敛'
    - '**一致性分析图**：专家意见一致性'
    - '**权重区间图**：权重置信区间'
    source: math-modeling-skill
  id: mc_72
  formulas:
  - w_j = \frac{S_j}{\sum_{k=1}^{n} S_k}，其中 S_j 为专家对指标 j 的打分，n 为指标个数，w_j 为指标 j 的归一化权重。
  - w_j = \frac{1}{k} \sum_{i=1}^{k} w_j^{(i)}，其中 k 为专家人数，w_j^{(i)} 为第 i 位专家给出的指标 j 的权重，w_j 为综合权重。
  - w_j^{(i)} = \frac{S_j^{(i)}}{\sum_{k=1}^{n} S_k^{(i)}}，其中 S_j^{(i)} 为第 i 位专家对指标 j 的打分，w_j^{(i)} 为该专家给出的归一化权重。
