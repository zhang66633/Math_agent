  id: mc_77
  formulas:
  - 欧拉回路存在条件：$\forall v \in V,\ \deg(v) \equiv 0 \pmod{2}$，其中 $\deg(v)$ 表示顶点 $v$ 的度数。
  - 欧拉路径存在条件：$|\{v \in V \mid \deg(v) \equiv 1 \pmod{2}\}| = 0$ 或 $2$，即奇数度顶点数为 0 或 2。
  - 哈密顿路径定义：路径 $P = (v_1, v_2, \dots, v_n)$ 满足 $V(P)=V$ 且 $v_i \neq v_j\ (i \neq j)$，其中 $V$ 为图的顶点集。
  - 哈密顿回路定义：哈密顿路径 $P = (v_1, v_2, \dots, v_n)$ 且 $v_1 = v_n$。
