method_card:
  id: mc_037
  name: 偏微分方程的有限差分法
  name_en: Finite Difference Method for Partial Differential Equations
  category:
  - 微分方程
  - 数值方法
  principle: 有限差分法的基本思想是将求解区域用网格剖分，将连续的自变量区域用有限离散点（网格点）集代替；将连续变量的函数用定义在网格点上的离散函数代替；通过用网格点上的差商代替导数，将含连续变量的偏微分方程定解问题转化为只含有限个未知数的代数方程组（差分格式）。如果差分格式有解，且当网格无限变小时其解收敛于原微分方程定解问题的解，则差分格式的解就作为原问题的近似解（数值解）。
  formulas:
  - name: 五点菱形格式（Poisson方程）
    latex: $$\frac{u_{k+1,j} - 2u_{k,j} + u_{k-1,j}}{h^2} + \frac{u_{k,j+1} - 2u_{k,j}
      + u_{k,j-1}}{\tau^2} = f_{k,j}$$
    description: Poisson方程在正则内点处的五点菱形差分格式，当h=τ时简化为◊u_{k,j} = h^2 f_{k,j}，其中◊u_{k,j}=u_{k+1,j}+u_{k-1,j}+u_{k,j+1}+u_{k,j-1}-4u_{k,j}。
  - name: 五点矩形格式（Laplace方程）
    latex: $$\frac{u_{k+1,j+1} + u_{k-1,j+1} + u_{k+1,j-1} + u_{k-1,j-1} - 4u_{k,j}}{2h^2}
      = f_{k,j}$$
    description: Laplace方程的五点矩形差分格式，简记为ٱu_{k,j} = 2h^2 f_{k,j}。
  - name: 一维热传导方程向前差分格式
    latex: $$\frac{u_{k,j+1} - u_{k,j}}{\tau} - a^2 \frac{u_{k+1,j} - 2u_{k,j} + u_{k-1,j}}{h^2}
      = 0$$
    description: 一维热传导方程在网格内点处，对时间采用向前差商、对空间采用二阶中心差商的差分近似。
  - name: 一维热传导方程向后差分格式
    latex: $$\frac{u_{k,j} - u_{k,j-1}}{\tau} - a^2 \frac{u_{k+1,j} - 2u_{k,j} + u_{k-1,j}}{h^2}
      = 0$$
    description: 一维热传导方程在网格内点处，对时间采用向后差商、对空间采用二阶中心差商的差分近似。
  - name: 一维热传导方程中心差分格式
    latex: $$\frac{u_{k,j+1} - u_{k,j-1}}{2\tau} - a^2 \frac{u_{k+1,j} - 2u_{k,j}
      + u_{k-1,j}}{h^2} = 0$$
    description: 一维热传导方程在网格内点处，对时间采用中心差商、对空间采用二阶中心差商的差分近似。
  applicable_when:
  - 求解区域为规则形状（矩形、圆形等），便于网格剖分
  - 偏微分方程定解问题存在适定性（解存在、唯一且连续依赖于定解数据）
  - 需要获得偏微分方程在离散点上的数值近似解
  - 椭圆型、抛物型、双曲型方程均可适用
  not_applicable_when:
  - 求解区域形状极不规则，网格剖分困难
  - 问题对解的精度要求极高，网格加密会导致计算量过大
  - 方程具有强奇异性或间断解，差分格式可能不收敛
  typical_scenarios:
  - Poisson方程和Laplace方程描述的稳定温度场、不可压缩流体稳定无旋流动、静电场电势等椭圆型问题
  - 热传导方程描述的热传导过程、气体扩散现象、电磁场传播等抛物型问题
  - 波动方程描述的振动与波动问题等双曲型问题
  common_mistakes:
  - mistake: 对非正则内点直接使用正则内点的差分格式，忽略边界条件的处理
    solution: 对非正则内点需利用边界条件进行特殊处理，如直接转移法或线性插值法，不能简单套用正则内点的差分方程。
  - mistake: 在边界条件离散化时，对第二、三类边界条件使用不恰当的差商近似导致精度降低
    solution: 根据精度需求选择合适的差商近似：可用向前/向后差商（一阶精度）或中心差商（二阶精度）近似边界上的偏导数。
  code_snippets:
  - language: python
    description: 一维热传导方程向前差分（FTCS）显式格式求解，对应该卡「一维热传导方程向前差分格式」公式
    code: |
      import numpy as np

      # 求解 u_t = a^2 * u_xx，x∈[0,L]，给定初始条件与 Dirichlet 边界
      L, T = 1.0, 0.2
      N, M = 50, 500            # 空间步数 / 时间步数
      a = 0.1                   # 热扩散系数
      h = L / N
      tau = T / M
      r = a**2 * tau / h**2     # 稳定性要求 r <= 0.5，否则显式格式发散

      x = np.linspace(0, L, N + 1)
      u = np.sin(np.pi * x)     # 初始条件
      u[0] = u[-1] = 0.0        # 边界条件

      for _ in range(M):
          # u[k,j+1] = u[k,j] + r*(u[k+1,j] - 2*u[k,j] + u[k-1,j])
          u[1:-1] = u[1:-1] + r * (u[2:] - 2 * u[1:-1] + u[:-2])
          u[0] = u[-1] = 0.0
