    source: math-modeling-skill
  id: mc_87
  formulas:
  - P(y|x) = \frac{P(x|y) P(y)}{P(x)}，其中 P(y|x) 为后验概率，P(x|y) 为似然，P(y) 为先验，P(x) 为证据。
  - P(x|y) = \prod_{j=1}^{m} P(x_j | y)，其中 x_j 为第 j 个特征，m 为特征数，假设特征条件独立。
  - \hat{y} = \arg\max_{y} P(y) \prod_{j=1}^{m} P(x_j | y)，其中 \hat{y} 为预测类别，分母 P(x) 与类别无关可省略。
  - P(x_j|y) = \frac{N_{jy} + \alpha}{N_y + \alpha \cdot V}，其中 N_{jy} 为类别 y 下特征 j 的计数，N_y 为类别 y 的总计数，V 为特征取值数，\alpha
    为拉普拉斯平滑参数。
  - P(x_j|y) = \mathcal{N}(x_j; \mu_{jy}, \sigma_{jy}^2)，其中 \mu_{jy} 和 \sigma_{jy}^2 分别为类别 y 下特征 j 的均值和方差。
