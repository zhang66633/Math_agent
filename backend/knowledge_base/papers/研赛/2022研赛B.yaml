paper:
  id: paper_019
  year: 2022
  competition: 研赛
  problem_id: B
  title: 基于整数规划的组批和下料优化问题研究
  tags:
    problem_type:
    - 优化
    core_models:
    - 整数线性规划
    - 三阶段匀质排样模型(3E)
    - 凝聚层次聚类
    techniques:
    - 贪心策略
    - 迭代顺序修正算法
    - 产品项旋转策略
    - 价值修正策略
    - 杰卡德距离
    - 类平均距离法
    - 启发式算法
  problem_ref: ''
  problem_context: 方形件产品是以板材（Bin）为主要原片、通过平面加工后的几种板式配件装配而形成的一类产品。随着制造业生产技术的不断进步，企业通常采用'订单组批+批量生产+订单分拣'的模式进行生产。在该生产模式中，订单组批与下料优化至关重要，两者能降低企业的生产成本，减少资源的浪费。下料优化问题在制造业的生产加工过程中广泛存在：服装制造业中布匹皮革的分割、木材加工业中圆木的分割、机械制造业中金属板的剪切，都属于不同类型的下料问题。下料优化本质上是寻找一种方案，实现给定的几何图形上不重叠的放入更多的几何图形，使原材料利用率最高。本题涉及两个子问题：问题一为排样优化问题，以数据集A为输入，建立整数规划模型，对方形件在板材上的排样方式进行优化，在满足订单需求的条件下，使板材用量尽可能少，要求相同栈（stack）里的产品项（item）的宽度（或长度）相同，且最终切割生成的产品项是完整的，非拼接而成。问题二为订单组批问题，以数据集B为输入，建立整数规划模型，首先对全部订单中的产品根据材质重新组批，进一步地对每个批次分别进行排样优化，在满足订单需求的条件下，实现板材用量尽可能少。问题二在问题一基础上进一步要求：每份订单当且仅当出现在一个批次中；每个批次中的相同材质的产品项才能使用同一块板材原片进行排样；每个批次产品项总数不能超过1000；每个批次产品项的面积总和不能超过250m²。切割方式为齐头切，排样方式为三阶段排样：第一阶段水平切割生成Stripe，第二阶段垂直切割生成Stack，第三阶段水平切割生成Item。板材原片规格为2440mm×1220mm，数量充足，不考虑锯缝宽度。
  methodology_chain:
  - '数据预处理: 对数据集A和B中的Item按长边由大到小排序，定义Stack、Stripe、Bin的标记方法，将Item的长边定义为长，短边定义为宽'
  - '问题一建模: 建立整数线性规划模型，以板材用量最少为目标函数，设置决策变量α(j,i)、β(k,j)、γ(m,k)、δ(m,i,j)分别表示Item在Stack、Stack在Stripe、Stripe在Bin中的排样关系'
  - '问题一约束构建: 构建约束条件包括每个Item仅排样一次、同宽度Item才能在同一Stack、Stack长度不超过Stripe长度、Stack宽度之和不超过板材宽度、Stripe长度之和不超过板材长度等'
  - '问题一算法设计: 采用基于贪心策略的迭代顺序修正算法，自底向上逐级排样，优先考虑长度或宽度较大的产品项，尽可能利用余料空间'
  - '产品项旋转策略: 当Item长度无法满足条件时，考虑将Item旋转90°后在宽度方向上进行排样，修正决策变量α(r,j,i)区分是否旋转'
  - '产品价值修正策略: 引入产品项价值v，初始价值为Item长度，根据板材利用率修正价值，使尺寸较大与较小的产品项交替排列，迭代N轮保存最优方案'
  - '问题一求解: 对dataA1-A4求解，得到板材利用率分别为93.87%、92.08%、94.08%、94.08%，运行时间均小于0.3s'
  - '问题二建模: 在问题一基础上加入批次相关约束，添加决策变量η(y,m)和ω(y,x)分别表示Bin在Batch中和Order在Batch中的归属关系'
  - '问题二约束构建: 添加每块Bin仅属于1个批次、每批次产品项总数不超过1000、每批次产品项总面积不超过250m²、每块Bin上产品材质相同、每个订单仅属于1个批次等约束'
  - '订单特征编码: 统计每个订单中所有Item的材质类型和数量，将材质作为特征名，数量作为特征值进行特征编码'
  - '订单组批聚类: 采用基于杰卡德距离的凝聚层次聚类算法，使用类平均距离法计算类间距离，在合并过程中判断约束条件，尽可能让订单簇的总Item数和总面积接近约束上限'
  - '订单组批优化策略: 采用两个贪心策略——尽可能让每个订单簇接近约束条件值；将只有少量某种材质Item的订单与其他有大量该材质Item的订单进行组批'
  - '问题二求解: 对每个批次按材质分组后输入问题一模型独立排样，得到dataB1-B5板材利用率分别为77.10%、75.56%、74.69%、76.15%、74.94%'
  - '算法评估: 分析算法有效性和复杂度，问题一时间复杂度约O(n³)，问题二时间复杂度约O(n³)'
  key_formulas:
  - name: 目标函数
    latex: Z = \min \sum_{i=1}^{n} \gamma_{m,m}
    description: 最小化板材用量，γ(m,m)表示Stripe m包含在板材m中
  - name: 每个产品项仅排样一次约束
    latex: \sum_{j=1}^{i} \alpha_{j,i} = 1, \quad \forall i=1,\ldots,n
    description: 保证每个产品项i仅被排样一次，确保排样不重不漏
  - name: 同宽度Stack约束
    latex: \alpha_{j,i} = 0, \quad \forall w_i \neq w_j \cup l_i + l_j > L, \text{
      其中} i > j, j=1,\ldots,n-1
    description: 只有宽度相同的产品项才能包含在同一Stack中，且长度之和不超过板材长度
  - name: Stack宽度约束
    latex: \sum_{j=k}^{n} w_j \beta_{k,j} \leq W \beta_{k,k}, \quad \forall k=1,\ldots,n-1
    description: 同一Stripe中Stack的宽度之和不应超过板材原片的宽度W
  - name: Stripe长度约束
    latex: \sum_{i=m}^{n} l_i \gamma_{m,i} + \sum_{i=m+1}^{n} l_i \sum_{j=m}^{i-1}
      \delta_{m,i,j} \leq L \gamma_{m,m}, \quad \forall m=1,\ldots,n-1
    description: 所有Stripe的长度之和不应超过板材原片的长度L
  - name: 产品项价值修正公式
    latex: v_{iT} \leftarrow g_1 v_{i,T-1} + g_2 l_i w_i / u_T
    description: 产品项i的新价值由旧价值和修正价值组成，修正价值与产品项面积正相关，与板材利用率负相关
  - name: 板材利用率
    latex: u_T = \frac{\sum_{i=1}^{n} l_i w_i}{m L W}
    description: 第T次排样的板材利用率，等于所有产品项面积之和除以板材总面积
  - name: 杰卡德相似系数
    latex: J(A,B) = \frac{|A \cap B|}{|A \cup B|}
    description: 两个批次A和B的材质种类交集在并集中所占的比例
  - name: 杰卡德距离
    latex: J_{\delta}(A,B) = 1 - J(A,B) = \frac{|A \cup B| - |A \cap B|}{|A \cup B|}
    description: 用两个批次中不同材质与所有元素比例来衡量集合区分度
  - name: 类平均距离
    latex: D_{HK} = \frac{1}{n_H n_K} \sum_{i \in H} \sum_{j \in K} d_{ij}^2
    description: 计算两个簇之间所有距离的均值作为两个订单簇之间的距离
  - name: 批次产品项总数约束
    latex: \sum_{m=y}^{n} \sum_{k=m}^{n} \sum_{j=k}^{n} \sum_{i=j}^{n} \eta_{y,m}
      \gamma_{m,k} \beta_{k,j} \alpha_{j,i} \leq N, \quad \forall y=1,\ldots,n
    description: 每个批次中产品项的数量之和不超过N（N=1000）
  - name: 批次产品项总面积约束
    latex: \sum_{m=y}^{n} \sum_{k=m}^{n} \sum_{j=k}^{n} \sum_{i=j}^{n} l_i w_i \eta_{y,m}
      \gamma_{m,k} \beta_{k,j} \alpha_{j,i} \leq S, \quad \forall y=1,\ldots,n
    description: 每个批次中产品项的面积之和不超过S（S=250m²）
  algorithm_outline:
  - language: pseudocode
    description: 基于贪心策略的迭代顺序修正算法（问题一主框架）
    code: "输入: 产品项数据集\n输出: 最优排样方案\n\nStep1: 令T=1, Z=∞, 按长度对产品项排序得到初始序列A, 设定初始价值v0\n\
      Step2: 生成当前排样方案\n  Step2.1: 令P_T=∅, 调用贪心算法进行排样, 已排样Item移出序列A\n          当贪心算法在长度方向上无法继续排样时,\
      \ 考虑旋转策略\n  Step2.2: 若序列A≠∅, 返回Step2.1; 否则转Step3\nStep3: 若Z为当前最小值, 保留当前排样方案P_T,\
      \ 并更新Z\nStep4: 调用价值修正算子, 修正产品项价值, 并根据修正价值对产品项重新排序, 更新序列A\nStep5: 令T=T+1, 若T>T_max,\
      \ 算法终止, 输出最优排样方案, 否则转Step2"
  - language: pseudocode
    description: 贪心算法（问题一子算法）
    code: "输入: 产品项序列A\n输出: 当前排样方案\n\nStep1: 构建板材。新建一块空白板材B\nStep2: 构建Stripe。在板材B中新建一个空白Stripe,\
      \ 记为s\n  Step2.1: 遍历序列A中所有Item, 当Item i的长度和宽度不超过当前板材中剩余的长度和宽度,\n          将最先满足该条件的Item\
      \ a放入s中, 同时从序列A中移除Item a\n  Step2.2: 若所有Item的长和宽均不满足条件, 则返回Step2\nStep3: 构建Stack\n\
      \  Step3.1: 遍历序列A中剩余Item, 当Item i的长度不超过Stripe s的长度、宽度不超过Stripe s的剩余宽度,\n   \
      \       将最先满足条件的Item b放入Stripe s, 同时从序列A中移除Item b\n  Step3.2: 继续遍历序列A中剩余Item,\
      \ 当Item i的长度不超过Stack b的剩余长度、宽度等于Item b的宽度,\n          将最先满足条件的Item c放入Stack\
      \ b, 同时从序列A中移除Item c"
  - language: pseudocode
    description: 基于凝聚层次聚类的启发式算法（问题二主框架）
    code: '输入: 所有的item序列

      输出: 所有item按照组批的排样结果


      Step1: 将所有item按照订单号进行分组

      Step2: 统计所有订单中存在的所有item的材质类型, 将材质作为特征名, 将订单中该材质的item数量作为特征值

      Step3: 根据杰卡德距离对订单进行订单凝聚层次聚类

      Step4: 结束组批, 开始对每个组批的所有订单item进行排样优化

      Step5: 遍历所有组批, 对于每一个组批, 获取当前组批所有订单的所有item信息

      Step6: 对所有item按照材质进行分组

      Step7: 对每一个材质分组的item序列作为第一问模型的输入, 得到排样结果

      Step8: 重复Step5-Step7, 直到得到所有组批item的排样结果

      Step9: 算法结束'
  - language: pseudocode
    description: 基于生产约束的订单层次聚类算法
    code: "Step1: N个初始状态下的订单各自成一类, 建立N个类, 计算各类之间的距离得到一个N*N维的距离矩阵\nStep2: 计算各批次之间的类平均距离,\
      \ 找出其中距离最小得到对应的两个批次\nStep3: 尝试将两个批次合并成一个新批次, 判断新批次的产品总面积和总产品数是否超出约束。\n     \
      \  如果不满足约束, 则返回Step2, 找出次小的对进行合并并检验;\n       如果满足题目约束条件, 则进行合并, 删除旧的批次, 建立一个新批次\n\
      Step4: 计算合并后批次之间的新距离\nStep5: 跳至步骤二, 重复计算及合并, 直到所有批次合并后都不满足约束条件"
  assumption_analysis:
  - '假设1: 本题只考虑齐头切的切割方式 → 合理，这是实际生产中常见的切割方式，简化了切割路径规划问题。如果放松此假设，需要考虑非直线切割，问题复杂度将大幅增加'
  - '假设2: 切割阶段数不超过3，切割方向为第一阶段水平切割，第二阶段垂直切割，第三阶段水平切割 → 合理，三阶段排样是工业标准，平衡了切割效率和排样灵活性。如果增加阶段数，排样更灵活但切割效率降低'
  - '假设3: 排样方式为精确排样 → 合理，精确排样保证产品项完整，符合实际生产要求。如果允许非精确排样，需要考虑拼接问题'
  - '假设4: 板材原片仅有一种规格且数量充足，原片长度L为2440mm，原片宽度W为1220mm → 合理，单一规格简化了问题。如果多种规格，需要同时优化板材选型和排样'
  - '假设5: 排样方案不用考虑锯缝宽度影响 → 合理，锯缝宽度通常较小，忽略后简化计算。如果考虑锯缝，需要调整尺寸约束'
  reusable_patterns:
  - '可复用的模式1: 三阶段排样问题的自底向上构建方法——先构建Stack（同宽度Item叠加），再构建Stripe（Stack横向排列），最后构建Bin（Stripe纵向排列），这种分层构建思路可迁移到其他二维切割问题'
  - '可复用的模式2: 迭代价值修正策略——通过引入''产品价值''概念，在每轮排样后根据板材利用率修正价值并重新排序，使算法摆脱贪心局部最优，这种迭代修正思路可迁移到其他组合优化问题'
  - '可复用的模式3: 基于杰卡德距离的凝聚层次聚类用于订单组批——将订单的材质分布作为特征向量，用杰卡德距离衡量相似度，在合并过程中动态检查约束条件，这种带约束的聚类方法可迁移到其他分组问题'
  - '可复用的模式4: 产品项旋转策略——当长度方向无法排样时，尝试旋转90°后在宽度方向排样，这种灵活调整策略可迁移到其他排样问题'
  - '可复用的模式5: 两阶段求解框架——先组批（聚类）再排样（优化），将复杂问题分解为两个相对独立的子问题，这种分解思路可迁移到其他需要先分组再优化的场景'
  common_pitfalls:
  - mistake: 直接使用商业优化器（如CPLEX）求解整数规划模型，导致大规模问题计算时间过长
    solution: 应采用启发式算法（如贪心+迭代修正）求解，商业优化器仅适用于小规模精确求解
  - mistake: 在贪心算法中仅考虑长度方向排样，忽略旋转策略，导致长条形Item无法有效利用余料
    solution: 引入产品项旋转策略，当长度方向无法满足时尝试旋转90°后在宽度方向排样
  - mistake: 在订单组批时仅考虑材质相似度，忽略批次约束（总数≤1000，总面积≤250m²），导致组批结果不可行
    solution: 在聚类合并过程中动态检查约束条件，不满足则尝试次优合并
  - mistake: 价值修正策略中权重参数g1、g2设置不当，导致算法收敛慢或陷入局部最优
    solution: 通过实验调整经验参数τ、ν，使修正价值与旧价值保持合理比例
  - mistake: 忽略Stack标记规则，导致相同长度的Stack在标记时引起混淆
    solution: 用'严格小于'和'小于等于'进行区分，规定用标号较小的Stack标记Stripe
  difficulty: 3
  difficulty_level: hard
  analysis:
    problem_summary: 在满足三阶段切割工艺约束下，通过整数规划和启发式算法优化方形件在板材上的排样方案，并在问题二中加入订单组批约束，实现板材用量最小化
    key_assumptions:
    - 只考虑齐头切切割方式
    - 切割阶段数不超过3，方向为水平-垂直-水平
    - 排样方式为精确排样
    - 板材原片仅有一种规格2440mm×1220mm且数量充足
    - 不考虑锯缝宽度影响
    decision_variables: α(j,i)∈{0,1}表示产品项i是否在Stack j中排样；β(k,j)∈{0,1}表示Stack j是否在Stripe
      k中排样；γ(m,k)∈{0,1}表示Stripe k是否在板材m中排样；δ(m,i,j)∈{0,1}表示产品项i在Stack j中且Stack j在Stripe
      j中且Stripe j在Bin m中；η(y,m)∈{0,1}表示Bin m是否在批次Batch y中；ω(y,x)∈{0,1}表示订单Order x是否在批次Batch
      y中
    objective: 最小化板材用量Z=min Σγ(m,m)，即使用的板材原片数量最少
    constraints: 每个产品项仅排样一次；同宽度产品项才能在同一Stack中且长度之和不超过板材长度；Stack长度不超过Stripe长度；Stack宽度之和不超过板材宽度W；Stripe长度之和不超过板材长度L；每块Bin仅属于1个批次；每批次产品项总数≤1000；每批次产品项总面积≤250m²；每块Bin上产品材质相同；每个订单仅属于1个批次
  model:
    approach: 本文将复杂的订单组批与下料优化问题拆解为多个步骤，由浅入深求解。问题一建立三阶段匀质排样(3E)的整数线性规划模型，采用自底向上的构建方式，先构建Stack（同宽度Item叠加），再构建Stripe（Stack横向排列），最后构建Bin（Stripe纵向排列）。算法采用基于贪心策略的迭代顺序修正算法，核心思想包括：尽可能利用余料空间、同尺寸Item叠加、相似Item同板排样。引入产品项旋转策略处理长条形Item，引入产品价值修正策略使算法摆脱贪心局部最优。问题二在问题一基础上加入批次约束，采用基于杰卡德距离的凝聚层次聚类算法进行订单组批，将材质分布相似的订单聚为同一批次，在聚类过程中动态检查批次约束。组批完成后，对每个批次按材质分组，分别输入问题一模型独立排样。
    innovation: 1. 将三阶段排样问题转化为整数线性规划模型，并设计了完整的决策变量和约束体系；2. 提出迭代价值修正策略，通过动态调整产品项优先级使算法摆脱贪心局部最优；3.
      引入产品项旋转策略提高板材利用率；4. 将杰卡德距离与凝聚层次聚类结合用于订单组批，在聚类过程中动态检查生产约束；5. 提出两个贪心策略优化组批效果：尽可能让订单簇接近约束上限，将少量材质Item的订单与大量同材质Item的订单组批。
    solution_method: 使用Python实现，采用基于贪心策略的迭代顺序修正算法求解问题一，采用基于杰卡德距离的凝聚层次聚类算法求解问题二组批，排样部分复用问题一模型。使用pandas进行数据处理，matplotlib进行排样方案可视化。
  evaluation:
    strengths:
    - 建模思路清晰，将复杂问题分解为排样和组批两个子问题，由浅入深逐步求解
    - 整数规划模型建立完整，决策变量和约束条件考虑全面
    - 启发式算法设计巧妙，贪心策略+价值修正+旋转策略的组合有效提高了板材利用率
    - 问题二将聚类算法与排样优化有机结合，杰卡德距离的选择合理
    - 结果可视化详细，输出排样坐标和效果图，便于验证和理解
    - 算法复杂度分析完整，对有效性和稳定性进行了评估
    weaknesses:
    - 整数规划模型计算量大，在大数据量下难以快速求解，实际使用的是启发式算法而非精确求解
    - 启发式算法只能找到局部最优解，无法保证全局最优
    - 问题二板材利用率（约75%）相比问题一（约93%）下降明显，组批策略仍有优化空间
    - 价值修正策略中的经验参数τ、ν未给出具体取值和敏感性分析
    - 未考虑多规格板材的情况，实际生产中可能有多种板材规格可选
    lessons: 这篇论文展示了如何将复杂的实际工程问题（三阶段排样+订单组批）转化为可求解的数学模型。最重要的启示是：当精确求解不可行时，设计合理的启发式算法（贪心+迭代修正）可以在可接受时间内获得高质量解。同时，将问题分解为多个子问题（先组批再排样）是处理复杂优化问题的有效策略。此外，引入'价值'概念并迭代修正，是使贪心算法摆脱局部最优的通用技巧，可迁移到其他组合优化问题。
