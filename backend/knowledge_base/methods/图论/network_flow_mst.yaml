  content_md: |
    # 网络流与最大流

    > **难度**:进阶 · **预计学习时长**:50 分钟 · **主讲智能体**:🧩 建模手 · **方法类别**:图论

    ## 🎯 学习目标

    学完本单元,你应该能够:

    - 说清流网络的四要素(源、汇、容量、流量)与流的三大约束(容量、斜对称、守恒)
    - 理解**剩余网络**与**反向边**的含义——反向边不是「退货」,是「撤销」
    - 手工执行 Ford-Fulkerson 增广过程,逐步更新流量与剩余容量
    - 陈述最大流最小割定理,并能用最小割定位系统的瓶颈
    - 掌握三类建模套路:多源多汇虚拟化、点容量拆点、二分图匹配转最大流

    ## 📖 核心概念

    ### 1. 流网络与最大流问题

    一个**流网络**由有向图 $G = (V, E)$、源点 $s$、汇点 $t$、容量函数 $c(u, v) \geq 0$ 组成。**流** $f$ 给每条边赋一个「实际输送量」,满足:

    - **容量约束**:$0 \leq f(u, v) \leq c(u, v)$
    - **流量守恒**:除 $s, t$ 外,每个顶点「流入 = 流出」:$\sum_{u} f(u, v) = \sum_{w} f(v, w)$
    - **斜对称**:$f(u, v) = -f(v, u)$(反向边记负数,便于统一公式)

    **流值** $|f| = \sum_{v} f(s, v)$ 即源点净流出量。**最大流问题**:求流值最大的可行流。直觉上,源点泵出的流量不能超过「沿途管道」的瓶颈,也不能超过汇点能接收的量。

    ### 2. 剩余网络与增广路径

    对当前流 $f$,每条边的**剩余容量**(还能再挤多少)为:

    $$c_f(u, v) = c(u, v) - f(u, v)$$

    注意沿原边 $u \to v$ 已有流 $f(u, v)$ 时,反向「剩余容量」为 $c_f(v, u) = f(u, v)$——即可以把已送的流**撤销**回去。所有剩余容量为正的边构成**剩余网络** $G_f$。

    **增广路径**就是 $G_f$ 中一条 $s \to t$ 的路径,其**瓶颈** $b$ = 路径上最小剩余容量。沿它增广:正向边流量 $+b$,反向边流量 $-b$。流值增加 $b$。

    > 💡 **建模心法**:反向边的存在让 FF 具备「反悔」能力——先把流推到某条边,之后发现走另一条更优,就把先前的流「退回」。不理解反向边,就理解不了最大流。

    ### 3. Ford-Fulkerson 与 Edmonds-Karp

    **Ford-Fulkerson(FF)**:只要剩余网络里还存在增广路径,就沿它增广;不存在时结束。若每次随便找一条路径(如深搜),复杂度与最大流值相关,可能很慢(甚至对无理容量不终止)。

    **Edmonds-Karp(EK)**:规定每次用 **BFS 找最短增广路径**,复杂度 $O(VE^2)$,是竞赛最常用的可写版本。更强的 Dinic 算法 $O(V^2E)$,处理大规模数据再用。

    ### 4. 割与最大流最小割定理

    **割 $(S, T)$**:把顶点分成含 $s$ 的 $S$ 与含 $t$ 的 $T$ 两部分,其**容量**是「从 $S$ 跨到 $T$ 的所有边」的容量和:

    $$c(S, T) = \sum_{u \in S,\ v \in T} c(u, v)$$

    **最大流最小割定理**(网络流理论的皇冠):

    $$\max |f| = \min c(S, T)$$

    **弱对偶**(直观):任何流都必须穿过割,而割的容量是「横截面总通过能力」,所以 $|f| \leq c(S, T)$。**强对偶**:FF 终止时,取剩余网络中从 $s$ 可达的顶点集为 $S$,这个割的容量恰好等于当前流值——两边的界在最优处重合。

    ### 5. 建模套路三件套

    | 现实约束 | 转化手法 |
    |---------|---------|
    | 多个源点 / 多个汇点 | 加**超级源点** $s$ 连所有源(容量 $\infty$)、所有汇连**超级汇点** $t$ |
    | 顶点有容量(中转站处理上限) | **拆点**:$v$ 拆成 $v_{\text{in}} \to v_{\text{out}}$,边容量 = 顶点容量 |
    | 二分图匹配(工人—任务) | $s$ → 左部(容量 1)→ 右部 → $t$,最大流值 = 最大匹配数 |

    ## 🧮 公式与结论

    **流的三大约束**:

    $$0 \leq f(u,v) \leq c(u,v), \qquad f(u,v) = -f(v,u), \qquad \sum_{u} f(u,v) = \sum_{w} f(v,w)\ (\forall v \neq s, t)$$

    **剩余容量与增广**:

    $$c_f(u,v) = c(u,v) - f(u,v), \qquad b = \min_{(u,v) \in P} c_f(u,v), \qquad |f| \leftarrow |f| + b$$

    **割容量与定理**:

    $$c(S,T) = \sum_{u \in S,\, v \in T} c(u,v), \qquad \max |f| = \min c(S,T)$$

    **复杂度**:FF 依赖路径选择;EK(BFS)$O(VE^2)$;Dinic $O(V^2E)$。整数容量下 FF 每次增广至少加 1,必在 $|f_{\max}|$ 次内终止。

    ## 💡 经典例题

    ### 例题 1:Ford-Fulkerson 手工增广(经典网络)

    > 网络(CLRS 经典例):$s \to v_1 = 16$,$s \to v_2 = 13$,$v_1 \to v_3 = 12$,$v_2 \to v_1 = 4$,$v_2 \to v_4 = 14$,$v_3 \to v_2 = 9$,$v_3 \to t = 20$,$v_4 \to v_3 = 7$,$v_4 \to t = 4$。求最大流。

    **初始**:所有边流量为 0。

    **增广 1**:路径 $s \to v_1 \to v_3 \to t$,瓶颈 $b = \min(16, 12, 20) = 12$。增广后:$f(s,v_1) = 12,\ f(v_1,v_3) = 12,\ f(v_3,t) = 12$,流值 $|f| = 12$。剩余容量:$s \to v_1: 4$,$v_1 \to v_3: 0$,$v_3 \to t: 8$。

    **增广 2**:路径 $s \to v_2 \to v_4 \to t$,瓶颈 $b = \min(13, 14, 4) = 4$。增广后:$f(s,v_2) = 4,\ f(v_2,v_4) = 4,\ f(v_4,t) = 4$,$|f| = 16$。剩余:$s \to v_2: 9$,$v_2 \to v_4: 10$,$v_4 \to t: 0$。

    **增广 3**:路径 $s \to v_2 \to v_4 \to v_3 \to t$,瓶颈 $b = \min(9, 10, 7, 8) = 7$。增广后:$f(s,v_2) = 11,\ f(v_2,v_4) = 11,\ f(v_4,v_3) = 7,\ f(v_3,t) = 19$,$|f| = 23$。

    **检查剩余网络**:$s \to v_1$ 剩 4,但 $v_1 \to v_3$ 剩 0,死路;$s \to v_2$ 剩 2,$v_2 \to v_4$ 剩 3,但 $v_4 \to v_3$ 与 $v_4 \to t$ 均剩 0;反向边 $v_3 \to v_2$ 剩余 9、$v_2 \to v_1$ 剩余 4 也到不了 $t$。**不存在增广路径,算法终止**。

    **最终流值 $\boxed{|f| = 23}$**,流量分布:

    | 边 | $s\!\to\!v_1$ | $s\!\to\!v_2$ | $v_1\!\to\!v_3$ | $v_2\!\to\!v_4$ | $v_4\!\to\!v_3$ | $v_3\!\to\!t$ | $v_4\!\to\!t$ | 其余 |
    |----|----|----|----|----|----|----|----|----|
    | 流量 | 12 | 11 | 12 | 11 | 7 | 19 | 4 | 0 |

    **验证最小割**:剩余网络中从 $s$ 可达的顶点集 $S = \{s, v_1, v_2, v_4\}$。跨越割的边:$v_1 \to v_3$(12)、$v_4 \to v_3$(7)、$v_4 \to t$(4),割容量 $= 12 + 7 + 4 = 23 = |f|$,最大流最小割定理成立。

    **解析**:三条增广路径的瓶颈依次为 12、4、7,流值 12 → 16 → 23。注意第 3 条路径「穿过了」$v_4 \to v_3$ 这条「绕行边」——它是正向边(容量 7),不是反向边;反向边的用武之地在更复杂的场景:若某条边先被占用、后要撤销,增广路径就会走它的反向。判断最优靠的不是「没有路」,而是「剩余网络中没有 $s \to t$ 路径」。

    ### 例题 2:二分图匹配转最大流

    > 3 名工人 $A, B, C$ 与 2 项任务 $\{1, 2\}$:A 会做 {1, 2},B 只会 {1},C 只会 {2}。每人至多一项任务、每项任务至多一人。最多能安排几人?

    **建模**:源点 $s$ → 每名工人(容量 1)→ 其会做的任务(容量 1)→ 汇点 $t$(容量 1)。

    **增广过程**:

    - 路径 $s \to A \to 1 \to t$:瓶颈 1,匹配 $A\!-\!1$
    - 路径 $s \to A \to 2 \to t$:$A$ 已占,剩余容量 0,不通;$s \to B \to 1 \to t$:$1$ 已占,不通
    - 路径 $s \to C \to 2 \to t$:瓶颈 1,匹配 $C\!-\!2$

    无更多增广路径,**最大流 = 2**,即最多安排 2 人(如 $A\!-\!1,\ C\!-\!2$,或 $A\!-\!2,\ C\!-\!1$),$B$ 轮空。

    **解析**:容量 1 保证「一工一任务」,流量守恒保证工人和任务都只被用一次。最大匹配 = 最大流的依据是**整数流性质**:整数容量下总存在整数最优流,流经「工人—任务」边的单位流量一一对应匹配对。匈牙利算法做同样的事,但网络流框架可以自然推广到带权、带容量上界的指派问题。

    ### 例题 3:点容量拆点——中转站处理上限

    > 线路 $s \to v \to t$,边容量都很大,但中转站 $v$ 每小时最多处理 2 个单位。求最大流。

    **拆点**:把 $v$ 拆成 $v_{\text{in}}$ 与 $v_{\text{out}}$:原入边 $s \to v$ 改为 $s \to v_{\text{in}}$(容量 10),内部边 $v_{\text{in}} \to v_{\text{out}}$(容量 **2**),出边 $v_{\text{out}} \to t$(容量 10)。

    **求解**:唯一的瓶颈是内部边,最大流 = 2。

    **解析**:没有拆点时答案是 10,完全无视「中转处理能力」;拆点后所有进入 $v$ 的流都必须通过容量为 2 的「咽喉」,守恒自动把上限强加在顶点上。机场起降时刻、仓库日吞吐、路由器转发速率,都是点容量,统统拆点处理。

    ## ⚠️ 常见易错点

    1. **漏建反向边**。没有反向边的「贪心增广」可能停在次优解;反向边是「撤销通道」,增广时必须同时更新两个方向的剩余容量
    2. **增广量不是瓶颈**。沿路径推送的量必须是路径上最小剩余容量;推多了违反容量约束,推少了浪费轮次
    3. **忘记流量守恒**。每增广一轮,中间顶点必须「进多少出多少」;只加正向边不加反向边,守恒就被破坏
    4. **把割容量与流值混为一谈**。割容量是容量之和(横截面能力),流值是实际输送量;只有最优时二者才相等,平时只有 $|f| \leq c(S,T)$
    5. **多源多汇不虚拟化**。多个工厂、多个仓库直接跑算法没有意义;超级源 / 超级汇(容量 $\infty$)一条边搞定
    6. **顶点的限制当边处理**。中转型约束(处理上限)必须拆点;把它写成入边或出边的容量,漏掉了「经过量」与「到达量」的区别

    ## ✏️ 自测练习(选择题)

    **第 1 题** 流网络(有向):$s \to a = 3$、$s \to b = 2$、$a \to b = 1$、$a \to t = 2$、$b \to t = 3$。求最大流值与最小割容量:

    A. 最大流 $= 5$;最小割取 $S = \{s\}$,割边 $s \to a$、$s \to b$,容量 $3+2 = 5$
    B. 最大流 $= 4$;最小割容量 $= 4$
    C. 最大流 $= 5$;最小割容量 $= 6$
    D. 最大流 $= 2$;最小割容量 $= 2$

    <details><summary>查看答案与解析</summary>
    **答案:A**。增广过程:①$s \to a \to t$,瓶颈 $\min(3, 2) = 2$,流值 2;②$s \to b \to t$,瓶颈 $\min(2, 3) = 2$,流值 4;③$s \to a \to b \to t$,此时 $s \to a$ 剩 1、$a \to b$ 容量 1、$b \to t$ 剩 1,瓶颈 1,流值 5。此后 $s$ 的两条出边全满,剩余网络中 $s$ 可达集 $S = \{s\}$,割边 $s \to a$、$s \to b$ 容量和为 $3+2 = 5$ = 流值,最大流最小割定理成立。干扰项:选项 B 漏了第 3 条增广路(只增广两条「直达」路径就停了);选项 C 把 $a \to t$ 也当成了割边(它属于 $S$ 内部,割容量只算从 $S$ 跨到 $T$ 的边);选项 D 只增广了一条路径就放弃。判断最优看的是「剩余网络中不存在 $s \to t$ 路径」,不是「直观上没有路」。
    </details>

    **第 2 题** 为什么说反向边给了 Ford-Fulkerson「反悔」的能力?以下说法**正确**的是:

    A. 反向边的剩余容量 $c_f(v,u) = f(u,v)$ 允许后续增广「退回」早先推送的流,相当于撤销局部决策;没有反向边的贪心会停在次优解
    B. 反向边用来表示双向道路,单行道网络(如物流专线)不需要反向边
    C. 反向边的容量等于正向边的容量,增广时两个方向可以同时推送
    D. 反向边只是为了编程方便,删掉不影响正确性

    <details><summary>查看答案与解析</summary>
    **答案:A**。反向边是「撤销通道」:沿 $u \to v$ 推了 $f$ 的流后,$v \to u$ 获得 $f$ 的剩余容量,后续增广路径可以沿它「退回」先前的流,相当于反悔当时的局部决策。经典反例(无反向边会卡在流值 1):$s \to a = 1$、$s \to b = 1$、$a \to b = 1$、$a \to t = 1$、$b \to t = 1$。若第一条增广走 $s \to a \to b \to t$,则 $a \to t$ 与 $s \to b$ 都被堵死,没有反向边算法停在流值 1;有反向边时,增广 $s \to b \to a \to t$ 沿 $b \to a$ 退回 $a \to b$ 上的 1 个单位,流值到达最优的 2。选项 B 混淆了「图的方向」与「流的撤销方向」(单行道网络同样需要反向边);选项 C 把剩余容量与容量混为一谈(反向剩余容量来自已推流量,不是原边容量);选项 D 恰好丢掉了 FF 正确性的根基——「局部贪心 + 全局反悔」。
    </details>

    **第 3 题** 关于最大流的积分性,下列说法**正确**的是:

    A. 只要所有容量都是整数,FF/EK 每次增广的瓶颈都是整数,最终必存在整数最优流;因此单位容量网络上最大流值 = 最大匹配数
    B. 整数容量下也可能得到分数最优流,需要专门算法保证整数性
    C. 积分性只对二分图网络成立
    D. 只有容量全为 1 时最优流才是整数流

    <details><summary>查看答案与解析</summary>
    **答案:A**。积分性定理:容量全为整数时,FF/EK 的每次增广瓶颈 $b$ 都是整数,流量始终是整数,最终流必然是整数流(且整数线性规划存在整数最优解)。这使「二分图匹配转最大流」成立:所有容量为 1 的网络中,「工人—任务」边上流 1 的边恰好一一对应匹配对,最大流值 = 最大匹配数,不会出现「0.5 个人做 0.5 项任务」的荒谬解。选项 B 否定了积分性定理;选项 C 把适用范围缩小(积分性对任意整数容量网络成立,二分图只是其应用);选项 D 是「容量 1 ⇒ 整数流」的逆命题版本,搞错了方向(容量 5、7 的整数网络同样只有整数最优流)。
    </details>

    ## 🏆 竞赛实战链接

    - **出镜频率**:物资调度、电网输电、通信带宽分配、人员排班都是最大流的天然场景;国赛物流题、美赛网络韧性与灾后救援题中,最大流常作为「能力上限评估」模块出现
    - **论文加分点**:①算出最大流后,**用最小割解释瓶颈**——「割断哪几条边(哪几段道路/线路)就能瘫痪系统」,这是最大流最小割定理最有冲击力的应用;②把结果画成**流量图**(边粗细 ∝ 流量),直观展示负载分布;③需要成本时升级为**最小费用最大流**,说明为何不能只用最大流
    - **工具**:`networkx.maximum_flow`(快速原型)、手写 EK(几十行,面试与论文皆宜)、大规模用 Dinic 或 `ortools`

    ## 💻 代码实现

    ```python
    from collections import deque, defaultdict


    def edmonds_karp(edges, s, t):
        """Edmonds-Karp: BFS 找最短增广路径。edges = [(u, v, cap)]"""
        G = defaultdict(lambda: defaultdict(int))  # 容量
        for u, v, c in edges:
            G[u][v] = c
        f = defaultdict(lambda: defaultdict(int))  # 流量 (含反向边, 斜对称)
        total = 0
        while True:
            parent = {s: None}  # BFS 找 s->t 增广路
            q = deque([s])
            while q and t not in parent:
                u = q.popleft()
                for v in set(G[u]) | set(f[u]):  # 正向 + 反向剩余
                    if G[u][v] - f[u][v] > 0 and v not in parent:
                        parent[v] = u
                        q.append(v)
            if t not in parent:
                break  # 无增广路 -> 已最优
            v, path, bottleneck = t, [], float("inf")
            while parent[v] is not None:  # 回溯找瓶颈
                u = parent[v]
                path.append((u, v))
                bottleneck = min(bottleneck, G[u][v] - f[u][v])
                v = u
            for u, v in path:  # 增广: 正向+, 反向-
                f[u][v] += bottleneck
                f[v][u] -= bottleneck
            total += bottleneck
        # 最小割: 剩余网络中从 s 可达的顶点集 S
        seen, q = {s}, deque([s])
        while q:
            u = q.popleft()
            for v in set(G[u]) | set(f[u]):
                if G[u][v] - f[u][v] > 0 and v not in seen:
                    seen.add(v)
                    q.append(v)
        cut_edges = [(u, v, G[u][v]) for u in seen for v in G[u] if v not in seen]
        return total, f, seen, cut_edges


    # 例题 1 网络
    edges = [
        ("s", "v1", 16),
        ("s", "v2", 13),
        ("v1", "v3", 12),
        ("v2", "v1", 4),
        ("v2", "v4", 14),
        ("v3", "v2", 9),
        ("v3", "t", 20),
        ("v4", "v3", 7),
        ("v4", "t", 4),
    ]
    total, f, S, cut = edmonds_karp(edges, "s", "t")
    print("最大流 =", total)  # 23
    print("最小割 S 集 =", sorted(S))  # ['s', 'v1', 'v2', 'v4']
    print("割边 =", cut, "| 割容量 =", sum(c for _, _, c in cut))  # 23
    print("关键边流量:", {k: dict(v) for k, v in f.items() if any(v.values())})
    ```

    > 输出与例题一致:最大流 23,最小割 $S = \{s, v_1, v_2, v_4\}$,割边 $(v_1, v_3, 12)$、$(v_4, v_3, 7)$、$(v_4, t, 4)$,割容量 23;流量分布与手工表格逐项相同。

    ## 📚 延伸阅读

    - **经典书**:Cormen 等《算法导论》第 26 章——最大流与最小割定理的完整证明
    - **专著**:Ahuja, Magnanti & Orlin, *Network Flows* —— 网络流的百科全书(最小费用流、多商品流都有)
    - **实战**:[networkx 流算法文档](https://networkx.org/documentation/stable/reference/algorithms/flow.html)、洛谷 / OI Wiki 网络流专题
    - **拓展**:最小费用最大流(增广路换成最短路)、Dinic 与当前弧优化、全局最小割(Stoer-Wagner)
    - **进阶关联**:学完本单元 → 接着学《最短路径与Dijkstra》(增广路与最短路共用图搜索工具)→ 《线性规划与单纯形法》(最大流是 LP 的特例,割容量对应其对偶)→ 《整数规划与分支定界》(流模型的 0/1 约束版本)

    ## 🧠 小结

    1. 流网络三约束:容量、守恒、斜对称;最大流 = 源点泵出量的上限
    2. FF 的核心循环:剩余网络里找增广路径 → 按瓶颈推送 → 正向加、反向减,直到无路可走
    3. 反向边 = 反悔通道,没有它贪心会卡在次优;EK 用 BFS 保证多项式时间
    4. 最大流 = 最小割:算出流值只是及格,用最小割讲清「瓶颈在哪」才是高分
    5. 建模三件套:多源多汇 → 超级源汇;点容量 → 拆点;二分图匹配 → 单位容量网络
