  unit_id: modeler_nn_01
  content_md: |
    # 神经网络预测入门

    > **难度**:进阶 · **预计学习时长**:60 分钟 · **主讲智能体**:🧩 建模手 · **方法类别**:预测

    > 📌 **前置单元**:建议先学《线性回归与最小二乘法》(modeler_reg_01)。神经网络可以看作回归的非线性推广,建议先熟悉最小二乘与梯度概念。

    ## 🎯 学习目标

    学完本单元,你应该能够:

    - 写出神经元与多层感知机的前向传播公式,理解激活函数为什么必须非线性
    - 手算一个微型网络的一步反向传播,理解「链式法则」如何把误差分配给每个参数
    - 解释梯度消失的成因,知道 ReLU、批归一化等对策
    - 识别过拟合的信号(训练/验证损失分叉),掌握早停、L2 正则化、Dropout
    - 用 sklearn 的 MLPRegressor 完成一次预测建模,并说清数据标准化与划分的规范

    ## 📖 核心概念

    ### 1. 从线性回归到神经网络

    线性回归 $\hat y = \beta_0 + \beta_1 x$ 只能拟合平面(直线);神经网络通过多层嵌套的「线性变换 + 非线性激活」逼近任意光滑函数——**万能逼近定理**保证:单隐藏层 + 足够多神经元 + 非线性激活,可以在紧集上任意精度逼近任意连续函数。

    预测类竞赛中,神经网络的定位是「**数据量大、非线性强**」时的重型武器;样本量小时它往往不如回归或随机森林(参见《随机森林与集成学习》单元)。选模型先看数据量,是竞赛的第一纪律。

    ### 2. 神经元与激活函数

    单个神经元:输入加权求和后过激活函数:

    $$h = \sigma(w^T x + b)$$

    三个常用激活函数及其性质:

    - **Sigmoid**:$\sigma(z) = \frac{1}{1+e^{-z}} \in (0,1)$。历史经典,但两端导数趋于 0 → 梯度消失
    - **tanh**:值域 $(-1,1)$,零中心,比 sigmoid 好,但两端同样饱和
    - **ReLU**:$f(z) = \max(0, z)$。正半轴导数恒为 1 → 缓解梯度消失,计算快,现代默认;负半轴导数为 0(可能产生「死神经元」,Leaky ReLU 可修补)

    激活函数必须**非线性**——否则多层线性变换的复合仍然是线性变换,一百层网络也只是一次线性回归。

    ### 3. 前向传播与损失函数

    单隐藏层网络(回归任务):

    $$z^{(1)} = W^{(1)}x + b^{(1)}, \qquad h = \sigma(z^{(1)}), \qquad \hat y = W^{(2)}h + b^{(2)}$$

    - 回归损失用均方误差 $L = \frac1n\sum (\hat y_i - y_i)^2$(输出层通常**不加**激活);分类用交叉熵 + softmax
    - 损失函数是「网络表现的成绩单」,训练就是沿梯度下降方向反复减小它

    ### 4. 反向传播(链式法则的系统化)

    反向传播不是新算法,就是**链式法则**:先算输出层损失对输出的梯度,再逐层往回传。核心模式——每一层参数的梯度都是「**误差信号 × 本层输入**」:

    $$\frac{\partial L}{\partial W^{(l)}} = \delta^{(l)} \big(a^{(l-1)}\big)^T, \qquad \delta^{(l)} = \big((W^{(l+1)})^T \delta^{(l+1)}\big) \odot \sigma'(z^{(l)})$$

    其中 $\odot$ 是逐元素相乘。误差信号 $\delta$ 从输出层向输入层传播,每经过一个 sigmoid 都要乘一次 $\sigma' \leq 0.25$——深层网络的梯度因此指数衰减(**梯度消失**)。参数更新:

    $$W \leftarrow W - \eta \frac{\partial L}{\partial W}$$

    学习率 $\eta$ 是首要调参对象:太大震荡甚至发散,太小收敛龟速;竞赛从 $\eta \in \{0.001, 0.01, 0.1\}$ 试起。

    ### 5. 过拟合与三大对策

    神经网络参数多、拟合能力强,**过拟合是头号敌人**。标准信号:训练损失一路下降,而**验证损失先降后升**。对策:

    - **早停(Early Stopping)**:验证损失不再改善就停止训练,最简单有效
    - **L2 正则(权重衰减)**:损失加 $\lambda\|W\|^2$,把权重压小,抑制对噪声的「死记硬背」
    - **Dropout**:训练时随机丢弃一部分神经元(如 20%),迫使网络不依赖个别神经元

    另加数据增强与交叉验证选超参。经验提醒:样本量 < 1000 时,神经网络未必打得过随机森林/梯度提升树——**先试简单模型**。

    ### 6. 数据预处理(预测任务必做)

    - **标准化**:各特征减均值、除以标准差;不做时大尺度特征的梯度主导训练,收敛慢甚至不收敛
    - **划分**:训练/验证/测试三份。**时间序列预测严禁随机打乱**——验证集必须在时间上晚于训练集,否则未来信息泄露,评估结果虚高、实战翻车(参见《时间序列与ARIMA模型》单元)
    - 回归目标的量纲差异大时,输出也建议标准化(预测后再反变换还原)

    ## 🧮 公式与结论

    ### 前向传播(单隐藏层,回归,MSE 损失)

    $$z^{(1)} = W^{(1)}x + b^{(1)}, \qquad h = \sigma(z^{(1)}), \qquad \hat y = W^{(2)}h + b^{(2)}, \qquad L = \frac12(\hat y - y)^2$$

    (单样本损失取 $\frac12$ 系数,求导时正好消去。)

    ### 反向传播梯度(MSE,输出层无激活)

    $$\frac{\partial L}{\partial \hat y} = \hat y - y$$

    $$\frac{\partial L}{\partial W^{(2)}} = (\hat y - y)\, h^T, \qquad \frac{\partial L}{\partial b^{(2)}} = \hat y - y$$

    $$\delta^{(1)} = \big(W^{(2)}\big)^T(\hat y - y) \odot \sigma'(z^{(1)})$$

    $$\frac{\partial L}{\partial W^{(1)}} = \delta^{(1)} x^T, \qquad \frac{\partial L}{\partial b^{(1)}} = \delta^{(1)}$$

    这个「四步模板」对任意层数递归使用:每层的梯度 = 本层误差信号 × 上一层激活值。

    ### 常用激活函数的导数

    | 函数 | 公式 | 导数 |
    |------|------|------|
    | Sigmoid | $\sigma(z) = \dfrac{1}{1+e^{-z}}$ | $\sigma'(z) = \sigma(z)(1-\sigma(z))$ |
    | tanh | $\tanh(z)$ | $1 - \tanh^2(z)$ |
    | ReLU | $\max(0, z)$ | $1$($z>0$);$0$($z<0$) |

    sigmoid 导数最大只有 $0.25$——梯度每反向穿过一层最多保留 $\frac14$,这就是梯度消失的数值根源;ReLU 正半轴导数恒为 1,是深层网络得以训练的关键。

    ### 优化与学习率

    - 批量梯度下降:全数据算一次梯度,稳定但慢;随机梯度下降(SGD):每样本更新,噪声大但快;**小批量(mini-batch)**:折中,现代默认,批量常取 32–256
    - 进阶:Adam 优化器自适应调整每个参数的学习率,竞赛中「Adam + 早停」是稳妥的默认配置

    ## 💡 经典例题

    ### 例题 1:手算前向传播

    > 单隐藏层网络:输入 $x = (1, 2)$,隐藏层 1 个神经元,$W^{(1)} = (0.5, -0.5)$,$b^{(1)} = 0$,sigmoid 激活;输出层 $W^{(2)} = 1$,$b^{(2)} = 0$,无激活。求输出 $\hat y$。

    $$z^{(1)} = 0.5 \times 1 + (-0.5) \times 2 + 0 = -0.5$$

    $$h = \sigma(-0.5) = \frac{1}{1 + e^{0.5}} = \frac{1}{2.6487} = 0.3775$$

    $$\hat y = 1 \times 0.3775 + 0 = 0.3775$$

    **解析**:前向传播就是「矩阵乘法 + 激活」的流水线,手算一次就能明白框架里 `predict` 在做什么。注意真实训练前输入一般要标准化,这里为手算方便未做。

    ### 例题 2:手算一步反向传播(与例题 1 同网络)

    > 目标值 $y = 1$,学习率 $\eta = 0.1$。求各参数的梯度并更新,验证损失下降。

    **损失与输出层梯度**:$L = \frac12(\hat y - 1)^2$,$\frac{\partial L}{\partial \hat y} = \hat y - 1 = 0.3775 - 1 = -0.6225$。

    $$\frac{\partial L}{\partial W^{(2)}} = -0.6225 \times 0.3775 = -0.2350, \qquad \frac{\partial L}{\partial b^{(2)}} = -0.6225$$

    **隐藏层梯度**:$\sigma'(-0.5) = 0.3775 \times (1 - 0.3775) = 0.2350$,

    $$\delta^{(1)} = 1 \times (-0.6225) \times 0.2350 = -0.1463$$

    $$\frac{\partial L}{\partial W^{(1)}} = -0.1463 \times (1, 2) = (-0.1463, -0.2926), \qquad \frac{\partial L}{\partial b^{(1)}} = -0.1463$$

    **更新**($\eta = 0.1$,沿负梯度方向):

    $$W^{(1)} \leftarrow (0.5 + 0.0146,\ -0.5 + 0.0293) = (0.5146, -0.4707), \qquad b^{(1)} \leftarrow 0.0146$$

    $$W^{(2)} \leftarrow 1 + 0.0235 = 1.0235, \qquad b^{(2)} \leftarrow 0.0623$$

    **验证**:更新后重算前向,$z^{(1)} = 0.5146 \times 1 - 0.4707 \times 2 + 0.0146 = -0.4122$,$h = \sigma(-0.4122) = 0.3984$,$\hat y = 1.0235 \times 0.3984 + 0.0623 = 0.4700$,损失从 $0.5 \times 0.6225^2 = 0.1938$ 降到 $0.5 \times 0.5300^2 = 0.1404$ ✓。

    **解析**:每个梯度都是「误差信号 × 本层输入」——误差从输出层往回传,每层只负责自己的局部乘法,这就是反向传播的全部。手算一步,胜过读十页推导。

    ### 例题 3:过拟合的信号与早停(数值实验)

    > 实验:120 个样本,$y = \sin(3x) + \varepsilon$(噪声标准差 0.15),70 个训练、50 个验证;单隐藏层 64 个 tanh 神经元,全批量梯度下降,学习率 0.08。每 200 轮记录训练/验证 MSE:

    | 迭代轮数 | 训练 MSE | 验证 MSE |
    |----------|----------|----------|
    | 200 | 0.2249 | 0.4591 |
    | 400 | 0.1929 | 0.4531 |
    | 800 | 0.1307 | 0.3749 |
    | 1200 | 0.0895 | 0.3333 |
    | 1600 | 0.0712 | 0.3209 |
    | 2000 | 0.0639 | **0.3194** |
    | 2400 | 0.0606 | 0.3202 |
    | 3000 | 0.0577 | 0.3213 |

    训练误差单调下降,验证误差在**第 2000 轮达到最低 0.3194 后开始回升**——此后网络在「背数据」。结论:早停点设在 2000 轮附近;或改用 L2 正则、Dropout、更小的网络(如 16 个神经元)。

    **解析**:这是过拟合的标准剧本:训练损失「表演」,验证损失「判分」。竞赛中画出这张双曲线图并标注早停点,比堆十个模型更有说服力。表中数字由上述设定真实运行得到(固定随机种子可复现),论文中请用自己的数据重画这张图。

    ## ⚠️ 常见易错点

    1. **不标准化直接训练**。大尺度特征的梯度主导训练,收敛慢甚至不收敛;标准化器只能用训练集拟合,再套用到验证/测试集
    2. **时间序列乱切训练集**。随机打乱 → 验证集混入未来信息 → 评估虚高,真预测翻车;按时间切分或用 walk-forward 评估
    3. **只看训练损失**。训练损失降、验证损失升还在继续训 → 过拟合;必须画双曲线,以验证损失为准做早停
    4. **学习率不调**。默认值未必适合;$\eta$ 太大损失震荡或 NaN,太小几小时不动——先看损失曲线再调参
    5. **用 sigmoid 堆深网络**。梯度每层最多保留 0.25,深层学不动;ReLU + 合适初始化是现代默认
    6. **小样本上迷信神经网络**。几十个样本的题目,神经网络几乎必输给回归/随机森林;先简后繁,神经网络留作对比实验

    ## ✏️ 自测练习(选择题)

    **第 1 题**对 sigmoid 激活函数 $\sigma(z) = \frac{1}{1+e^{-z}}$,求 $\sigma(0)$ 与 $\sigma'(0)$ 的值:

    A. 0.5 与 0.5
    B. 0.25 与 0.5
    C. 0.5 与 0.25
    D. 0 与 0

    <details><summary>查看答案与解析</summary>
    **答案:C**。$\sigma(0) = \frac{1}{1+e^0} = 0.5$,$\sigma'(z) = \sigma(z)(1-\sigma(z))$,故 $\sigma'(0) = 0.5 \times 0.5 = 0.25$。sigmoid 导数最大也只有 0.25——梯度每反向穿过一层最多保留四分之一,穿 4 层后不足 0.4%,这就是**梯度消失**的数值根源;ReLU 正半轴导数恒为 1,是深层网络得以训练的关键。「0.5 与 0.5」把导数记成了函数值;「0.25 与 0.5」把两者颠倒。
    </details>

    **第 2 题**为什么神经网络的激活函数必须是非线性的?

    A. 线性变换的复合仍是线性变换,多层网络会退化为单层线性回归,无法拟合非线性关系
    B. 线性激活函数不可导,无法进行反向传播
    C. 非线性激活可以彻底消除梯度消失
    D. 为了增加网络的参数量

    <details><summary>查看答案与解析</summary>
    **答案:A**。$\hat y = W_2(W_1 x) = (W_2 W_1)x$——线性变换的复合仍是线性变换,无论堆多少层都等价于一次线性回归,表达能力没有增加。非线性激活「掰弯」每一层的输出,多层叠加才有逼近任意光滑函数的能力(万能逼近定理)。线性函数(如 $f(z)=z$)可导且导数为 1,「不可导」与事实不符;非线性并不能消除梯度消失(sigmoid 恰好是梯度消失的来源),缓解它靠 ReLU 等设计;参数量与激活函数无关。
    </details>

    **第 3 题**训练过程中,训练损失持续下降而验证损失先降后升。这说明了什么,正确的对策是:

    A. 网络欠拟合,应加大网络规模继续训练
    B. 数据存在泄露,应清洗数据
    C. 网络过拟合,应早停/L2 正则/Dropout
    D. 学习率太小,应增大学习率

    <details><summary>查看答案与解析</summary>
    **答案:C**。训练损失下降、验证损失上升是过拟合的标准剧本:网络开始「背」训练数据的噪声,泛化能力下降。对策:①早停(在验证损失最低点停止);②L2 正则(权重衰减);③Dropout(随机丢弃神经元);以及减小网络规模、增加数据。「欠拟合」的表现是两个损失都还很高且都在下降;「学习率太小」的典型表现是损失下降极慢,而不是分叉;数据泄露(如时间序列随机打乱)会导致验证损失**虚低**,方向相反。竞赛中画出训练/验证双曲线并标注早停点,比堆十个模型更有说服力。
    </details>

    ## 🏆 竞赛实战链接

    - **出镜场景**:美赛 C 题(大数据题)是神经网络的主场——2020 C(评论情感分析)、2022 C(黄金/比特币价格预测)均可用 MLP 与统计模型对比;国赛 2021 B(乙醇偶合制备 C4 烯烃)的实验数据多特征拟合、2023 C(蔬菜定价补货)的销量预测,神经网络可作为对比模型之一
    - **论文加分点**:①训练/验证**双曲线图 + 早停点**;②网络结构选择的依据(试了几个结构,给出验证误差表);③与回归、随机森林的对比实验,解释优劣;④写清标准化与数据划分细节,评委一眼看出你懂规范
    - **纪律**:题目数据量小(几十个样本)时,**不要**硬上神经网络——评委一定会问「为什么不先试回归」;神经网络出场要有「数据量 + 非线性」的双重理由

    ## 💻 代码实现

    ```python
    import numpy as np
    from sklearn.neural_network import MLPRegressor
    from sklearn.preprocessing import StandardScaler
    from sklearn.model_selection import train_test_split
    from sklearn.metrics import mean_squared_error

    # 模拟非线性数据:y = sin(3x) + 噪声
    rng = np.random.default_rng(0)
    X = rng.uniform(-2, 2, (300, 1))
    y = np.sin(3 * X[:, 0]) + rng.normal(0, 0.15, 300)

    # 时间序列数据请用 train_test_split(..., shuffle=False) 按时间切分
    X_tr, X_va, y_tr, y_va = train_test_split(X, y, test_size=0.25, random_state=0)
    sc = StandardScaler().fit(X_tr)  # 只用训练集拟合标准化器!
    X_tr_s, X_va_s = sc.transform(X_tr), sc.transform(X_va)

    mlp = MLPRegressor(
        hidden_layer_sizes=(32, 16),  # 两层隐藏
        activation="relu",  # ReLU 抗梯度消失
        solver="adam",
        alpha=1e-3,  # L2 正则
        learning_rate_init=1e-3,
        max_iter=500,
        early_stopping=True,
        validation_fraction=0.2,  # 早停
        random_state=0,
    ).fit(X_tr_s, y_tr)

    print("训练 MSE:", round(mean_squared_error(y_tr, mlp.predict(X_tr_s)), 4))
    print("验证 MSE:", round(mean_squared_error(y_va, mlp.predict(X_va_s)), 4))
    print("训练轮数:", mlp.n_iter_)
    print("验证损失曲线:", np.round(mlp.validation_scores_, 4))
    # validation_scores_ 就是早停依据的曲线,论文里直接画它
    ```

    > `validation_fraction` 会从训练集中再切一块做早停监控,真正的测试集(上面的 `X_va`)全程不参与训练,报告结果时注意区分两者。

