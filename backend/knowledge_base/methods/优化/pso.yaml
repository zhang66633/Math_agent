  unit_id: modeler_pso_01
  content_md: |
    # 粒子群优化算法

    > **难度**:进阶 · **预计学习时长**:45 分钟 · **主讲智能体**:🧩 建模手 · **方法类别**:优化

    ## 🎯 学习目标

    学完本单元,你应该能够:

    - 解释 PSO 的群体智能思想,写出速度-位置更新公式并逐项说明含义
    - 手工完成一步 PSO 迭代,理解 pbest/gbest 的更新规则
    - 说出惯性权重、学习因子、收缩因子的作用与推荐取值
    - 识别早熟收敛,掌握常见的缓解手段
    - 用实验数据说明 PSO 的适用边界(什么函数好解、什么函数难解)

    ## 📖 核心概念

    ### 1. 鸟群觅食的隐喻

    Kennedy 与 Eberhart 1995 年提出:鸟群找食时,每只鸟同时受两种力量牵引——**自己飞过的最好位置**(个体经验,叫认知)与**群体发现的最好位置**(社会信息,叫社会)。PSO 把鸟简化成无质量、无体积的「粒子」:只有位置 $x$(候选解)与速度 $v$(移动方向和步长)。

    与 GA 的关键区别:PSO **没有选择与淘汰**,粒子永不死亡,只通过记忆(pbest/gbest)不断修正飞行方向。

    ### 2. 三个核心记忆

    - $x_i$:粒子 $i$ 的当前位置
    - $pbest_i$:粒子 $i$ 历史上到达的最好位置(个体最优)
    - $gbest$:全体粒子历史上到达的最好位置(全局最优)

    更新规则:$pbest_i$ 只在「新位置更好」时更新;$gbest$ 只在「有人刷新纪录」时更新。

    ### 3. 速度更新公式逐项拆解

    $$v_i \leftarrow w\,v_i + c_1 r_1\,(pbest_i - x_i) + c_2 r_2\,(gbest - x_i), \qquad x_i \leftarrow x_i + v_i$$

    | 项 | 名称 | 作用 |
    |----|------|------|
    | $w v_i$ | 惯性项 | 保持原方向,维持运动惯性;$w$ 大偏全局,$w$ 小偏局部 |
    | $c_1 r_1 (pbest_i - x_i)$ | 认知项 | 拉回自己的历史最佳 |
    | $c_2 r_2 (gbest - x_i)$ | 社会项 | 拉向群体的历史最佳 |

    $r_1, r_2$ 是 $[0,1]$ 均匀随机数,每次更新重新抽取——随机性让每条例子的轨迹不同,这是 PSO 探索能力的来源。

    ### 4. 参数与拓扑

    - **惯性权重** $w$:线性递减(0.9 → 0.4)是经典配置——开局大步探索、后期小步精修
    - **学习因子** $c_1, c_2$:常取相等,和为 4 附近(见收缩因子);$c_1 \gg c_2$ 时粒子各自为政(近似随机搜索),$c_2 \gg c_1$ 时一拥而上(易早熟)
    - **拓扑**:gbest 全连接收敛快但易早熟;lbest(只与邻居比)收敛慢但多样性好,适合多峰函数
    - **速度钳制**:$v$ 夹在 $[-V_{\max}, V_{\max}]$($V_{\max}$ 常取搜索范围的一部分),防止速度爆炸

    ## 🧮 公式与结论

    ### 收缩因子形式(Clerc & Kennedy, 2002)

    $$v_i \leftarrow \chi\left[v_i + c_1 r_1(pbest_i - x_i) + c_2 r_2(gbest - x_i)\right], \qquad \chi = \frac{2}{\left|\,2 - \varphi - \sqrt{\varphi^2 - 4\varphi}\,\right|}, \quad \varphi = c_1 + c_2 > 4$$

    取 $c_1 = c_2 = 2.05$($\varphi = 4.1$)得 $\chi \approx 0.7298$,即**收敛版本的默认参数** $c_1 = c_2 \approx 1.4945,\ w \approx 0.729$。收缩因子从数学上保证粒子轨迹收敛,替代了速度钳制的大部分作用。

    ### 一维动力学直觉

    单个粒子且 $pbest, gbest$ 固定时,更新规则退化为二阶差分方程,粒子轨迹沿 $pbest$ 与 $gbest$ 的加权中点方向**阻尼振荡**收敛——这就是粒子「盘旋逼近」最优解的原因。$r_1, r_2$ 的随机性使振荡不发散也不僵死,恰在临界阻尼附近。

    ### 经典参数档位

    | 配置 | 参数 | 适用 |
    |------|------|------|
    | 经典 PSO | $w$ 0.9→0.4 线性递减,$c_1 = c_2 = 2$ | 通用默认 |
    | 收缩因子 PSO | $\chi = 0.7298$,$c_1 = c_2 = 1.4945$ | 要求轨迹稳定收敛 |
    | 局部版(lbest) | 同上,但社会项用邻域最优 | 多峰、易早熟问题 |

    ## 💡 经典例题

    ### 例题 1:一维 PSO 一步手算

    > 求 $\min f(x) = x^2$。两个粒子:$x_1 = 2, v_1 = 1$;$x_2 = -3, v_2 = -1$。初始 $pbest_1 = 2,\ pbest_2 = -3$,故 $gbest = 2$($f=4$ 最小)。取 $w = 0.5,\ c_1 = c_2 = 1$,且设 $r_1 = r_2 = 1$(一次实现)。执行一步迭代。

    **粒子 1**:

    $$v_1' = 0.5 \times 1 + 1\times(2-2) + 1\times(2-2) = 0.5, \qquad x_1' = 2 + 0.5 = 2.5$$

    $f(2.5) = 6.25 > f(pbest_1) = 4$,故 $pbest_1$ 不变。

    **粒子 2**:

    $$v_2' = 0.5 \times (-1) + 1\times(-3+3) + 1\times(2+3) = -0.5 + 0 + 5 = 4.5, \qquad x_2' = -3 + 4.5 = 1.5$$

    $f(1.5) = 2.25 < 9$,更新 $pbest_2 = 1.5$;又 $2.25 < 4$,更新 **$gbest = 1.5$**。

    **解析**:一步之内,粒子 2 被社会项(指向 $gbest=2$ 的拉力 $5$)强力拽向右侧,落地即刷新全局纪录。注意粒子 1 虽然 $x=2$ 已在最优点附近,反而只是缓慢漂移——PSO 的收敛靠**集体**而非个体:总有人「撞出」新纪录,再广播给全群。若把 $r_1, r_2$ 换成别的随机数,轨迹会变,但「被 pbest/gbest 牵引」的定性结构不变。

    ### 例题 2:收敛轨迹与适用边界(实验数据)

    > 10 维 Ackley 函数($f^* = 0$),50 粒子,$w$ 从 0.9 线性递减到 0.4,$c_1 = c_2 = 1.4945$,预算 50000 次评估。一次运行的全局最优记录:

    | 评估次数 | 50 | 10000 | 20000 | 30000 | 50000 |
    |----------|----|-------|-------|-------|-------|
    | $gbest$ 值 | 19.73 | 0.873 | $1.9\times10^{-5}$ | **0.0** | 0.0 |

    30 次独立运行:均值 **0.0000**,标准差 0.0000——全部收敛到全局最优附近。

    **换一个战场**:10 维 Rastrigin 函数(大量深局部最优),同样配置 30 次运行:均值 **4.15**,标准差 1.91,最好一次 0.995。PSO 显著「卡壳」:粒子群在 2 万次评估左右集体停在一个局部最优盆地,惯性耗散后无人能逃出。

    **解析**:PSO 的强项是**光滑、单峰或浅多峰**的连续问题(Ackley 几乎无解可失);弱点是**深多峰**问题(早熟)与**高维**问题(社会项牵引力分散)。Rastrigin 上它输给了多样性更好的算法——这正是《启发式算法综合实战》单元「先看问题特征再选算法」的依据。

    ### 例题 3:参数失衡的两个极端(定性实验)

    > 仍用 $\min f(x) = x^2$ 说明 $c_1, c_2$ 失衡的后果。

    - **只留认知项**($c_1 = 1, c_2 = 0$):每个粒子只被自己的 pbest 牵引,群内互不相通。$N$ 个粒子等价于 $N$ 次独立的随机局部搜索——没有社会学习,PSO 退化成「多起点爬山」
    - **只留社会项**($c_1 = 0, c_2 = 1$):所有粒子只追 gbest。一旦 gbest 陷入局部最优且粒子们速度耗尽,全群静止在一点,多样性归零——典型的**早熟收敛**

    **解析**:认知项与社会项的平衡是 PSO 的生命线,所以标准配置总是 $c_1 = c_2$。若问题多峰,还可以把社会项从「全局最优」改成「邻域最优」(lbest 拓扑),用收敛速度换多样性。

    ## ⚠️ 常见易错点

    1. **忘记速度钳制或收缩因子,粒子飞出搜索域**。$x_i \leftarrow x_i + v_i$ 可能一步跳出可行域;先钳制 $v$,再处理越界 $x$(截断到边界或反弹)
    2. **$r_1, r_2$ 只在初始化时生成一次**。它们是**每次迭代每个粒子**都要重抽的随机数;用常数会退化成确定性迭代,丧失探索能力
    3. **pbest 比较方向弄反**。最小化问题:只有 $f(x_i) < f(pbest_i)$ 才更新;最大化则相反。方向反了,粒子群会把「最差位置」当宝
    4. **把 PSO 当 GA 用,加「淘汰-重生」**。PSO 无选择机制,粒子不死亡;确有变体在粒子停滞时重置其位置(重启策略),但这不是默认流程,论文中要说明是变体
    5. **惯性权重恒取 1**。$w=1$ 无衰减时粒子高速振荡难以收敛;经典做法是线性递减(0.9→0.4)或直接用收缩因子版本
    6. **单次运行就下结论**。PSO 结果对随机种子敏感(尤其多峰问题);竞赛报告必须 20–30 次独立运行 + 均值/标准差/箱线图

    ## ✏️ 自测练习(选择题)

    **第 1 题**$\min f(x) = x^2$。某粒子 $x = 3,\ v = 1$,其 $pbest = 3$;群体 $gbest = -1$。取 $w = 0.8,\ c_1 = c_2 = 1.5$,设 $r_1 = r_2 = 1$。执行一步迭代后,位置 $x'$ 及 pbest、gbest 的更新情况为:

    A. $x' = -2.2$,pbest 更新为 $-2.2$,gbest 也更新为 $-2.2$
    B. $x' = -2.2$,pbest 更新为 $-2.2$,gbest 保持 $-1$
    C. $x' = 9.8$,pbest 保持 3,gbest 保持 $-1$
    D. $x' = -2.2$,pbest 保持 3,gbest 保持 $-1$

    <details><summary>查看答案与解析</summary>
    **答案:B**。速度更新:$v' = 0.8 \times 1 + 1.5 \times (3-3) + 1.5 \times (-1-3) = 0.8 + 0 - 6 = -5.2$,故 $x' = 3 - 5.2 = -2.2$,$f(x') = 4.84$。$f(x') = 4.84 < f(pbest) = 9$,故 pbest 更新为 $-2.2$;但 $f(gbest) = f(-1) = 1 < 4.84$,gbest **不变**——gbest 只在有人刷新纪录时更新。「pbest 不变」漏了 pbest 的比较;「gbest 也更新」忘了与 gbest 的目标值比较;「$x' = 9.8$」是把 $(gbest - x)$ 的负号丢掉的计算错误。该粒子被社会项大力拽向 $-1$,却因惯性「刹不住车」冲过了头——振荡收敛的典型表现。
    </details>

    **第 2 题**关于 PSO 的 gbest 与 lbest 拓扑,下列说法**正确**的是:

    A. gbest 信息传播即时、收敛快,但易全群落入局部最优;lbest 收敛慢但多样性好,适合多峰问题
    B. lbest 比 gbest 收敛更快,因为邻居之间竞争更激烈
    C. gbest 的多样性更好,因为它让所有粒子共享同一信息
    D. 两者只在实现代码上不同,收敛行为完全一致

    <details><summary>查看答案与解析</summary>
    **答案:A**。gbest 全连接:所有粒子共享同一个全局最优,收敛快,但一旦 gbest 陷入局部最优,全群会被一起拉进去(单点故障)。lbest 只与邻居子集比较,信息沿拓扑逐级传播,收敛慢,但能形成多个「亚群」各自探索不同区域,多样性好。选 lbest 的场景:多峰函数、高维问题、已知易早熟的问题;工程做法:先跑 gbest,若收敛曲线过早平坦(早熟迹象),改 lbest 或混合拓扑。
    </details>

    **第 3 题**收缩因子版 PSO 取 $c_1 = c_2 = 2.05$($\varphi = 4.1$)时,收缩因子 $\chi$ 约为:

    A. 1.4945
    B. 0.5
    C. 0.7298
    D. 2.05

    <details><summary>查看答案与解析</summary>
    **答案:C**。$\chi = \frac{2}{|2 - \varphi - \sqrt{\varphi^2 - 4\varphi}|} = \frac{2}{|-2.1 - \sqrt{0.41}|} \approx \frac{2}{2.7403} \approx 0.7298$。它同时缩放三项,等价于「无收缩因子 + $w = 0.729$、$c_1 = c_2 = 2.05\chi \approx 1.4945$」——文献中「$w=0.729,\ c_1=c_2=1.49445$」这组神秘参数正是从这里推出的,不是凑出来的。「1.4945」把缩放后的等效系数当成了 $\chi$;「2.05」是原始系数;「0.5」是拍脑袋。
    </details>

    ## 🏆 竞赛实战链接

    - **出镜频率**:PSO 是连续优化、参数标定、曲线拟合类问题的常用解法(如模型参数寻优、神经网络权重初始化辅助、PID 整定);组合问题上 PSO 需离散化(置换编码 + 重定义速度),效果常不如 GA/ACO
    - **论文加分点**:①逐项解释速度更新公式(评委看得出你是否真懂);②参数选择的**依据**(收缩因子推导或预实验);③多运行统计 + 收敛曲线;④与 SA/GA 的公平对比(参见《启发式算法综合实战》单元)
    - **警示**:PSO 论文满天飞,写不好就沦为「套壳」。想突出:改拓扑(lbest)、加重启、或论证为何选 PSO(问题连续、可微性差、维数适中)

    ## 💻 代码实现

    ```python
    import numpy as np

    rng = np.random.default_rng(42)


    def ackley(x):
        d = len(x)
        return (
            -20 * np.exp(-0.2 * np.sqrt(np.sum(x * x) / d))
            - np.exp(np.sum(np.cos(2 * np.pi * x)) / d)
            + 20
            + np.e
        )


    D, POP, BUDGET, LO, HI = 10, 50, 50000, -32.768, 32.768
    x = rng.uniform(LO, HI, (POP, D))
    v = np.zeros((POP, D))
    fx = np.array([ackley(xi) for xi in x])
    pbest, pbv = x.copy(), fx.copy()

    g = int(np.argmin(pbv))
    gbest, gbv = pbest[g].copy(), pbv[g]
    evals = POP
    while evals < BUDGET:
        w = 0.9 - 0.5 * evals / BUDGET  # 惯性权重线性递减
        r1, r2 = rng.random((POP, D)), rng.random((POP, D))
        v = w * v + 1.4945 * r1 * (pbest - x) + 1.4945 * r2 * (gbest - x)
        v = np.clip(v, -0.5 * (HI - LO), 0.5 * (HI - LO))  # 速度钳制
        x = np.clip(x + v, LO, HI)  # 边界截断
        fx = np.array([ackley(xi) for xi in x])
        better = fx < pbv  # 最小化:更小才更新
        pbest[better], pbv[better] = x[better], fx[better]
        g = int(np.argmin(pbv))
        if pbv[g] < gbv:
            gbest, gbv = pbest[g].copy(), pbv[g]
        evals += POP

    print("最优值: %.3e (理论最优 0)" % gbv)
    ```

    ## 📚 延伸阅读

    - **原始文献**:Kennedy & Eberhart (1995), *Particle Swarm Optimization*, Proc. IEEE ICNN — 7 页的开山论文
    - **经典论文**:Clerc & Kennedy (2002), *The Particle Swarm: Explosion, Stability, and Convergence in a Multidimensional Complex Space* — 收缩因子的出处
    - **视频**:B 站搜索「粒子群优化 可视化」,看粒子盘旋逼近最优点最直观
    - **进阶关联**:多目标版 PSO 与 NSGA-II 的对比 → 《多目标优化与NSGA-II》单元;算法选型与公平对比 → 《启发式算法综合实战》单元

    ## 🧠 小结

    1. PSO = 惯性 + 认知 + 社会三力合成:粒子被 pbest 与 gbest 牵引盘旋逼近最优,无选择淘汰机制
    2. 默认参数 $w = 0.729,\ c_1 = c_2 = 1.4945$ 来自收缩因子 $\varphi = 4.1$ 的推导,不是拍脑袋
    3. 强项:光滑连续问题(10 维 Ackley 全部收敛到 0);弱项:深多峰(Rastrigin 均值 4.15 的早熟)与高维
    4. 早熟识别:gbest 长期不动 + 全群速度趋零;对策:lbest 拓扑、粒子重启、混合算法
    5. 报告规范:30 次独立运行 + 均值/标准差 + 收敛曲线;「全局最优」四个字不能乱用
