method_card:
  name: Prophet预测模型
  name_en: ''
  category:
  - 预测
  principle: 'Prophet是Facebook开发的时间序列预测模型，适合具有季节性和节假日效应的商务时间序列。


    > ⚠️ **维护状态提示**：Prophet 官方已停止积极维护，新项目建议优先使用 `statsmodels`（STL/ETS/ARIMA，本章 §6/§7）或 `chronos` 等现代时序模型；仅在已有
    Prophet 依赖或题目明确要求时使用本节方案。模型公式与思想仍可参考学习。


    **模型公式**：

    $$

    y(t) = g(t) + s(t) + h(t) + \varepsilon_t

    $$


    其中：

    - $g(t)$：趋势项（线性或逻辑斯谛）

    - $s(t)$：季节项（傅里叶级数）

    - $h(t)$：节假日效应

    - $\varepsilon_t$：误差项


    **趋势项**（线性）：$g(t) = (k + a_k \delta(t) \cdot t + (m + a_m \delta(t))$


    **季节项**：$s(t) = \sum_{n=1}^{N} [a_n \cos(\frac{2\pi n t}{P}) + b_n \sin(\frac{2\pi n t}{P})]$'
  applicable_when:
  - 时间序列具有长期趋势成分，且趋势可能发生突变（如政策、市场变化）。
  - 数据表现出明显的周期性（如年、周、日）且周期长度已知。
  - 存在已知的节假日或特殊事件，且这些事件对序列有显著影响。
  - 数据频率为日度、周度或月度，且时间跨度足够覆盖多个季节周期。
  - 允许使用加法或乘法季节分解，且误差项近似独立同分布。
  typical_scenarios:
  - 具有明显季节性的商务时间序列预测，如月度销售额、季度营收等。
  - 包含节假日效应的业务数据预测，如零售、电商、旅游等行业的日度或周度数据。
  - 需要快速构建可解释性较强的时间序列预测基线模型时。
  - 数据存在缺失值或异常值，且希望模型能自动处理这些情况时。
  - 需要预测未来一段时间趋势并分解趋势、季节、节假日成分的场景。
  code_snippets:
  - language: python
    description: Prophet预测模型 实现要点
    code: "from prophet import Prophet\nimport pandas as pd\n\ndef prophet_forecast(df, periods=30, yearly_seasonality=True,\
      \ weekly_seasonality=True):\n    \"\"\"\n    Prophet时间序列预测\n    :param df: DataFrame with columns\
      \ 'ds' (datetime) and 'y' (value)\n    :param periods: 预测步数\n    :return: 预测结果\n    \"\"\"\n   \
      \ # 创建模型\n    model = Prophet(\n        yearly_seasonality=yearly_seasonality,\n        weekly_seasonality=weekly_seasonality,\n\
      \        daily_seasonality=False,\n        seasonality_mode='additive'\n    )\n\n    # 添加自定义季节性\n\
      \    model.add_seasonality(name='monthly', period=30.5, fourier_order=5)\n\n    # 拟合模型\n    model.fit(df)\n\
      \n    # 创建未来日期\n    future = model.make_future_dataframe(periods=periods)\n\n    # 预测\n    forecast\
      \ = model.predict(future)\n\n    return forecast, model\n"
  related_papers: []
  difficulty: 3
  quality_rating: 3
  tags:
    key_concepts:
    - Prophet预测模型
    chart_types:
    - '**预测分解图**：趋势、季节、节假日分解'
    - '**预测区间图**：不确定性区间'
    - '**组件影响图**：各组件贡献'
    source: math-modeling-skill
  id: mc_68
  formulas:
  - y(t) = g(t) + s(t) + h(t) + \varepsilon_t，其中 y(t) 为时间 t 的观测值，g(t) 为趋势项，s(t) 为季节项，h(t) 为节假日效应，\varepsilon_t
    为误差项。
  - g(t) = (k + a_k \delta(t)) \cdot t + (m + a_m \delta(t))，其中 k 为基本增长率，\delta(t) 为指示函数（变点处为1否则0），a_k 为增长率调整量，m
    为截距，a_m 为截距调整量。
  - s(t) = \sum_{n=1}^{N} \left[ a_n \cos\left(\frac{2\pi n t}{P}\right) + b_n \sin\left(\frac{2\pi n t}{P}\right)
    \right]，其中 N 为傅里叶级数阶数，P 为周期长度（如年=365.25，周=7），a_n, b_n 为待估系数。
  - h(t) = \sum_{i=1}^{L} \kappa_i \cdot 1_{\{t \in D_i\}}，其中 L 为节假日数量，\kappa_i 为第 i 个节假日效应，D_i 为第 i 个节假日对应的时间集合，1
    为指示函数。
