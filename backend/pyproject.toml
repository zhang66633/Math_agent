[project]
name = "math-model-agent"
version = "0.1.0"
description = "数学建模多智能体辅助系统"
requires-python = ">=3.11"
# 注：readme 字段已移除——backend/ 下无 README.md（在仓库根），poetry-core 构建元数据会因读不到而失败

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-chroma>=0.2.0",
    "chromadb>=0.5.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "redis>=5.0.0",
    "fakeredis>=2.0.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.9",
    "rank-bm25>=0.2.2",
    "sympy>=1.12",
    "cvxpy>=1.4.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "tabulate>=0.9.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "python-docx>=1.0.0",
    "pdfplumber>=0.10.0",
    "click>=8.0.0",
    "psutil>=5.9.0",
]

# 可选能力（代码侧全部惰性 import，缺失时功能降级并给出安装提示）：
#   ocr    — 扫描版 PDF OCR（rapidocr）与 PDF 页渲染（pymupdf）、PyPDF2 兜底解析
#   search — DuckDuckGo 联网搜索工具
# 一键安装默认带上：pip install -e "backend[ocr,search]"
# 已移除的死依赖：pytesseract / pdf2image（代码改走 rapidocr+pymupdf 后无人 import）
[project.optional-dependencies]
ocr = [
    "pymupdf>=1.24.0",
    # rapidocr 1.3.0/1.4.4 的 requires_python 分别为 <3.12 / <3.13，3.13 可用最新只有 1.2.3；
    # opencv-python 无 win cp314 wheel，3.14 跳过该依赖（代码侧惰性 import，缺失时提示安装即可）
    "rapidocr_onnxruntime>=1.2.3; python_version < '3.14'",
    "PyPDF2>=3.0.0",
]
search = [
    "duckduckgo-search>=6.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.6.0",
]

[tool.poetry]
packages = [{ include = "app", from = "." }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501 行超长交给 formatter；B008 默认参数调用（FastAPI Depends 惯用法）不查；
# B904 raise-from 风格：本项目路由层统一「log+raise HTTPException」模式，逐处补 from 无行为价值
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.per-file-ignores]
# 测试文件先 sys.path 引导再 import app（脚本模式兼容），E402 属刻意
"tests/**" = ["E402"]
# god-files 拆分的知识库路由：import * 共享 schema 命名空间 + 路由实例定义在导入前
"app/api/knowledge_search_routes.py" = ["E402", "F405"]
"app/api/knowledge_crud_routes.py" = ["E402", "F405"]
# main.py 必须先 load_dotenv 再导入 config/路由（显式 .env 加载）
"app/main.py" = ["E402"]
# router.py auth 内联路由在 api_router 装配后定义；tasks.py/indexer.py 局部导入规避循环依赖
# nodes.py 底部是 core/agents/* 的再导出（拆分布局后保持 app.core.nodes import 路径兼容）
"app/api/router.py" = ["E402"]
"app/api/tasks.py" = ["E402"]
"app/core/nodes.py" = ["E402"]
"app/knowledge/indexer.py" = ["E402"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
