  content_md: |
    # 偏微分方程与有限差分

    > **难度**:实战 · **预计学习时长**:60 分钟 · **主讲智能体**:🧩 建模手 · **方法类别**:偏微分方程

    ## 🎯 学习目标

    学完本单元,你应该能够:

    - 识别热传导、波动、稳态三类经典 PDE 的典型应用场景,并写出对应的定解问题
    - 用泰勒展开推导一维热方程的显式差分格式,理解「时间前差 + 空间中心差」的由来
    - 用 von Neumann 方法证明显式格式的稳定性条件 $s \le 1/2$,并据此选取时间步长
    - 正确处理 Dirichlet、Neumann、周期三类边界条件
    - 编写可运行的差分程序,并用解析解、稳态解验证数值结果的正确性

    ## 📖 核心概念

    ### 1. 三大经典 PDE 与它们的物理含义

    | 方程 | 形式 | 典型场景 |
    |------|------|---------|
    | **热传导/扩散方程** | $u_t = \alpha u_{xx}$ | 炉温分布、污染物扩散、热量传递 |
    | **波动方程** | $u_{tt} = c^2 u_{xx}$ | 弦振动、声波、水波 |
    | **稳态方程(Laplace/Poisson)** | $u_{xx} + u_{yy} = 0\ (\text{或 } f)$ | 稳态温度场、电势分布、薄膜平衡 |

    > 💡 **建模心法**:PDE 与 ODE 的区别在于状态量同时依赖时间**和空间**——ODE 假设「空间上充分混合」(如污染箱模型),PDE 则把空间分布也当作未知量。什么时候必须上 PDE?当题目问的是「**分布**」而不是「总量」时:炉温沿传送带的分布、污染物沿河流的浓度曲线、热源周围的温度场。

    ### 2. 扩散型建模的通用写法:守恒律 + 菲克定律

    对一维介质中微小段 $[x, x+\Delta x]$ 写质量(或热量)守恒:

    $$\frac{\partial u}{\partial t} = -\frac{\partial q}{\partial x} + s(x,t)$$

    其中 $q$ 是通量(单位时间通过单位截面的量),$s$ 是源汇项。若通量服从**菲克定律** $q = -D \dfrac{\partial u}{\partial x}$(沿浓度下降方向流动),就得到扩散方程:

    $$\frac{\partial u}{\partial t} = D\frac{\partial^2 u}{\partial x^2} + s(x,t)$$

    再加**对流项**(介质本身以速度 $v$ 流动)就是水质模型的核心——一维对流扩散方程:

    $$\frac{\partial c}{\partial t} = D\frac{\partial^2 c}{\partial x^2} - v\frac{\partial c}{\partial x} + s$$

    ### 3. 有限差分法的思想:用差商替换微商

    泰勒展开:

    $$u(x \pm \Delta x) = u(x) \pm \Delta x\, u_x + \frac{\Delta x^2}{2}u_{xx} \pm \frac{\Delta x^3}{6}u_{xxx} + O(\Delta x^4)$$

    两式相加,中间项抵消:

    $$u_{xx} = \frac{u(x+\Delta x) - 2u(x) + u(x-\Delta x)}{\Delta x^2} + O(\Delta x^2)$$

    即**三点中心差分**是二阶精度的二阶导数近似。时间导数用一阶精度的前差 $u_t \approx \dfrac{u^{n+1} - u^n}{\Delta t}$。

    ### 4. 显式格式(FTCS)与稳定性

    记 $u_i^n \approx u(i\Delta x, n\Delta t)$,代入 $u_t = \alpha u_{xx}$ 得**显式格式**:

    $$u_i^{n+1} = s\,u_{i-1}^n + (1 - 2s)\,u_i^n + s\,u_{i+1}^n,\qquad s = \frac{\alpha\Delta t}{\Delta x^2}$$

    注意 $s$ 是**无量纲数**,它是格式行为的唯一决定参数。稳定性要求(见公式节推导):

    $$0 < s \le \frac{1}{2}$$

    ### 5. 边界条件的三类实现

    - **Dirichlet(第一类)**:边界值已知,如 $u(0,t) = 100$,直接把边界点固定为给定值
    - **Neumann(第二类)**:边界通量已知,如绝热边界 $\dfrac{\partial u}{\partial x}\Big|_{x=0} = 0$,用**虚拟节点** $u_{-1} = u_1$(一阶中心差)或单边差分实现
    - **周期边界**:$u_0 = u_M$,$u_{M+1} = u_1$,适合环形区域(如管道环流)

    ## 🧮 公式与结论

    ### von Neumann 稳定性分析(必会)

    设数值解可分解为傅里叶模态 $u_i^n = g^n e^{ik x_i}$($k$ 为波数,$g$ 为增长因子),代入显式格式:

    $$g = 1 - 2s\big(1 - \cos(k\Delta x)\big) = 1 - 4s\sin^2\frac{k\Delta x}{2}$$

    数值稳定的充要条件是所有模态的增长因子满足 $|g| \le 1$:

    $$-1 \le 1 - 4s\sin^2\frac{k\Delta x}{2} \le 1 \ \Longleftrightarrow\ s \le \frac{1}{2}$$

    这就是显式格式的**CFL 型稳定性条件**:$\Delta t \le \dfrac{\Delta x^2}{2\alpha}$。注意它给出的是「允许的最大时间步长」,不是精度要求。

    ### 隐式格式:无条件稳定

    把空间差分放到新时间层(BTCS 格式):

    $$-s\,u_{i-1}^{n+1} + (1+2s)\,u_i^{n+1} - s\,u_{i+1}^{n+1} = u_i^n$$

    增长因子 $g = \dfrac{1}{1 + 4s\sin^2(k\Delta x/2)}$,恒有 $|g| \le 1$——**无条件稳定**,代价是每个时间步要解一个三对角线性方程组(Thomas 追赶法,$O(n)$ 即可)。

    ### Crank-Nicolson 格式:二阶精度 + 无条件稳定

    $$-\frac{s}{2}u_{i-1}^{n+1} + (1+s)u_i^{n+1} - \frac{s}{2}u_{i+1}^{n+1} = \frac{s}{2}u_{i-1}^n + (1-s)u_i^n + \frac{s}{2}u_{i+1}^n$$

    增长因子 $g = \dfrac{1 - 2s\sin^2(k\Delta x/2)}{1 + 2s\sin^2(k\Delta x/2)}$,模恒为 1,精度 $O(\Delta t^2 + \Delta x^2)$。竞赛论文写「采用 Crank-Nicolson 格式,无条件稳定且二阶收敛」是标准话术。

    ### 二维扩散与稳态问题

    - 二维显式格式稳定性:$s = \alpha\Delta t\left(\dfrac{1}{\Delta x^2} + \dfrac{1}{\Delta y^2}\right) \le \dfrac{1}{2}$;若 $\Delta x = \Delta y = h$,则 $\Delta t \le \dfrac{h^2}{4\alpha}$——比一维再严一倍
    - 稳态方程 $u_{xx} = 0$ 的解析解是**线性分布** $u = ax + b$;而中心差分对线性函数是**精确的**(二阶差分为 0),所以离散稳态解与解析解完全一致——这是验证程序的好测试用例
    - 稳态场可直接迭代(雅可比/Gauss-Seidel)或解大型稀疏线性方程组,不要用显式格式慢慢「熬」到稳态

    ## 💡 经典例题

    ### 例题 1:显式格式手算一步(与解析解对答案)

    > 热方程 $u_t = u_{xx}$($\alpha = 1$),区间 $[0,1]$,初值 $u(x,0) = \sin(\pi x)$,边界 $u(0,t) = u(1,t) = 0$。取 $\Delta x = 0.25$,$s = 0.25$。求 $t = \Delta t$ 时刻内部点的数值解,并与解析解对比。

    **第一步:由 $s$ 反推时间步长**。$s = \dfrac{\alpha\Delta t}{\Delta x^2} \Rightarrow \Delta t = 0.25 \times 0.25^2 = 0.015625$。

    **第二步:手算一个时间步**。内部点 $i = 1, 2, 3$,$u_i^1 = u_i^0 + s(u_{i+1}^0 - 2u_i^0 + u_{i-1}^0)$。

    用和差化积 $\sin(a+b) + \sin(a-b) = 2\sin a \cos b$:

    $$u_i^1 = u_i^0 + 0.25 \times 2u_i^0\big(\cos(\pi\Delta x) - 1\big) = u_i^0\Big[1 + 0.5\big(\cos\frac{\pi}{4} - 1\big)\Big] = 0.85355\,u_i^0$$

    即数值解每一格都衰减到原来的 0.85355 倍。

    **第三步:解析解**。分离变量法:$u(x,t) = e^{-\pi^2 t}\sin(\pi x)$,精确衰减倍数为 $e^{-\pi^2 \times 0.015625} = e^{-0.15421} = 0.85706$。

    **结论**:数值 0.85355 vs 精确 0.85706,相对误差约 0.4%——一步就如此接近,正是格式二阶精度与 $s = 0.25$ 的体现。

    ### 例题 2:稳定性条件决定时间步长

    > 铁棒的热扩散率 $\alpha = 1.17\times 10^{-4}$ m²/s。用显式格式模拟,空间步长取 $\Delta x = 1$ cm,时间步长最大能取多少?若把空间步长加密到 1 mm,时间步长变成多少?

    **计算**:

    $$\Delta t_{\max} = \frac{\Delta x^2}{2\alpha} = \frac{(0.01)^2}{2 \times 1.17\times 10^{-4}} = \frac{10^{-4}}{2.34\times 10^{-4}} = 0.427\ \text{s}$$

    加密到 $\Delta x = 1$ mm:

    $$\Delta t_{\max} = \frac{(0.001)^2}{2 \times 1.17\times 10^{-4}} = \frac{10^{-6}}{2.34\times 10^{-4}} = 0.00427\ \text{s}$$

    **解析**:空间步长缩小到 1/10,允许的时间步长缩小到 1/**100**——总计算量暴涨 1000 倍。这解释了为什么显式格式对细网格如此昂贵,也解释了为什么工程上此时会转向隐式格式或直接求稳态解。**建模口诀:步长减半,$\Delta t$ 减到四分之一,成本乘八**。

    ### 例题 3:稳态温度场——差分与解析解精确吻合

    > 一维杆长 1 m,两端温度固定 $u(0) = 100$℃、$u(1) = 20$℃,无内热源。求稳态温度分布,并说明差分格式为何给出精确结果。

    **解析解**:稳态方程 $u_{xx} = 0$,通解 $u = ax + b$,代入边界条件:

    $$u(x) = 100 - 80x$$

    **差分结果**:对任意网格,稳态离散方程为 $u_{i-1} - 2u_i + u_{i+1} = 0$;而线性函数 $u_i = 100 - 80x_i$ 代入左边恰好恒为 0,且边界点吻合——所以**离散解与解析解在每个格点上完全一致**,误差为零。

    **解析**:这不是巧合:中心差分是二阶近似的本质就是「对二次多项式精确」,对线性函数自然精确。这个例子是检验热传导程序的第一测试用例:程序跑出稳态若与 $100 - 80x$ 不符,一定是代码有 bug,而不是格式误差。

    ## ⚠️ 常见易错点

    1. **忽略稳定性条件导致解爆炸**。取 $s > 1/2$ 时数值解按 $(-1)^n$ 交替振荡并指数发散,画出来像「锯齿噪音」。任何显式差分程序跑之前,先手算 $s$ 并确认 $\le 1/2$
    2. **空间步长减半却忘记时间步长减为 1/4**。网格加密 2 倍,$\Delta t$ 必须缩到 1/4,否则反而从不稳定变到更不稳定
    3. **边界条件类型处理错误**。Neumann 边界(绝热/无通量)不能用 Dirichlet 的「固定值」处理,需要用虚拟节点或单边差分;边界点忘写、写错一格,整张温度分布图都会歪
    4. **用显式格式求稳态**。显式格式走到稳态需要的时间步数正比于 $1/\Delta x^2$,网格稍细就慢到不可接受;求稳态应直接解线性方程组或做 Gauss-Seidel 迭代
    5. **对流占优时中心差分振荡**。对流扩散方程中若对流远强于扩散(Peclet 数大),中心差分会产生非物理振荡,应改用**迎风格式**——这是水质、大气模型里最常见的数值陷阱
    6. **参数单位混乱**。$\alpha$ 的标准单位是 m²/s,时间必须用秒;把「分钟」代入 $\Delta t \le \Delta x^2/(2\alpha)$ 会差 3600 倍

    ## ✏️ 自测练习(选择题)

    **第 1 题** 一维热方程 $u_t = \alpha u_{xx}$ 的显式格式(FTCS),取 $s = \dfrac{\alpha \Delta t}{\Delta x^2}$。关于三种取值的数值行为,下列说法**正确**的是:

    A. $s = 0.25$ 稳定,$s = 0.5$ 临界稳定,$s = 0.6$ 发散——von Neumann 分析给出稳定条件 $s \le 1/2$
    B. $s = 0.25$ 与 $s = 0.6$ 都稳定,只是后者精度略差
    C. $s = 0.6$ 只是精度下降,不会发散
    D. $s = 0.25$ 也不稳定,必须 $s \le 0.1$ 才安全

    <details><summary>查看答案与解析</summary>
    **答案:A**。von Neumann 分析:设模态 $u_i^n = g^n e^{ikx_i}$,代入显式格式得增长因子 $g = 1 - 4s\sin^2\frac{k\Delta x}{2}$。稳定要求所有波数 $|g| \le 1$,最坏情形 $\sin^2 = 1$ 给出 $-1 \le 1 - 4s \Rightarrow s \le \frac{1}{2}$。$s = 0.25$:一切模态 $|g| < 1$,稳定衰减;$s = 0.5$:高频模态 $|g| = 1$,误差不增不减,临界;$s = 0.6$:高频模态 $|g| > 1$,解按 $(-1)^n$ 逐层交替振荡并指数发散(画出来像锯齿噪音)。选项 B/C 把「发散」误判为「精度差」——发散是灾难性的,不是精度问题;选项 D 的 $s \le 0.1$ 没有依据。实际计算建议取 $s = 0.2 \sim 0.4$,留出安全裕度;跑显式程序前先手算 $s$ 并确认 $\le 1/2$。
    </details>

    **第 2 题** 某材料热扩散率 $\alpha = 5\times10^{-5}\ \text{m}^2/\text{s}$,空间步长取 $\Delta x = 0.02\ \text{m}$。用显式格式模拟一维热传导,时间步长最大可取多少?

    A. $4\ \text{s}$:$\Delta t_{\max} = \dfrac{\Delta x^2}{2\alpha} = \dfrac{(0.02)^2}{2\times5\times10^{-5}}$
    B. $8\ \text{s}$:$\Delta t_{\max} = \dfrac{\Delta x^2}{\alpha}$
    C. $200\ \text{s}$:$\Delta t_{\max} = \dfrac{\Delta x}{2\alpha}$
    D. $0.04\ \text{s}$:把 $\Delta x$ 误作 $0.002\ \text{m}$ 计算

    <details><summary>查看答案与解析</summary>
    **答案:A**。由稳定性条件 $s = \frac{\alpha\Delta t}{\Delta x^2} \le \frac{1}{2}$:$\Delta t_{\max} = \frac{\Delta x^2}{2\alpha} = \frac{4\times10^{-4}}{10^{-4}} = 4\ \text{s}$。取 4 s 时 $s = 0.5$ 处于临界,稳妥做法取 2 s($s = 0.25$)。干扰项:选项 B 忘了分母里的 2(稳定条件记成 $s \le 1$);选项 C 把 $\Delta x^2$ 误用成 $\Delta x$(量纲错:秒与米² 必须配平,$\alpha$ 的单位是 $\text{m}^2/\text{s}$);选项 D 是米/厘米单位混乱(0.02 m = 2 cm 误作 2 mm = 0.002 m)的典型翻车。另注意:空间步长减半,允许的 $\Delta t$ 缩小到 $1/4$——加密网格时必须同步收紧时间步长,否则反而发散。
    </details>

    **第 3 题** 二维热方程显式格式,取 $\alpha = 0.1$、$\Delta x = \Delta y = 0.1$。时间步长上限是多少?若退化为同参数的一维问题($\Delta x = 0.1$),上限又是多少?

    A. 二维 $\Delta t \le \dfrac{h^2}{4\alpha} = 0.025$;一维 $\Delta t \le \dfrac{h^2}{2\alpha} = 0.05$——二维上限恰好是一维的一半
    B. 二维 $\Delta t \le 0.05$;一维 $\Delta t \le 0.025$
    C. 二维与一维上限相同,都是 $0.05$
    D. 二维 $\Delta t \le 0.0025$;一维 $\Delta t \le 0.005$

    <details><summary>查看答案与解析</summary>
    **答案:A**。二维稳定性条件为 $s = \alpha\Delta t(\frac{1}{\Delta x^2} + \frac{1}{\Delta y^2}) \le \frac{1}{2}$;$\Delta x = \Delta y = h$ 时 $\Delta t \le \frac{h^2}{4\alpha} = \frac{0.01}{0.4} = 0.025$。一维对应 $\Delta t \le \frac{h^2}{2\alpha} = \frac{0.01}{0.2} = 0.05$,恰好是二维的两倍——**维数越高,显式格式的时间步长限制越严**,这是「维数灾难」在数值求解中的体现。选项 B 把一维与二维对调;选项 C 忽略了第二维的贡献(误以为两个方向共享一个时间步);选项 D 是 $h^2 = 0.01$ 计算错位(把 $0.1^2$ 算成 0.001)。空间步长加密时该限制按平方收紧,显式格式对细网格成本暴涨,工程上此时通常转向隐式格式或直接解稳态方程。
    </details>

    ## 🏆 竞赛实战链接

    - **出镜频率**:凡是「热、扩散、浓度、温度分布」类问题都是 PDE 题。2020 国赛 A「炉温曲线」就是典型——回流焊炉内的温度场用热传导方程描述,再用实测炉温数据反演传热参数;2005 国赛 A「长江水质」用一维对流扩散方程预测污染物浓度沿江分布
    - **论文加分点**:①格式推导要写出**局部截断误差的阶**(如 $O(\Delta t + \Delta x^2)$);②**von Neumann 稳定性证明**是理工科评委的必看内容;③做**网格加密收敛性验证**($\Delta x$ 减半误差降为 1/4 即二阶);④数值解与解析解(正弦初值、稳态线性分布)对比图;⑤参数反演用最小二乘,参见《极大似然估计(MLE)》单元
    - **工具**:纯 `numpy` 即可;三对角方程组用 `scipy.linalg.solve_banded`;二维画图 `matplotlib` 的 `contourf`

    ## 💻 代码实现

    ```python
    import numpy as np
    import matplotlib.pyplot as plt

    alpha, L, nx = 1.0, 1.0, 40
    dx = L / nx
    x = np.linspace(0, L, nx + 1)


    def heat_explicit(s, nsteps, label):
        dt = s * dx**2 / alpha
        u = np.sin(np.pi * x)  # 初值(满足 Dirichlet 边界)
        for n in range(nsteps):
            un = u.copy()
            un[1:-1] = s * u[:-2] + (1 - 2 * s) * u[1:-1] + s * u[2:]
            u = un
        print(f"{label}: s={s}, dt={dt:.5f}, max|u|={np.abs(u).max():.4f}")
        return u


    # 稳定情形 s=0.25,与解析解对比
    nsteps = 500
    u_ok = heat_explicit(0.25, nsteps, "稳定")
    t_end = nsteps * 0.25 * dx**2 / alpha
    u_exact = np.exp(-(np.pi**2) * t_end) * np.sin(np.pi * x)
    print("与解析解的最大误差:", np.max(np.abs(u_ok - u_exact)))

    # 不稳定情形 s=0.6,解发散
    u_bad = heat_explicit(0.6, 100, "不稳定(应发散)")

    plt.plot(x, u_ok, "o", label="s=0.25 数值解")
    plt.plot(x, u_exact, "-", label="解析解")
    plt.legend()
    plt.title("一维热传导显式格式")
    plt.show()
    ```

