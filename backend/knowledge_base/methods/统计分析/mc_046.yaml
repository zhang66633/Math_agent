method_card:
  id: mc_046
  name: 系统聚类法
  name_en: Hierarchical Clustering
  category:
  - 统计
  - 机器学习
  - 统计分析
  principle: 系统聚类法是一种将样本点逐步合并为类的聚类分析方法。其基本思想是：首先将每个样本点视为一个单独的类，然后计算各类之间的距离，将距离最近的两类合并为一个新类，并重新计算新类与当前各类之间的距离，重复此过程直到所有样本点合并为一类。最终结果可以用聚类图（树状图）展示，从而得到从粗到细的多层次分类结构。类间距离的定义方式有多种，如最短距离法、最长距离法、重心法、类平均法和离差平方和法等，不同的距离定义会导致不同的聚类结果。
  formulas:
  - name: 绝对值距离
    latex: $$d_1(x,y) = \sum_{k=1}^{p} |x_k - y_k|$$
    description: Minkowski距离在q=1时的特例，适用于量纲相同的变量。
  - name: 欧氏距离
    latex: $$d_2(x,y) = \left[ \sum_{k=1}^{p} (x_k - y_k)^2 \right]^{\frac{1}{2}}$$
    description: Minkowski距离在q=2时的特例，最常用的距离，对正交旋转保持不变。
  - name: Chebyshev距离
    latex: $$d_\infty(x,y) = \max_{1 \leq k \leq p} |x_k - y_k|$$
    description: Minkowski距离在q→∞时的极限形式。
  - name: 马氏距离
    latex: $$d(x,y) = \sqrt{(x-y)^T \Sigma^{-1} (x-y)}$$
    description: 改进的Minkowski距离，对一切线性变换不变，不受量纲影响，其中Σ为总体协方差矩阵。
  - name: 最短距离法
    latex: $$D(G_1,G_2) = \min_{x_i \in G_1, y_j \in G_2} d(x_i, y_j)$$
    description: 两个类中最近两点间的距离作为类间距离。
  - name: 最长距离法
    latex: $$D(G_1,G_2) = \max_{x_i \in G_1, y_j \in G_2} d(x_i, y_j)$$
    description: 两个类中最远两点间的距离作为类间距离。
  - name: 重心法
    latex: $$D(G_1,G_2) = d(\bar{x}, \bar{y})$$
    description: 两个类重心之间的距离作为类间距离。
  - name: 类平均法
    latex: $$D(G_1,G_2) = \frac{1}{n_1 n_2} \sum_{x_i \in G_1} \sum_{x_j \in G_2}
      d(x_i, x_j)$$
    description: 两个类中所有样本点两两距离的平均值作为类间距离。
  - name: 离差平方和法（Ward方法）
    latex: $$D(G_1,G_2) = D_{12} - D_1 - D_2$$
    description: 基于类内离差平方和之和与合并后总离差平方和的差值定义类间距离。
  applicable_when:
  - 样本点可以用多个定量变量描述
  - 需要从粗到细的多层次分类结果
  - 样本量适中（通常不超过几百个）
  - 变量量纲相同或已进行标准化处理
  not_applicable_when:
  - 变量量纲差异悬殊且未进行标准化处理
  - 变量之间存在严重的多重相关性（多重共线性）
  - 样本量极大（如数万以上），计算量过大
  - 需要明确的分类数目而非层次结构
  typical_scenarios:
  - 市场细分：根据消费者特征将市场划分为不同细分市场
  - 生物学分类：根据生物特征对物种进行分类
  - 客户分群：根据客户行为数据对客户进行分组
  - 销售业绩评估：根据销售指标对销售人员进行分类评价
  common_mistakes:
  - mistake: 使用不同量纲的变量直接计算Minkowski距离，导致量纲大的变量主导距离计算
    solution: 在计算距离前先对数据进行标准化处理（如Z-score标准化）
  - mistake: 忽视变量间的多重相关性，导致某些变量的重要性被过度强调
    solution: 使用马氏距离替代Minkowski距离，或先进行主成分分析降维
  - mistake: 将聚类结果中的类间距离直接解释为实际物理距离的倍数
    solution: 聚类图中的距离是相对度量，应关注分类结构而非绝对数值
  code_snippets:
  - language: matlab
    description: 使用MATLAB统计工具箱进行系统聚类分析（以销售员业绩数据为例）
    code: 'clc,clear

      a=[1,0;1,1;3,2;4,3;2,5];

      y=pdist(a,''cityblock'');  % 计算绝对值距离

      zc=squareform(y)       % 转换为距离方阵

      z=linkage(y)           % 使用最短距离法进行系统聚类

      [h,t]=dendrogram(z)    % 绘制聚类图'
  related_cards: []
  related_papers: []
  difficulty: 3
  quality_rating: 4
