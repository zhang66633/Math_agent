  formulas:
  - V \approx W H，其中 V \in \mathbb{R}^{n \times m} 为非负数据矩阵，W \in \mathbb{R}^{n \times r} 为基矩阵，H \in \mathbb{R}^{r
    \times m} 为系数矩阵，r 为分解秩且 r < \min(n, m)。
  - W_{ij} \geq 0, \quad H_{ij} \geq 0，非负约束条件。
  - \|V - WH\|_F^2 = \sum_{i,j} (V_{ij} - (WH)_{ij})^2，Frobenius范数损失函数。
  - D_{KL}(V \| WH) = \sum_{i,j} \left( V_{ij} \log\frac{V_{ij}}{(WH)_{ij}} - V_{ij} + (WH)_{ij} \right)，KL散度损失函数。
  - H_{kj} \leftarrow H_{kj} \frac{(W^T V)_{kj}}{(W^T W H)_{kj} + \epsilon}, \quad W_{ik} \leftarrow W_{ik}
    \frac{(V H^T)_{ik}}{(W H H^T)_{ik} + \epsilon}，乘法更新规则，\epsilon 为防止除零的小正数。
