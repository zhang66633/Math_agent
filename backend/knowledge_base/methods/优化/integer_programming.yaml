  unit_id: modeler_ip_01
  content_md: |
    # 整数规划与分支定界

    > **难度**:入门 · **预计学习时长**:45 分钟 · **主讲智能体**:🧩 建模手 · **方法类别**:优化

    ## 🎯 学习目标

    前置单元:《线性规划与单纯形法》。学完本单元,你应该能够:

    - 说出整数规划的分类,以及它为什么比 LP 难得多
    - 理解 LP 松弛的上下界含义,并完整手工执行一次分支定界
    - 看懂割平面法的基本思想,会从单纯形表推导一个 Gomory 割
    - 用 0-1 变量和大 M 写出「固定费用」「如果…则…」等逻辑约束
    - 判断哪些问题可以放心用 LP 直接解(全幺模矩阵)

    ## 📖 核心概念

    ### 1. 什么是整数规划(Integer Programming, IP)

    当 LP 的决策变量(全部或部分)被要求取整数时,就是整数规划:

    | 类型 | 定义 | 典型场景 |
    |------|------|----------|
    | 纯整数规划 (IP) | 所有变量为整数 | 生产件数、车辆数 |
    | 混合整数规划 (MIP) | 部分变量整数 | 整数批量 + 连续原料 |
    | 0-1 规划 (BIP) | 变量只能取 0/1 | 选址、指派、项目选择 |

    ### 2. 为什么 IP 远比 LP 难

    LP 可行域是凸多面体,最优解在顶点,单纯形法多项式时间可解。IP 的可行域是**离散点集(非凸)**,没有「顶点最优」这类结构可用。从计算复杂度看,IP 是 **NP-hard**——问题规模稍大,枚举就不现实。规模感:10 个 0-1 变量有 $2^{10}=1024$ 种组合,30 个就是 $2^{30} \approx 10^9$ 种,枚举法瞬间失效。因此竞赛中「整数规划 = 直接枚举」是最常见的错误思路,正确做法是**分支定界 + 现代求解器**。

    ### 3. LP 松弛:IP 求解的起点

    把整数约束去掉得到的 LP 称为**松弛问题**。松弛问题与 IP 目标值的关系(务必记牢方向):

    - **max 问题**:$z_{IP} \leq z_{LP}$ —— 松弛值给出**上界**
    - **min 问题**:$z_{IP} \geq z_{LP}$ —— 松弛值给出**下界**

    松弛解恰好全是整数,它就是 IP 最优解;否则它只提供「界」,需要继续分支。

    ### 4. 分支定界(Branch and Bound)

    核心流程:

    1. **定界**:解松弛 LP,得界(如 max 问题上界 $U$)
    2. **分支**:选一个取分数值 $v$ 的整数变量 $x_j$,分成 $x_j \leq \lfloor v \rfloor$ 与 $x_j \geq \lceil v \rceil$ 两个子问题
    3. **剪枝**:子问题出现三种情况之一就停止——①松弛解已是整数(更新最优候选);②松弛界已不优于当前最优候选;③子问题不可行
    4. 重复直到所有分支被剪掉

    ### 5. 割平面(Cutting Plane)的思想

    不分支,而是**加一条线性约束**把分数松弛最优解「切掉」,同时保留全部整数可行解。反复加割直到松弛解变为整数。Gomory 割是最经典的构造:从最优单纯形表的一个基变量行,按「整数部分 + 小数部分」分解系数即得。

    ## 🧮 公式与结论

    ### 分支定界的界

    设当前最优整数可行解目标值为 $z_{\text{best}}$(max 问题),某节点的松弛上界为 $U$:

    $$U \leq z_{\text{best}} \Rightarrow \text{该分支剪掉}$$

    ### Gomory 割的构造

    设最优单纯形表中基变量行 $x_i + \sum_{j} \bar{a}_{ij} x_j = \bar{b}_i$,其中 $x_j$ 为非基变量。记 $\bar{a}_{ij} = \lfloor \bar{a}_{ij} \rfloor + f_{ij}$,$\bar{b}_i = \lfloor \bar{b}_i \rfloor + f_i$($0 \leq f < 1$ 为小数部分),则:

    $$\sum_{j} f_{ij}\, x_j \geq f_i$$

    是一条有效割(切掉当前分数解,保留所有整数可行解)。

    ### 全幺模矩阵:不用 BB 的「免检通道」

    若约束矩阵 $A$ 全幺模(任何子方阵行列式为 $0, \pm 1$)且 $b$ 整数,则 LP 松弛的**每个顶点都是整数点**。**运输问题、指派问题、网络流问题**的约束矩阵都是全幺模的——这就是为什么运输问题 LP 解出来自动是整数(参见《线性规划建模实战》单元)。

    ## 💡 经典例题

    ### 例题 1:分支定界全程手算

    > 求解 $\max z = 5x_1 + 8x_2$,s.t. $x_1 + x_2 \leq 6,\ 5x_1 + 9x_2 \leq 45,\ x_1, x_2 \geq 0$ 且为整数。

    **根节点(松弛 LP)**:可行域顶点 (6,0)、(0,5)、两条约束交点。联立 $x_1+x_2=6$ 与 $5x_1+9x_2=45$ 得 $x_1=2.25,\ x_2=3.75$,$z = 11.25+30 = 41.25$。$x_1, x_2$ 都取分数,上界 $U = 41.25$。

    **分支 1:对 $x_1$ 分支**($x_1 \leq 2$ 与 $x_1 \geq 3$):

    - 节点 ①($x_1 \leq 2$):松弛最优 $(2,\ 35/9)$,$U_1 = 10 + 8 \times 35/9 = 41.11$,分数,继续
    - 节点 ②($x_1 \geq 3$):松弛最优 $(3,\ 10/3)$,$U_2 = 15 + 80/3 = 41.67$,分数,继续(选界大的先分)

    **分支 2:节点 ② 对 $x_2$ 分支**:

    - 节点 ③($x_2 \leq 3$):松弛解 $(3, 3)$,整数!$z = 39$ → 当前最优候选 $z_{\text{best}} = 39$
    - 节点 ④($x_2 \geq 4$):$x_1 \geq 3, x_2 \geq 4 \Rightarrow x_1+x_2 \geq 7 > 6$,不可行,剪枝

    **分支 3:回到节点 ①**($U_1 = 41.11 > 39$,不能剪),对 $x_2$ 分支:

    - 节点 ⑤($x_2 \leq 3$):整数点中最好的是 $(2, 3)$,$z = 34 < 39$,剪枝
    - 节点 ⑥($x_2 \geq 4$):松弛最优 $(1.8,\ 4)$,$U_6 = 9 + 32 = 41 > 39$,继续

    **分支 4:节点 ⑥ 对 $x_1$ 分支**:

    - 节点 ⑦($x_1 \leq 1$):松弛最优 $(1,\ 40/9)$,$U_7 = 40.56$,继续 → 对 $x_2$ 分支:$x_2 \leq 4$ 得 $(1,4)$,$z = 37$,剪枝;$x_2 \geq 5$ 得 $(0,5)$:$0+5=6 \leq 6$, $0+45=45 \leq 45$,可行!$z = 40 > 39$ → **更新 $z_{\text{best}} = 40$**
    - 节点 ⑧($x_1 \geq 2$):$x_1 = 2, x_2 \geq 4 \Rightarrow 10 + 9x_2 \leq 45 \Rightarrow x_2 \leq 35/9 < 4$,与 $x_2 \geq 4$ 矛盾,不可行,剪枝

    **全部节点关闭,最优解 $(0, 5)$,$z^* = 40$。**

    **解析**:本例最值得记住的一点——**IP 最优解不一定在 LP 最优解附近**。松弛解 $(2.25, 3.75)$ 四舍五入得到 $(2,4)$ 根本不可行;就近的整数点 $(3,3)$、$(2,3)$ 也都不最优,真正的答案是远在另一角的 $(0,5)$。这正说明「先松弛再取整」不可靠,必须走分支定界或直接交给求解器。

    ### 例题 2:固定费用问题(大 M 建模)

    > 某厂可生产 A、B 两种产品:每件利润分别为 4、6 万元;开工 A 需一次性启动费 5 万元,B 需 8 万元;共用资源约束 $x_1 + 2x_2 \leq 8$。求利润最大的生产方案。

    **建模**:引入 0-1 变量 $y_1, y_2$ 表示「是否开工」,用大 M 连接:

    $$\max z = 4x_1 + 6x_2 - 5y_1 - 8y_2 \quad \text{s.t.} \quad x_1 + 2x_2 \leq 8,\ x_1 \leq 8y_1,\ x_2 \leq 4y_2,\ x \geq 0,\ y \in \{0,1\}$$

    **求解**:枚举四种 $y$ 组合:都不开 → $z=0$;只开 A → $x_1=8$,$z = 32-5 = 27$;只开 B → $x_2=4$,$z = 24-8 = 16$;都开 → $z = 4x_1+6x_2-13$ 在 $x_1+2x_2 \leq 8$ 下最大为 $32-13 = 19$。最优:**只开 A,生产 8 件,利润 27 万元**。

    **解析**:大 M 的取值要「紧」:这里 $M_1 = 8$($x_1$ 的最大可能值)、$M_2 = 4$,取最小有效值即可;M 过大(如 $10^6$)会造成数值病态、求解变慢。固定费用改变了问题的本质——若不考虑启动费,LP 说生产 8 件 A 赚 32;加入启动费后仍是只开 A,但若启动费变成 13,答案就变成「A、B 都开」,这类结构变化 LP 永远算不出来。

    ### 例题 3:Gomory 割平面

    > 对例题 1 的根节点松弛最优解构造 Gomory 割。

    **推导**:引入松弛变量 $x_3, x_4$:$5x_1+9x_2+x_3 = 45$,$x_1+x_2+x_4 = 6$。消元得基变量行:

    $$x_1 = 2.25 + 0.25x_3 - 2.25x_4$$

    对整数解,右端必须为整数,而小数部分 $0.25 - 0.25x_3 - 0.75x_4$(注意 $-2.25$ 的小数部分是 $0.75$)必须 $\leq 0$:

    $$0.25 - 0.25x_3 - 0.75x_4 \leq 0 \Rightarrow x_3 + 3x_4 \geq 1$$

    代回原变量:$x_3 = 45-5x_1-9x_2,\ x_4 = 6-x_1-x_2$,得 $4x_1 + 6x_2 \leq 31$。左端恒为偶数,整数解下等价于 **$2x_1 + 3x_2 \leq 15$**。

    **验证与再求解**:当前松弛解 $(2.25, 3.75)$:$4.5 + 11.25 = 15.75 > 15$,被切掉 ✓;整数点 $(0,5)$:$0+15=15 \leq 15$,保留 ✓。加割后重解 LP:联立 $2x_1+3x_2=15$ 与 $5x_1+9x_2=45$ 得 $x_1 = 0,\ x_2 = 5$——**恰好是整数最优解**,$z^* = 40$,一轮割平面直接求解完成(现实问题通常需要多轮割)。

    ## ⚠️ 常见易错点

    1. **「松弛 + 四舍五入」当答案**。松弛解取整可能不可行(例题 1 的 $(2,4)$),也可能远离最优;只有全幺模问题才能这么做
    2. **界的方向写反**。max 问题中松弛值是**上界**、整数可行解是**下界**;剪枝判据用反了会把最优解剪掉
    3. **分支后子问题漏加祖先约束**。节点 ⑥ 的子问题必须同时带 $x_1 \leq 2$ 和 $x_2 \geq 4$;漏一个,界就失真
    4. **大 M 取值随意**。M 太小会截掉可行解,M 太大引发数值问题;取「变量能达到的最大值」即可,并避免 $10^6$ 级的大数
    5. **逻辑约束忘了「双向」连接**。$x \leq My$ 只保证「生产则必须开工」;还要 $y \leq x$(或等价处理)保证「开工则必须生产」,否则模型会白付启动费
    6. **把割平面理解成「随便加条切掉分数解的线」**。割必须保留全部整数可行解;不满足这条的约束会让答案直接变错

    ## ✏️ 自测练习(选择题)

    **第 1 题**某最大化整数规划(IP),其 LP 松弛的最优值为 41.25,已找到一个整数可行解的目标值为 39。关于 IP 最优值 $z_{IP}$,下列说法**正确**的是:

    A. $z_{IP} \leq 39$,因为整数解不可能超过已有的可行解
    B. $39 \leq z_{IP} \leq 41.25$
    C. $z_{IP} \geq 41.25$,因为整数约束会扩大可行域
    D. 无法得出任何结论

    <details><summary>查看答案与解析</summary>
    **答案:B**。max 问题中松弛可行域更大,松弛最优值是**上界**:$z_{IP} \leq 41.25$;整数可行解本身是 IP 可行解,给出**下界**:$z_{IP} \geq 39$。两者夹出区间 $[39, 41.25]$——这正是分支定界的定界依据,也是论文里写 gap 的来源。「$z_{IP} \leq 39$」「$z_{IP} \geq 41.25$」都是把上下界方向写反的典型错误;界的方向写反,剪枝判据就会把最优解剪掉。
    </details>

    **第 2 题**用分支定界求解 $\max z = 3x_1 + 2x_2$,s.t. $2x_1 + 3x_2 \leq 14,\ 2x_1 + x_2 \leq 9,\ x_1,x_2 \geq 0$ 且为整数。最优解与最优值为:

    A. $x_1 = 3,\ x_2 = 3,\ z = 15$
    B. $z = 14.75$(即 LP 松弛最优值)
    C. $x_1 = 4,\ x_2 = 1,\ z = 14$
    D. $x_1 = 3,\ x_2 = 2,\ z = 13$

    <details><summary>查看答案与解析</summary>
    **答案:C**。LP 松弛最优解为 $(3.25, 2.5)$,$z = 14.75$——两个分量都是分数,必须分支。分支定界后最优整数解是 $(4,1)$,$z = 12 + 2 = 14$。$(3,2)$ 是「松弛解四舍五入」的结果,可行但不是最优($z=13$);$(3,3)$ 违反 $2x_1+3x_2 = 15 > 14$,不可行——取整产生的解可能根本不可行;$14.75$ 是松弛上界,不是整数可行解,不能当答案。「松弛 + 取整」不可靠,必须走分支定界或直接交给求解器。
    </details>

    **第 3 题**为什么运输问题(供应、需求均为整数)不需要分支定界,直接用 LP 求解就能得到整数最优解?

    A. 因为运输问题规模通常很小,枚举即可
    B. 因为先解 LP 再四舍五入不会改变可行性
    C. 因为其约束矩阵全幺模,LP 松弛的每个顶点都是整数点
    D. 因为运输问题的目标系数都是整数

    <details><summary>查看答案与解析</summary>
    **答案:C**。运输问题约束矩阵的元素只有 0/1,且每列恰有两个 1,这类矩阵**全幺模**:任何子方阵行列式为 $0, \pm 1$,当右端项为整数时,LP 松弛的每个基解自动为整数。于是 LP 最优解就是整数最优解,直接调用 linprog 即可。「枚举」只适用于变量极少的玩具题,运输问题的变量是 $mn$ 量级;「四舍五入」对一般 LP 既不保证可行也不保证最优(见上一题);目标系数为整数与顶点是否整数无关。指派问题、网络流问题同样全幺模,识别出它,IP 就退化成了 LP。
    </details>

    ## 🏆 竞赛实战链接

    - **出镜频率**:0-1 规划是国赛 B 题常客:2011 国赛 B「交巡警平台」的选址覆盖与警力指派、2013 国赛 B「碎纸片拼接」的拼接顺序优化、2018 国赛 B「RGV 动态调度」的 0-1 时间窗模型,本质都是 IP/MIP
    - **论文加分点**:①写出「LP 松弛 → 上下界 → 分支定界/割平面 → 最优性证明」的完整链条,而不是「用软件一解了事」;②大 M 的取值说明(取多少、为什么够用);③给出求解时间与 gap,说明规模可行性
    - **工具**:小规模用 `scipy.optimize.milp`;中等规模用 `pulp`(免费 CBC 求解器);组合约束多时用 `ortools` 的 CP-SAT;Gurobi/COPT 学术版适合大规模
    - **实战纪律**:先解松弛看界——若 gap 已经很小,论文里可直接说「LP 松弛几乎紧」,这本身就是有价值的结论

    ## 💻 代码实现

    ```python
    import numpy as np
    from scipy.optimize import linprog, milp, Bounds, LinearConstraint

    # 例 1:max 5x1+8x2  s.t. x1+x2<=6, 5x1+9x2<=45, 变量非负整数
    c = [-5, -8]
    A = [[1, 1], [5, 9]]
    b = [6, 45]

    r = linprog(c, A_ub=A, b_ub=b, method="highs")
    print("LP 松弛:", r.x, -r.fun)  # [2.25 3.75] 41.25

    res = milp(
        c=c,
        integrality=np.array([1, 1]),
        bounds=Bounds([0, 0], [np.inf, np.inf]),
        constraints=LinearConstraint(np.array(A), -np.inf, b),
    )
    print("整数最优:", res.x, -res.fun)  # [0. 5.] 40.0

    # 手写分支定界(教学版,max 问题)
    best_x, best_z = None, -np.inf


    def bb(cvec, A_, b_, fixed):
        """fixed: 已固定变量的字典 {下标: 值}; 递归分支定界"""
        global best_x, best_z
        lo = np.zeros(2)
        hi = np.full(2, np.inf)
        for j, v in fixed.items():
            lo[j] = hi[j] = v
        r = linprog(-np.array(cvec), A_ub=A_, b_ub=b_, bounds=list(zip(lo, hi)), method="highs")
        if not r.success or -r.fun <= best_z:  # 上界不优于当前最优 → 剪枝
            return
        x = r.x
        if np.all(np.abs(x - np.round(x)) < 1e-6):  # 整数可行 → 更新最优
            best_x, best_z = x.copy(), -r.fun
            return
        j = int(np.argmax(np.abs(x - np.round(x))))  # 选离整数最远的变量分支
        bb(cvec, A_, b_, {**fixed, j: np.floor(x[j])})
        bb(cvec, A_, b_, {**fixed, j: np.ceil(x[j])})


    bb([5, 8], A, b, {})
    print(best_x, best_z)  # [0. 5.] 40.0
    ```

    > 教学版 BB 只适合小问题;正式比赛直接用 `milp`(底层 HiGHS 的分支定界远比手写版高效)。

    ## 📚 延伸阅读

    - **教材**:胡运权《运筹学基础及应用》第 6 章(整数规划)— 分支定界与割平面的手算范例
    - **经典书**:Wolsey, *Integer Programming* — 想深入理解 MIP 理论再读
    - **实战**:scipy [milp 文档](https://docs.scipy.org/doc/scipy/reference/generated/scipy.optimize.milp.html);PuLP 官方教程([Coin-or PuLP](https://coin-or.github.io/pulp/))
    - **进阶关联**:0-1 变量建模细节 → 《0-1规划与指派问题》单元;多阶段离散决策 → 《动态规划与最优子结构》单元;规模太大时 → 《遗传算法原理与应用》《蚁群算法与组合优化》单元

    ## 🧠 小结

    1. IP 分类:纯整数、混合整数、0-1;难在可行域非凸、问题 NP-hard,「枚举」只适用于变量极少的玩具题
    2. LP 松弛是 IP 的门槛:max 给上界、min 给下界;松弛解整数 → 直接最优
    3. 分支定界 = 松弛定界 + 按分数变量分支 + 三种剪枝;手推一棵小树,胜过背十遍流程
    4. 割平面:从基变量行的小数部分构造 Gomory 割,切分数解、留整数解,可反复加割
    5. 全幺模矩阵(运输、指派、网络流)是「免检通道」——识别出它,IP 就退化成了 LP
