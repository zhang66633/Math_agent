      p2=[1.14,1.82;1.18,1.96;1.20,1.86;1.26,2.00 \n   1.28,2.00;1.30,1.96];\np=[p1;p2]';\n\
      pr=minmax(p);\ngoal=[ones(1,9),zeros(1,6);zeros(1,9),ones(1,6)];\nplot(p1(:,1),p1(:,2),'h',p2(:,1),p2(:,2),'o')\n\
