method_card:
  name: 孤立森林
  name_en: Isolation Forest
  category:
  - 机器学习
  principle: '孤立森林是一种异常检测算法，通过随机分割特征空间来隔离数据点，异常点更容易被隔离（需要更少的分割步骤）。


    #### 8.1 基本原理


    **核心思想**：

    - 异常点是少数且不同的

    - 异常点更容易被孤立

    - 使用路径长度衡量异常程度


    **孤立树（iTree）构建**：


    1. 随机选择特征和分割值

    2. 递归分割数据空间

    3. 直到：所有数据点被孤立 或 达到最大深度


    **路径长度**：

    $$

    h(x) = \sum_{i=1}^{\text{path}} \Delta i + C(\psi)

    $$


    其中$\Delta i$是节点到子节点的路径长度，$C(\psi)$是调整项。


    #### 8.2 异常得分


    **归一化路径长度**：

    $$

    H(x) = h(x) / c(\psi)

    $$


    其中$c(\psi) = 2H(\psi - 1) - (2(\psi - 1)/\psi)$是调整路径长度，$\psi$是样本数。


    **异常得分**：

    $$

    s(x, \psi) = 2^{-\frac{E[H(x)]}{c(\psi)}}

    $$


    **得分解释**：

    - $s \approx 1$：异常点

    - $s < 0.5$：正常点

    - $s \approx 0.5$：无异常


    #### 8.3 算法特点


    **优点**：

    - 无需假设数据分布

    - 线性时间复杂度

    - 内存效率高

    - 可处理高维数据


    **参数**：

    - `n_estimators`：树的数量

    - `max_samples`：每棵树的样本数

    - `contamination`：异常比例


    #### 8.4 使用条件与常见坑


    | 条件/坑 | 说明 | 应对 |

    |---------|------|------|

    | contamination 需先验 | 异常比例假设影响阈值 | 无先验时用 0.1 起调，结合得分分布定阈值 |

    | 高维效果下降 | 维度极高时路径长度区分度降低 | 先 PCA（05 §4）降维 |

    | 不适合密集簇数据 | 正常点也聚集时误报多 | 正常点聚集时考虑 LOF/密度方法 |

    | 异常标签语义 | predict 返回 1/-1，score_samples 越大越异常 | 转 0/1 统一口径 |'
  applicable_when:
  - 数据中异常点数量远少于正常点，且异常点与正常点差异明显
  - 无需假设数据服从特定分布，适合非高斯或未知分布数据
  - 数据维度较高但异常点仍可被随机分割隔离
  - 样本量较大，需要线性时间复杂度或内存效率较高的方法
  - 正常点不呈现密集簇状分布，异常点相对孤立
  typical_scenarios:
  - 网络入侵检测中识别少量异常流量
  - 金融交易中检测欺诈或异常交易行为
  - 工业设备监控中识别异常运行状态
  - 高维数据中快速筛选离群点
  - 无标签数据中探索潜在异常样本
  code_snippets:
  - language: python
    description: 孤立森林 实现要点
    code: "import numpy as np\nimport matplotlib.pyplot as plt\nfrom sklearn.ensemble import IsolationForest\n\
      from sklearn.metrics import classification_report, roc_auc_score, roc_curve\n\ndef isolation_forest_anomaly_detection(X,\
      \ contamination=0.1, random_state=42):\n    \"\"\"\n    孤立森林异常检测\n    :param X: 特征矩阵\n    :param\
      \ contamination: 异常比例\n    :return: 模型, 异常标签, 异常得分\n    \"\"\"\n    iso_forest = IsolationForest(\n\
      \        n_estimators=100,\n        max_samples='auto',\n        contamination=contamination,\n\
      \        random_state=random_state,\n        n_jobs=-1\n    )\n\n    iso_forest.fit(X)\n\n    #\
      \ 预测：-1表示异常，1表示正常\n    labels = iso_forest.predict(X)\n\n    # 计算异常得分（越大越异常）\n    scores = iso_forest.score_samples(X)\n\
      \    anomaly_scores = -scores\n\n    return iso_forest, labels, anomaly_scores\n\ndef plot_anomaly_scores(X,\
      \ anomaly_scores, labels, feature_names=None):\n    \"\"\"\n    绘制异常得分可视化\n    :param X: 特征矩阵\n\
      \    :param anomaly_scores: 异常得分\n    :param labels: 异常标签\n    :param feature_names: 特征名称\n    \"\
      \"\"\n    if X.shape[1] < 2:\n        print(\"Need at least 2 features for visualization\")\n  \
      \      return\n\n    fig, axes = plt.subplots(1, 2, figsize=(14, 6))\n\n    # 散点图（使用前两个特征）\n   \
      \ normal_mask = labels == 1\n    anomaly_mask = labels == -1\n\n    axes[0].scatter(X[normal_mask,\
      \ 0], X[normal_mask, 1],\n                   c='blue', label='Normal', alpha=0.5)\n    axes[0].scatter(X[anomaly_mask,\
      \ 0], X[anomaly_mask, 1],\n                   c='red', label='Anomaly', alpha=0.8)\n    axes[0].set_xlabel(feature_names[0]\
      \ if feature_names else 'Feature 1')\n    axes[0].set_ylabel(feature_names[1] if feature_names else\
      \ 'Feature 2')\n    axes[0].set_title('Anomaly Detection Results')\n    axes[0].legend()\n\n   \
      \ # 异常得分分布\n    axes[1].hist(anomaly_scores[normal_mask], bins=50, alpha=0.5,\n                label='Normal',\
      \ color='blue')\n    axes[1].hist(anomaly_scores[anomaly_mask], bins=50, alpha=0.5,\n          \
      \      label='Anomaly', color='red')\n    axes[1].set_xlabel('Anomaly Score')\n    axes[1].set_ylabel('Frequency')\n\
      \    axes[1].set_title('Anomaly Score Distribution')\n    axes[1].legend()\n    plt.tight_layout()\n\
      \    plt.show()\n\ndef evaluate_anomaly_detection(y_true, y_pred, scores):\n    \"\"\"\n    评估异常检测性能\n\
      \    :param y_true: 真实标签（1正常，-1异常）\n    :param y_pred: 预测标签\n    :param scores: 异常得分\n    :return:\
      \ 分类报告, AUC\n    \"\"\"\n    # 转换标签为0/1格式\n    y_true_binary = (y_true == -1).astype(int)\n    y_pred_binary\
      \ = (y_pred == -1).astype(int)\n\n    print(\"Classification Report:\")\n    print(classification_report(y_true_binary,\
      \ y_pred_binary,\n                "
