method_card:
  name: 变异系数法
  name_en: Coefficient of Variation Method
  category:
  - 评价
  principle: '变异系数法是一种客观赋权方法，根据各指标的变异程度确定权重。变异程度越大，说明该指标区分能力越强，权重越大。


    #### 7.1 数据标准化


    **标准化**：

    $$

    r_{ij} = \frac{x_{ij} - \bar{x}_j}{s_j}

    $$


    其中$\bar{x}_j$和$s_j$分别是指标$j$的均值和标准差。


    #### 7.2 计算变异系数


    $$

    CV_j = \frac{s_j}{|\bar{x}_j|}

    $$


    为避免均值接近0的情况，可使用：

    $$

    CV_j = \frac{s_j}{\bar{x}_j + \varepsilon}

    $$


    其中$\varepsilon$是一个小正数。


    #### 7.3 计算权重


    $$

    w_j = \frac{CV_j}{\sum_{k=1}^{n} CV_k}

    $$'
  applicable_when:
  - 数据为数值型指标矩阵，样本量与指标数足以计算均值和标准差。
  - 各指标量纲或数量级不一致，需要先标准化或直接基于变异系数赋权。
  - 指标均值不为零或接近零，或已采用小正数修正避免分母为零。
  - 指标间不需要预先设定主观重要性，权重应完全由数据变异程度决定。
  - 各指标方向一致或已做正向化处理，避免正负向指标混合导致权重解释困难。
  typical_scenarios:
  - 多指标综合评价中需要客观确定各指标权重时使用。
  - 各指标量纲不同、数量级差异较大，需要消除量纲影响后赋权时使用。
  - 指标数据完整且可获得均值与标准差，适合用变异程度反映区分能力时使用。
  - 希望避免主观赋权偏差，采用数据驱动方式确定权重时使用。
  - 评价对象在多个指标上差异明显，需要突出区分能力强的指标时使用。
  code_snippets:
  - language: python
    description: 变异系数法 实现要点
    code: "import numpy as np\n\ndef coefficient_of_variation_weight(data):\n    \"\"\"\n    变异系数法计算权重\n\
      \    :param data: 数据矩阵 (样本×指标)\n    :return: 权重向量, 变异系数\n    \"\"\"\n    data = np.array(data, dtype=float)\n\
      \    m, n = data.shape\n\n    # 计算均值和标准差\n    means = data.mean(axis=0)\n    stds = data.std(axis=0,\
      \ ddof=1)\n\n    # 计算变异系数\n    cvs = stds / np.abs(means)\n    cvs[np.isnan(cvs)] = 0  # 处理均值为0的情况\n\
      \n    # 计算权重\n    weights = cvs / cvs.sum()\n\n    return weights, cvs\n\ndef cv_evaluation(data):\n\
      \    \"\"\"\n    变异系数法综合评价\n    :param data: 数据矩阵 (样本×指标)\n    :return: 各样本综合得分\n    \"\"\"\n  \
      \  weights, _ = coefficient_of_variation_weight(data)\n\n    # 数据标准化\n    means = data.mean(axis=0)\n\
      \    stds = data.std(axis=0, ddof=1)\n    normalized = (data - means) / stds\n\n    # 计算综合得分\n \
      \   scores = normalized @ weights\n\n    return scores, weights\n"
  related_papers: []
  difficulty: 3
  quality_rating: 3
  tags:
    key_concepts:
    - 变异系数法
    chart_types:
    - '**变异系数对比图**：各指标CV值'
    - '**权重分布图**：各指标权重'
    - '**数据分布箱线图**：各指标数据分布'
    - '**标准化数据图**：标准化后的数据'
    - '**敏感性分析图**：数据变化对权重影响'
    source: math-modeling-skill
  id: mc_71
  formulas:
  - 标准化：$r_{ij} = \frac{x_{ij} - \bar{x}_j}{s_j}$，其中 $x_{ij}$ 为第 $i$ 个样本第 $j$ 个指标的原始值，$\bar{x}_j$ 为指标 $j$
    的均值，$s_j$ 为指标 $j$ 的标准差。
  - 变异系数：$CV_j = \frac{s_j}{|\bar{x}_j|}$，其中 $s_j$ 为指标 $j$ 的标准差，$\bar{x}_j$ 为指标 $j$ 的均值。
  - 修正变异系数：$CV_j = \frac{s_j}{\bar{x}_j + \varepsilon}$，其中 $\varepsilon$ 为小正数，用于避免均值接近 0 时分母过小。
  - 权重：$w_j = \frac{CV_j}{\sum_{k=1}^{n} CV_k}$，其中 $CV_j$ 为指标 $j$ 的变异系数，$n$ 为指标个数，$w_j$ 为指标 $j$ 的权重。
