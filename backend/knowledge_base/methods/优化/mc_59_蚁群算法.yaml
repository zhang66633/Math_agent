  content_md: |
    # 蚁群算法与组合优化

    > **难度**:实战 · **预计学习时长**:50 分钟 · **主讲智能体**:🧩 建模手 · **方法类别**:优化

    ## 🎯 学习目标

    学完本单元,你应该能够:

    - 讲清真实蚂蚁觅食实验与信息素正反馈机制
    - 写出蚁群系统(AS)的状态转移概率与信息素更新公式,逐项解释含义
    - 手工完成一轮小型 TSP 的蚁群迭代,看懂信息素如何「塑造」路径偏好
    - 说出 α、β、ρ 三个参数的作用与典型取值,知道停滞的成因与对策(MMAS/ACS)
    - 用真实实验数据说明 ACO 在组合优化问题上的优势

    ## 📖 核心概念

    ### 1. 真实蚂蚁的启发:双桥实验

    Goss 等人 1989 年的经典实验:蚁巢与食物之间架两座桥,一长一短。初期蚂蚁随机选桥;因为短桥往返更快,单位时间内走过短桥的蚂蚁更多,留下的信息素更浓,后续蚂蚁选短桥的概率随之增大——**正反馈**最终让绝大多数蚂蚁走短桥。这就是蚁群优化(Ant Colony Optimization, ACO)的全部灵感。

    ### 2. 人工蚂蚁与真实蚂蚁的三处不同

    | 真实蚂蚁 | 人工蚂蚁 |
    |----------|----------|
    | 边走边留信息素 | 走完整条路径后**一次性**释放(便于用路径总长评价) |
    | 无记忆,可能原地打转 | 有**禁忌表**(tabu),走过的城市不再走 |
    | 连续时间 | 离散迭代,每轮所有蚂蚁同步构建解 |

    ### 3. 算法骨架(以 TSP 为例)

    1. 初始化:所有边信息素 $\tau_{ij} = \tau_0$,放 $m$ 只蚂蚁到随机起点
    2. **构建解**:每只蚂蚁按转移概率逐城移动,直到走完一圈
    3. **信息素更新**:所有边先按挥发率 $\rho$ 衰减;每只蚂蚁再在自己走过的边上沉积信息素,沉积量与路径长度成反比
    4. 迭代,直到收敛或预算耗尽;返回历史最优路径

    > 💡 建模心法:ACO 的「记忆」是**全局共享**的(信息素矩阵),蚂蚁个体之间通过环境间接通信——这叫**共识主动性(stigmergy)**。理解这一点,就知道为什么 ACO 特别适合「解由若干局部选择拼成」的组合问题(路径、分配、排序)。

    ## 🧮 公式与结论

    ### 状态转移概率

    蚂蚁 $k$ 在城市 $i$ 时,选择城市 $j$ 的概率:

    $$P_{ij}^k = \frac{[\tau_{ij}]^{\alpha}\,[\eta_{ij}]^{\beta}}{\sum_{l \in J_k(i)} [\tau_{il}]^{\alpha}\,[\eta_{il}]^{\beta}}, \qquad \eta_{ij} = \frac{1}{d_{ij}}$$

    - $\tau_{ij}$:边 $(i,j)$ 上的信息素(集体记忆);$\eta_{ij}$:能见度/启发式信息(距离的倒数,问题本身的知识)
    - $\alpha$:信息素权重。$\alpha = 0$ → 只剩贪心启发式,退化为随机贪心
    - $\beta$:启发式权重。$\beta = 0$ → 只剩信息素,初期信息素均匀时等于随机游走
    - $J_k(i)$:蚂蚁 $k$ 在 $i$ 处**尚未访问**的城市集合(禁忌表的作用)

    ### 信息素更新(Ant-Cycle 模型)

    $$\tau_{ij} \leftarrow (1-\rho)\,\tau_{ij} + \sum_{k=1}^{m} \Delta\tau_{ij}^k, \qquad \Delta\tau_{ij}^k = \begin{cases} Q / L_k, & \text{蚂蚁 } k \text{ 走过边 } (i,j) \\ 0, & \text{否则} \end{cases}$$

    - $\rho \in (0, 1]$:挥发率。挥发是**遗忘机制**——没有它,早期随机踩出的劣质边会永久霸占信息素
    - $Q$:常数(常取 1 或与路径长度同量级);$L_k$:蚂蚁 $k$ 本轮路径总长——**越短沉积越多**

    ### 两个重要改进

    - **MMAS(最大最小蚂蚁系统)**:信息素夹在 $[\tau_{\min}, \tau_{\max}]$,只有**本轮最优或历史最优**蚂蚁沉积,并把 $\tau$ 重置为 $\tau_{\max}$ 防停滞——竞赛里最实用的版本
    - **ACS(蚁群系统)**:状态转移用**伪随机比例**规则(以概率 $q_0$ 直接选 $\tau^{\alpha}\eta^{\beta}$ 最大的城市,否则按上式概率选),并加**局部信息素更新**——收敛更快,是 TSP 精解的标准配置

    ### 参数经验值

    | 参数 | 典型值 | 作用与倾向 |
    |------|--------|-----------|
    | $\alpha$ | 1–2 | 大 → 强正反馈,收敛快但易早熟 |
    | $\beta$ | 2–5 | 大 → 越像贪心,解快但差 |
    | $\rho$ | 0.1–0.5 | 大 → 忘得快,多样性好但收敛慢 |
    | $m$(蚂蚁数) | 与城市数同量级 | 太少 → 信息素样本不足;太多 → 每轮开销大 |

    ## 💡 经典例题

    ### 例题 1:4 城 TSP 一轮手算

    > 4 个城市构成单位正方形:边长为 1,对角线 $\sqrt{2} \approx 1.41$。初始 $\tau_{ij} = 1$,$\alpha = \beta = 1$,$Q = 10$,$\rho = 0.1$,1 只蚂蚁从城市 0 出发。模拟一轮。

    **① 构建路径**。从 0 出发,候选为 1、2、3:

    $$\tau\eta:\ (0,1) = 1 \times 1 = 1,\quad (0,2) = 1 \times \frac{1}{1.41} = 0.707,\quad (0,3) = 1$$

    归一化分母 $2.707$,得 $P(1) = 1/2.707 = 0.369$,$P(2) = 0.261$,$P(3) = 0.369$。设一次实现选中 3;随后从 3 到 2、2 到 1、1 回 0,路径 $0 \to 3 \to 2 \to 1 \to 0$,全是单位边,长度 $L = 4$——恰好是最优环。

    **② 信息素更新**。走过的 4 条边沉积 $\Delta\tau = Q/L = 10/4 = 2.5$;所有边先挥发:

    $$\text{走过边}:\ 0.9 \times 1 + 2.5 = 3.4, \qquad \text{未走过边}: 0.9 \times 1 = 0.9$$

    **③ 下一轮的偏好变化**。仍在 0 出发:$(0,1): 3.4 \times 1 = 3.4$,$(0,2): 0.9 \times 0.707 = 0.636$,$(0,3): 3.4$。分母 $7.436$:

    $$P(1) = P(3) = \frac{3.4}{7.436} = 0.457, \qquad P(2) = \frac{0.636}{7.436} = 0.086$$

    **解析**:对比两轮:对角线的选择概率从 0.261 掉到 0.086,单位边从 0.369 升到 0.457——**信息素正在把「蚂蚁的集体经验」变成「边的吸引力」**。短路径 → 更多沉积 → 更多蚂蚁走 → 更浓的信息素,正反馈闭环成立。多蚁并行时,这个闭环会在几十轮内把搜索锁定到最优解附近。

    ### 例题 2:参数的角色(定性实验)

    > 同一 TSP,固定其余参数,单改一个,观察行为:

    - **$\alpha$ 从 1 调到 5**:早期随机踩出的边一旦有信息素优势,立即被指数放大——**过早收敛**,解常是次优的
    - **$\beta$ 从 2 调到 0**:蚂蚁完全无视距离,信息素均匀的初期等于纯随机游走——**收敛极慢**;$\beta$ 是「问题知识」的入口,不能关掉
    - **$\rho$ 从 0.1 调到 0**:不挥发,信息素只增不减,首轮随机踩出的路径格局被永久固化——**停滞**的极端形态
    - **$\rho$ 调到 0.9**:每轮几乎清零重来,正反馈积累不起来——退化成「多起点随机贪心」

    **解析**:三个参数构成一个「探索-利用」旋钮组:$\alpha$ 管利用强度,$\beta$ 管启发式知识,$\rho$ 管记忆长度。竞赛调参从 $(\alpha, \beta, \rho) = (1, 3, 0.1)$ 出发,观察收敛曲线再微调,比网格搜索高效得多。

    ### 例题 3:ACO 求解 TSP 的实验报告(真实数据)

    > 15 城 TSP(`np.random.seed(7); np.random.rand(15, 2)`,精确最优 3.5184,由 Held-Karp 求得)。ACO 配置:10 只蚂蚁、100 轮(预算 1000 次路径评估),$\alpha=1,\ \beta=3,\ \rho=0.1,\ Q=10$。

    **实验**:独立 10 次运行:**平均 gap 0.00%——10 次全部命中精确最优**,首次达到 1% 精度所需评估次数的中位数仅为 **205**。对照:同实例 GA(预算 4650)平均 gap 6.47%,SA(swap 邻域,预算 5000)平均 gap 9.62%(详见《启发式算法综合实战》单元)。

    **解析**:ACO 在本问题上的统治级表现不是偶然:TSP 的解天然由「边」拼成,信息素恰好作用在「边」这个正确粒度上,正反馈与距离启发式方向一致。这也划定了 ACO 的适用边界——**解可以分解为带权局部选择**的组合问题(路径、分配、调度);连续优化上它没有优势,别硬套。

    ## ⚠️ 常见易错点

    1. **把 $\alpha$ 或 $\beta$ 设成 0**。$\alpha=0$ 关掉正反馈,ACO 退化成随机贪心;$\beta=0$ 关掉问题知识,初期是随机游走。两个都要为正
    2. **不设信息素上下限,且所有蚂蚁都沉积**。低质量路径反复沉积会让劣势边「堆」出虚假优势,搜索停滞;用 MMAS:只让最优蚂蚁沉积 + 限幅 $[\tau_{\min}, \tau_{\max}]$
    3. **挥发率 $\rho = 0$**。遗忘机制缺失,信息素只增不减,早期随机性被永久固化
    4. **$Q$ 与问题尺度不匹配**。$Q$ 应与路径长度同量级(如用初始贪心路径长度);$Q$ 过小,信息素差异被舍入误差淹没;$Q$ 过大,正反馈过强易早熟
    5. **忘了禁忌表**。不禁止重复城市,蚂蚁会在局部打转,构造出的「路径」根本不合法;实现时用集合/布尔数组管理未访问城市
    6. **只信信息素不信启发式**。$\eta = 1/d$ 是「问题自带的知识」,丢弃它是自断一臂;同理,给 ACO 装上 2-opt 等局部搜索(即 ACO+LS 混合),竞赛里效果提升显著

    ## ✏️ 自测练习(选择题)

    **第 1 题**蚂蚁在城市 0,候选城市 1、2:$\tau_{01} = 2,\ \tau_{02} = 3$,$d_{01} = 2,\ d_{02} = 1$。取 $\alpha = 1,\ \beta = 2$,蚂蚁选择城市 2 的概率约为:

    A. 0.6
    B. 0.667
    C. 0.857
    D. 0.143

    <details><summary>查看答案与解析</summary>
    **答案:C**。分子 $\tau_{ij}^\alpha \eta_{ij}^\beta$($\eta = 1/d$):城市 1:$2 \times 0.5^2 = 0.5$;城市 2:$3 \times 1^2 = 3$。$P(2) = \frac{3}{0.5+3} \approx 0.857$。$\beta$ 是**指数**:$\beta = 2$ 时距离优势被平方放大,城市 2 的信息素只多一半,概率却占 86%——这就是 $\beta$ 越大越贪心的数学根源。0.6 是只看信息素的比例 $3/(2+3)$;0.667 是只看能见度的比例 $1/(1+0.5)$;0.143 是城市 1 的概率,选反了。
    </details>

    **第 2 题**若把蚁群算法的挥发率设为 $\rho = 0$(信息素永不挥发),会发生什么?

    A. 早期随机踩出的路径格局被永久固化,信息素只增不减,搜索停滞
    B. 收敛更快且解的质量更好
    C. 多样性提高,能探索到更多新路径
    D. 没有影响,挥发只是数值细节

    <details><summary>查看答案与解析</summary>
    **答案:A**。挥发是 ACO 的**遗忘机制**:没有它,首轮随机构建的路径沉积的信息素永远不会衰减,后期即使发现好路径也难以撼动早期格局——停滞的极端形态。$\rho$ 大则忘得快(多样性好但收敛慢),$\rho$ 小则记忆长(收敛快但易停滞)。防停滞的正规武器是 MMAS:信息素限幅 $[\tau_{\min}, \tau_{\max}]$ 且只让最优蚂蚁沉积。「收敛更快更好」把「记忆长」误当成「学得好」——没有遗忘就没有纠错能力。
    </details>

    **第 3 题**用 ACO 求解带容量约束的车辆路径问题(VRP)时,处理容量约束最干净的做法是:

    A. 对超载路径加罚函数项 $\lambda \max(0, \text{载重} - Q)^2$
    B. 允许蚂蚁任意构建路径,完成后统一修复
    C. 计算转移概率时,把「当前车辆剩余容量装不下」的客户从候选集 $J_k(i)$ 中剔除,只在可行客户中归一化
    D. 用大 M 把容量写成线性约束加入信息素更新

    <details><summary>查看答案与解析</summary>
    **答案:C**。VRP 中一只蚂蚁构建多辆车的路线:装满就回仓库、开下一辆车,直到所有客户被服务。容量约束做进**候选集**:转移概率只在装得下的客户中归一化——这是「编码保可行」思想在 ACO 中的实现,比罚函数干净得多。罚函数、事后修复都要付出额外的评估/修复成本且需调参;「大 M + 线性约束」是 MIP 建模语言,无法直接作用于信息素更新。
    </details>

    ## 🏆 竞赛实战链接

    - **出镜频率**:ACO 是路径类组合问题的第一梯队方法:快递配送、巡检路线、物资运输(VRP 及其变体)、通信路由。国赛中「调度 + 路径」类 B 题,ACO 常与 GA 并列出现在优秀论文里
    - **论文加分点**:①画出「信息素热度图」——把边按 $\tau$ 涂色,评委一眼看懂算法在学什么;②参数敏感性曲线($\alpha, \beta, \rho$ 各 3 档);③与 GA/SA 的公平对比表(预算统一,见《启发式算法综合实战》单元);④与已知最优解的 gap 报告
    - **升级路线**:基础 AS → MMAS(防停滞)→ ACS(收敛快)→ ACO + 2-opt 局部搜索(竞赛精解标配)

    ## 💻 代码实现

    ```python
    import numpy as np

    rng = np.random.default_rng(42)

    # 15 城 TSP(精确最优 3.5184)
    np.random.seed(7)
    pts = np.random.rand(15, 2)
    d = np.sqrt(((pts[:, None] - pts[None]) ** 2).sum(-1))
    n = len(pts)


    def solve_tsp(ants=10, iters=100, alpha=1.0, beta=3.0, rho=0.1, q=10.0):
        tau = np.ones((n, n))  # 信息素矩阵
        best_len, best_tour = float("inf"), None
        for _ in range(iters):
            for _ in range(ants):  # 每只蚂蚁构建一条完整路径
                tour, cur, unvis = [0], 0, list(range(1, n))
                while unvis:
                    w = (tau[cur, unvis] ** alpha) * ((1.0 / d[cur, unvis]) ** beta)
                    w = w / w.sum()  # 转移概率(天然满足候选集合法)
                    cur = unvis[int(rng.choice(len(unvis), p=w))]
                    tour.append(cur)
                    unvis.remove(cur)
                L = sum(d[tour[i], tour[(i + 1) % n]] for i in range(n))
                if L < best_len:
                    best_len, best_tour = L, tour.copy()
            tau *= 1 - rho  # 挥发
            for i in range(n):  # Ant-Cycle 沉积(最优路径)
                tau[best_tour[i]][best_tour[(i + 1) % n]] += q / best_len
            tau = np.clip(tau, 1e-3, 10.0)  # MMAS 式限幅
        return best_len


    best = solve_tsp()
    print("最优路径长度: %.4f (精确最优 3.5184)" % best)  # 典型输出: 3.5184
    ```

    > 试试把 `best_len` 换成逐蚂蚁沉积(每只蚂蚁按自己的 $L_k$ 沉积),观察收敛曲线的变化——那就是基础 AS 与精英策略的差别。

    ## 📚 延伸阅读

    - **原始文献**:Dorigo, Maniezzo & Colorni (1996), *Ant System: Optimization by a Colony of Cooperating Agents*, IEEE TSMC-B
    - **综述**:Dorigo & Stützle, *Ant Colony Optimization* (MIT Press) — ACO 的百科全书
    - **实验原型**:Goss et al. (1989), *Self-organized shortcuts in the Argentine ant* — 双桥实验原文
    - **进阶关联**:算法对比与选型 → 《启发式算法综合实战》单元;排序类问题的另一路线 → 《遗传算法原理与应用》单元;多目标 + ACO → 《多目标优化与NSGA-II》单元

    ## 🧠 小结

    1. ACO 的精髓是**信息素正反馈 + 共识主动性**:蚂蚁通过修改共享环境间接通信,好边自动「发光」
    2. 两公式:转移概率($\tau^\alpha \eta^\beta$ 加权、候选集过滤)与信息素更新(挥发 + 按 $Q/L_k$ 沉积)
    3. 三参数:$\alpha$ 管正反馈强度、$\beta$ 管启发式知识、$\rho$ 管记忆长度;停滞的对策是 MMAS 限幅与只让最优蚁沉积
    4. 适用边界:解由「带权局部选择」拼成的组合问题(TSP/VRP/调度);连续优化勿硬套
    5. 实战报告:15 城 TSP 上 10 次全中精确最优、205 次评估即达 1% 精度——但要记得这是「此类问题」的结论,不是万能药
