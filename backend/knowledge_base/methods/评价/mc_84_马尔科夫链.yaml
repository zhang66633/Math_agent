  formulas:
  - 马尔科夫性质：$P(X_{t+1}=x_{t+1}\mid X_t=x_t,X_{t-1}=x_{t-1},\ldots)=P(X_{t+1}=x_{t+1}\mid X_t=x_t)$，表示下一状态只依赖当前状态。
  - 转移概率矩阵：$P=[p_{ij}]_{n\times n}$，其中$p_{ij}=P(X_{t+1}=j\mid X_t=i)$，且$\sum_j p_{ij}=1$。
  - n步后分布：$\pi_n=\pi_0 P^n$，其中$\pi_0$为初始分布行向量，$P$为转移概率矩阵。
  - 稳态分布：$\pi P=\pi,\ \sum_i \pi_i=1$，等价于求特征值1的左特征向量。
