method_card:
  name: 秩和比法
  name_en: Rank Sum Ratio, RSR
  category:
  - 评价
  principle: '秩和比法是一种将多指标转化为秩次（排名）进行综合评价的方法，计算简单，适用范围广。


    #### 6.1 编秩


    **编秩规则**：


    | 指标类型 | 编秩方法 |

    |---------|---------|

    | 高优指标（越大越好） | 按升序编秩：最小值编1，次小编2，... |

    | 低优指标（越小越好） | 按降序编秩：最大值编1，次大编2，... |


    **相同数值**：取平均秩次。


    #### 6.2 计算秩和比


    $$

    RSR_i = \frac{1}{m \cdot n} \sum_{j=1}^{n} R_{ij}

    $$


    其中$m$是样本数，$n$是指标数，$R_{ij}$是方案$i$在指标$j$上的秩次。


    $RSR_i \in [1/m, 1]$，值越大说明方案越优。


    #### 6.3 分档评价（可选）


    根据RSR值进行分档：


    | 分档 | RSR范围 |

    |------|---------|

    | 上等 | $RSR \geq \bar{x} + 0.5s$ |

    | 中等 | $\bar{x} - 0.5s < RSR < \bar{x} + 0.5s$ |

    | 下等 | $RSR \leq \bar{x} - 0.5s$ |


    其中$\bar{x}$和$s$分别是RSR的均值和标准差。'
  applicable_when:
  - 数据为多个样本在多个指标上的观测值，构成样本×指标的数据矩阵。
  - 各指标有明确的方向性，即可以判断为高优指标或低优指标。
  - 指标间量纲不同或数量级差异较大，但不需要进行标准化处理。
  - 样本量和指标数适中，能够对每个指标进行编秩。
  - 评价目的为综合排序或分档，而非精确的定量预测。
  typical_scenarios:
  - 多指标综合评价问题中，当各指标量纲不同且难以统一标准化时，可用秩和比法进行排序评价。
  - 医疗卫生、教育、经济等领域的绩效评价或质量排名，指标有高优和低优之分时适用。
  - 需要快速得到方案或样本的综合排名，且对计算复杂度要求较低时使用。
  - 当指标数据存在极端值或分布未知，不宜用参数统计方法时，秩和比法较为稳健。
  - 可用于分档管理，如将评价对象分为上等、中等、下等三档。
  code_snippets:
  - language: python
    description: 秩和比法 实现要点
    code: "import numpy as np\nimport pandas as pd\n\ndef rank_sum_ratio(data, directions=None):\n   \
      \ \"\"\"\n    秩和比法\n    :param data: 数据矩阵 (样本×指标)\n    :param directions: 指标方向，1为高优，-1为低优\n    :return:\
      \ RSR值, 秩次矩阵\n    \"\"\"\n    data = np.array(data)\n    m, n = data.shape\n\n    if directions\
      \ is None:\n        directions = np.ones(n)\n    else:\n        directions = np.array(directions)\n\
      \n    # 编秩\n    ranks = np.zeros((m, n))\n    for j in range(n):\n        if directions[j] == 1:\
      \  # 高优指标\n            # 升序排名\n            rank_values = pd.Series(data[:, j]).rank(method='average')\n\
      \        else:  # 低优指标\n            # 降序排名（取负后排名）\n            rank_values = pd.Series(-data[:,\
      \ j]).rank(method='average')\n        ranks[:, j] = rank_values.values\n\n    # 计算RSR\n    rsr =\
      \ ranks.sum(axis=1) / (m * n)\n\n    return rsr, ranks\n\ndef rsr_classification(rsr):\n    \"\"\
      \"\n    RSR分档评价\n    :param rsr: RSR值数组\n    :return: 各样本分档结果\n    \"\"\"\n    mean_rsr = rsr.mean()\n\
      \    std_rsr = rsr.std()\n\n    classifications = []\n    for value in rsr:\n        if value >=\
      \ mean_rsr + 0.5 * std_rsr:\n            classifications.append('上等')\n        elif value <= mean_rsr\
      \ - 0.5 * std_rsr:\n            classifications.append('下等')\n        else:\n            classifications.append('中等')\n\
      \n    return classifications\n"
