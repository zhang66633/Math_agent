method_card:
  name: 麻雀搜索算法
  name_en: Sparrow Search Algorithm, SSA
  category:
  - 优化
  principle: '麻雀搜索算法是Xue等人于2020年提出的新型元启发式算法，模拟麻雀种群的觅食和反捕食行为。算法将麻雀分为发现者、跟随者和预警者三类，通过协同搜索实现快速收敛。


    **发现者位置更新**：

    $$

    X_{i,j}^{t+1} = \begin{cases}

    X_{i,j}^t \cdot \exp(-\frac{i}{\alpha \cdot iter_{max}}), & R_2 < ST \\

    X_{i,j}^t + Q \cdot L, & R_2 \geq ST

    \end{cases}

    $$


    **跟随者位置更新**：

    $$

    X_{i,j}^{t+1} = \begin{cases}

    Q \cdot \exp(\frac{X_{worst} - X_{i,j}^t}{i^2}), & i > n/2 \\

    X_{p}^{t+1} + |X_{i,j}^t - X_{p}^{t+1}| \cdot A^+ \cdot L, & \text{otherwise}

    \end{cases}

    $$


    **预警者位置更新**：

    $$

    X_{i,j}^{t+1} = \begin{cases}

    X_{best}^t + \beta \cdot |X_{i,j}^t - X_{best}^t|, & f_i > f_g \\

    X_{i,j}^t + K \cdot \frac{|X_{i,j}^t - X_{worst}^t|}{f_i - f_w + \epsilon}, & f_i = f_g

    \end{cases}

    $$


    **参数**：

    - $ST$：安全阈值（0.2-0.8）

    - $\alpha$：[0, 1]随机数

    - $R_2$：预警值，[0, 1]随机数'
  applicable_when:
  - 目标函数为黑箱函数，无法获得解析梯度或导数信息。
  - 问题维度较高，传统梯度方法易陷入局部最优或计算代价过大。
  - 搜索空间有明确上下界约束，变量为连续或可编码为连续值。
  - 允许一定随机性，且可接受多次独立运行取最优结果。
  - 优化问题对收敛速度有一定要求，但不需要严格理论最优性证明。
  typical_scenarios:
  - 连续或离散变量的全局优化问题，目标函数不可导或梯度信息难以获取时使用。
  - 高维参数寻优问题，如机器学习超参数调优、神经网络权重初始化搜索。
  - 工程优化设计问题，如结构参数优化、路径规划、调度问题。
  - 需要快速收敛且计算资源有限的场景，如实时优化或嵌入式系统参数整定。
  - 多峰函数优化问题，需要跳出局部最优寻找全局最优解。
  code_snippets:
  - language: python
    description: 麻雀搜索算法 实现要点
    code: "import numpy as np\n\ndef sparrow_search_algorithm(objective_func, dim, bounds, n_sparrows=50,\n\
      \                             max_iter=100, ST=0.8):\n    # 初始化麻雀种群\n    sparrows = np.random.uniform(bounds[0],\
      \ bounds[1], (n_sparrows, dim))\n    fitness = np.array([objective_func(s) for s in sparrows])\n\
      \n    # 排序并确定最佳和最差位置\n    sorted_idx = np.argsort(fitness)\n    best_pos = sparrows[sorted_idx[0]].copy()\n\
      \    worst_pos = sparrows[sorted_idx[-1]].copy()\n    best_fitness = fitness[sorted_idx[0]]\n  \
      \  worst_fitness = fitness[sorted_idx[-1]]\n\n    # 发现者数量（前20%）\n    n_discoverers = int(0.2 * n_sparrows)\n\
      \n    for iteration in range(max_iter):\n        for i in range(n_sparrows):\n            R2 = np.random.rand()\n\
      \            if i < n_discoverers:\n                # 发现者更新\n                if R2 < ST:\n     \
      \               sparrows[i] *= np.exp(-i / (np.random.rand() * max_iter))\n                else:\n\
      \                    sparrows[i] += np.random.randn()\n            else:\n                # 跟随者更新\n\
      \                if i > n_sparrows / 2:\n                    sparrows[i] = np.random.randn() * np.exp(\n\
      \                        (worst_pos - sparrows[i]) / i**2)\n                else:\n            \
      \        A = np.floor(np.random.randn() * dim)\n                    AA = A.T @ (A @ A.T)**-1 if\
      \ A.shape else 0\n                    sparrows[i] = best_pos + abs(sparrows[i] - best_pos) * AA\n\
      \n            # 边界处理\n            sparrows[i] = np.clip(sparrows[i], bounds[0], bounds[1])\n\n \
      \       # 预警者更新（适应度最差的10%）\n        worst_indices = sorted_idx[-int(0.1 * n_sparrows):]\n      \
      \  for i in worst_indices:\n            if fitness[i] > best_fitness:\n                sparrows[i]\
      \ = best_pos + np.random.randn() * abs(sparrows[i] - best_pos)\n            else:\n            \
      \    sparrows[i] += np.random.randn() * abs(\n                    sparrows[i] - worst_pos) / (fitness[i]\
      \ - worst_fitness + 1e-10)\n\n        # 更新适应度和最优解\n        fitness = np.array([objective_func(s)\
      \ for s in sparrows])\n        current_best_idx = np.argmin(fitness)\n        if fitness[current_best_idx]\
      \ < best_fitness:\n            best_fitness = fitness[current_best_idx]\n            best_pos =\
      \ sparrows[current_best_idx].copy()\n\n    return best_pos, best_fitness\n"
