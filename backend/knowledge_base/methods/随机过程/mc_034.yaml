method_card:
  id: mc_034
  name: 马尔可夫链模型
  name_en: Markov Chain Model
  category:
  - 预测
  - 统计
  - 统计分析
  principle: 马尔可夫链是一种描述随机过程演变的数学模型，其核心假设是系统未来的状态仅依赖于当前状态，而与过去的历史无关（马氏性）。该模型通过状态空间、一步转移概率矩阵和初始分布来刻画随机序列的统计规律。在时齐条件下，转移概率与时间起点无关，仅依赖于时间间隔。通过柯尔莫哥洛夫-开普曼定理，可以递推计算多步转移概率。当转移矩阵为正则时，链具有遍历性，即存在唯一的极限分布（不动点向量），该分布由方程组πP=π和归一化条件唯一确定。
  formulas:
  - name: 马氏性定义
    latex: $$P(\xi_{n+m}=j|\xi_n=i,\xi_{n-1}=i_{n-1},\ldots,\xi_1=i_1)=P(\xi_{n+m}=j|\xi_n=i)$$
    description: 马尔可夫链的核心性质：未来状态仅依赖于当前状态。
  - name: 时齐性定义
    latex: $$p_{ij}(m)=P(\xi_{n+m}=j|\xi_n=i)$$
    description: 时齐马尔可夫链的m步转移概率与起始时刻n无关。
  - name: 柯尔莫哥洛夫-开普曼方程
    latex: $$p_{ij}^{(n+m)}=\sum_{k\in E}p_{ik}^{(n)}p_{kj}^{(m)}$$
    description: 多步转移概率的递推关系。
  - name: n步概率分布
    latex: $$P^{(n)}=P^{(0)}P^n$$
    description: 第n步的概率分布由初始分布和转移矩阵的n次幂给出。
  - name: 极限分布方程组
    latex: $$\pi_j=\sum_{i=1}^N\pi_i p_{ij},\quad \sum_{j=1}^N\pi_j=1$$
    description: 遍历链的极限分布满足的线性方程组。
  applicable_when:
  - 系统状态可离散化且状态空间有限或可列
  - 系统未来状态仅依赖于当前状态（无后效性）
  - 转移概率稳定或可估计（时齐性）
  - 需要预测长期行为或稳态分布
  not_applicable_when:
  - 系统状态连续或不可离散化
  - 未来状态明显依赖于多个历史时刻（非马氏性）
  - 转移概率随时间剧烈变化（非时齐）
  - 状态空间无限且无结构
  typical_scenarios:
  - 顾客购买行为预测（品牌选择）
  - 设备运行状态监测与故障预测
  - 信息传播的失真分析
  - 随机徘徊与物理过程模拟
  - 库存管理与排队系统分析
  common_mistakes:
  - mistake: 误认为所有随机序列都是马尔可夫链，忽略马氏性检验
    solution: 应通过数据或机理验证P(ξ_{n+1}|ξ_n,ξ_{n-1}) = P(ξ_{n+1}|ξ_n)是否成立。
  - mistake: 直接使用频率估计转移概率时样本量不足
    solution: 确保每个状态出发的转移次数足够大（通常建议≥20），否则需采用平滑或贝叶斯估计。
  - mistake: 将非时齐链按时齐链处理
    solution: 若转移概率随时间变化，应使用时齐性检验或采用非时齐模型。
  code_snippets:
  - language: matlab
    description: 根据观测数据估计一步转移概率矩阵
    code: "a=[4 3 2 1 4 3 1 1 2 3 ...  \n   2 1 2 3 4 4 3 3 1 1 ... \n   1 3 3 2 1\
      \ 2 2 2 4 4 ... \n   2 3 2 3 1 1 2 4 3 1]; \nfor i=1:4 \n   for j=1:4 \n   \
      \   f(i,j)=length(findstr([i j],a)); \n   end \nend \nf \nni=(sum(f'))' \nfor\
      \ i=1:4 \n   p(i,:)=f(i,:)/ni(i); \nend \np"
  - language: python
    description: 根据观测数据估计一步转移概率矩阵
    code: "import numpy as np\n\na = [4,3,2,1,4,3,1,1,2,3,\n     2,1,2,3,4,4,3,3,1,1,\n\
      \     1,3,3,2,1,2,2,2,4,4,\n     2,3,2,3,1,1,2,4,3,1]\nn_states = 4\nf = np.zeros((n_states,\
      \ n_states), dtype=int)\nfor t in range(len(a)-1):\n    i = a[t] - 1\n    j\
      \ = a[t+1] - 1\n    f[i,j] += 1\nni = f.sum(axis=1)\np = f / ni[:, np.newaxis]\n\
      print(p)"
