method_card:
  name: 指数平滑法
  name_en: Exponential Smoothing
  category:
  - 预测
  principle: '指数平滑法通过对历史数据加权平均进行预测，近期数据权重更大。


    #### 7.1 简单指数平滑


    适用于无趋势、无季节性的数据。


    $$

    F_{t+1} = \alpha y_t + (1 - \alpha) F_t

    $$


    其中$\alpha \in (0, 1)$是平滑系数。


    #### 7.2 Holt线性趋势法


    适用于有趋势、无季节性的数据。


    **水平方程**：$L_t = \alpha y_t + (1 - \alpha)(L_{t-1} + T_{t-1})$


    **趋势方程**：$T_t = \beta(L_t - L_{t-1}) + (1 - \beta)T_{t-1}$


    **预测**：$F_{t+m} = L_t + m T_t$


    #### 7.3 Holt-Winters季节性方法


    适用于有趋势和季节性的数据。


    **水平方程**：$L_t = \alpha \frac{y_t}{S_{t-s}} + (1 - \alpha)(L_{t-1} + T_{t-1})$


    **趋势方程**：$T_t = \beta(L_t - L_{t-1}) + (1 - \beta)T_{t-1}$


    **季节方程**：$S_t = \gamma \frac{y_t}{L_t} + (1 - \gamma)S_{t-s}$


    **预测**：$F_{t+m} = (L_t + m T_t) S_{t-s+m}$'
  applicable_when:
  - 时间序列数据按等间隔时间点观测，且观测值可视为数值型序列。
  - 预测目标主要依赖历史观测的加权平均，近期数据比远期数据更重要。
  - 简单指数平滑要求数据无趋势、无季节性；Holt法要求无季节性但有趋势；Holt-Winters要求同时有趋势和季节性。
  - 季节性周期长度s已知且相对稳定，例如月度数据s=12、季度数据s=4。
  - 平滑系数α、β、γ可在(0,1)范围内选取或优化，用于控制水平、趋势、季节成分的更新速度。
  typical_scenarios:
  - 数据无明显趋势和季节性，只需对短期水平进行平稳预测时，使用简单指数平滑。
  - 数据存在线性趋势但无季节性，需要预测未来若干期的趋势延续时，使用Holt线性趋势法。
  - 数据同时存在趋势和固定周期季节性，需要预测未来季节周期内的取值时，使用Holt-Winters季节性方法。
  - 需要对近期变化更敏感、对远期历史逐渐衰减权重的时序预测任务。
  - 作为短期至中期时间序列预测的基线方法，在数据量有限或模型解释性要求较高时使用。
  code_snippets:
  - language: python
    description: 指数平滑法 实现要点
    code: "from statsmodels.tsa.holtwinters import SimpleExpSmoothing, Holt, ExponentialSmoothing\n\n\
      # 简单指数平滑\ndef simple_exponential_smoothing(data, alpha=0.2):\n    \"\"\"简单指数平滑\"\"\"\n    model\
      \ = SimpleExpSmoothing(data)\n    fit = model.fit(smoothing_level=alpha, optimized=False)\n    forecast\
      \ = fit.forecast(steps=1)\n    return forecast, fit\n\n# Holt线性趋势法\ndef holt_linear_trend(data,\
      \ alpha=0.3, beta=0.1):\n    \"\"\"Holt线性趋势法\"\"\"\n    model = Holt(data)\n    fit = model.fit(smoothing_level=alpha,\
      \ smoothing_trend=beta, optimized=False)\n    forecast = fit.forecast(steps=5)\n    return forecast,\
      \ fit\n\n# Holt-Winters季节性方法\ndef holt_winters(data, seasonal_periods=12, trend='add', seasonal='add'):\n\
      \    \"\"\"Holt-Winters季节性方法\"\"\"\n    model = ExponentialSmoothing(data, trend=trend, seasonal=seasonal,\n\
      \                                 seasonal_periods=seasonal_periods)\n    fit = model.fit()\n  \
      \  forecast = fit.forecast(steps=seasonal_periods)\n    return forecast, fit\n"
