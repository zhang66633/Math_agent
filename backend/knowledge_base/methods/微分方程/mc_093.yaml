    - **进阶关联**:时间离散 + 空间离散的思想 → 《元胞自动机建模》单元(完全离散);若问题无需空间分布 → 《常微分方程建模》单元;PDE 参数反演与数据模型结合 → 《组合模型设计》单元

    ## 🧠 小结

    1. 三大 PDE 对应三类问题:扩散(热、污染)、波动(声、弦)、稳态(温度场、电势);建模入口是**守恒律 + 菲克定律**
    2. 显式格式「时间前差 + 空间中心差」,二阶空间精度,但受限于 $s \le 1/2$;隐式与 Crank-Nicolson 无条件稳定,代价是解三对角方程组
    3. von Neumann 分析三步:设模态 → 求增长因子 $g$ → 要求 $|g| \le 1$,这是稳定性结论的标准推导,论文必写
    4. 三类边界条件(Dirichlet/Neumann/周期)的实现各不相同,Neumann 用虚拟节点,写错边界全盘皆输
    5. 验证程序的两块试金石:正弦初值对解析解(例题 1)、稳态线性分布精确成立(例题 3)——都通过了,论文的数值结果才算立得住
