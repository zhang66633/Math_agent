  problem_ref: ''
  problem_context: 大规模创新类竞赛通常没有标准答案，评审专家只能依据评审框架独立打分。当参赛作品和专家数量很大时，专家评分主观性被放大，出现评分区间偏好、评分分布差异和同一作品极差过大等问题，影响评审公平性和排序可靠性。附件给出模拟大规模竞赛的两阶段评审数据：第一阶段每件作品由5位专家打分，按标准分公式标准化后取5个标准分均值排序，靠前作品进入第二阶段；第二阶段由3位专家重新评审，仍取标准分，对少数极差大的作品进行复议调整，最终总成绩由第一阶段5位专家标准分均值与第二阶段3位专家标准分共4份成绩求和得到；未进入第二阶段的作品总成绩为第一阶段5位专家标准分均值，排名总在进入第二阶段作品之后。问题要求利用这些数据建立更合理、公平的评审方案。具体包括：问题一为3000支参赛队和125位专家、每作品5位专家评审设计最优交叉分发方案，保证专家工作量均衡、专家间有足够且均衡的作品交集以增强成绩可比性；问题二分析现有方案和专家与作品原始分、标准分分布，设计融合专家可信度的新标准分计算模型，并以复议一等奖排序为参照调参；问题三分析两阶段成绩和极差整体变化，提炼复议调整规律，建立极差模型，程序化处理非高非低分段的大极差作品；问题四整合前三问形成完整评审模型，在附件2.1和2.2上求解并与无复议、有复议方案比较。输入数据包括作品-专家评分、标准分、复议前后分数、两阶段排序等；期望输出是交叉分发方案、新标准分公式与排序、大极差自动调整方案、完整评审流程及评价指标。
  methodology_chain:
  - '数据探索与指标定义: 分析附件1中专家评审作品数、交集专家数、交集作品数，发现三者均衡是交叉分发的关键指标。'
  - '问题一建模: 对3000作品×125专家定义0-1分配变量，建立混合整数多目标规划，目标最大化总重复作品数并最小化其方差，约束每作品5专家、工作量与交集数方差上限。'
  - '问题一求解: 设计辅助矩阵和滑动窗口贪心启发式，两阶段生成候选方案，用余弦相似度筛选，滑动窗口改进，修正超额分配，按有效分数选择。'
  - '问题二数据分析: 分析原始评分区间主观性、分布差异和极差大问题，比较方案一、二、四优缺点，确定以两阶段标准分加专家可信度为新方案方向。'
  - '问题二建模: 用分值偏差和排序偏差度量专家与群体一致性，得到可信度，经相似矩阵和层次聚类分类赋权，构建新标准分 x=γx1+(1-γ)W a。'
  - '问题二求解: 对42位专家聚为2类，权重1.02和0.82，以与复议一等奖排序差异度最小为目标调参，得到γ=0.9。'
  - '问题三数据分析: 比较一阶段与两阶段成绩均值、区域分布和极差，发现复议阈值约20、复议后极差均值从23.47降到15.26、方差从150降到70，总结调整位置和幅度规律。'
  - '问题三建模: 建立极差模型，0-1变量Q决定调整位置，连续变量S决定调整量，约束位置方向、调整幅度、调整后均值斜率，目标最小化极差均值和标准分方差均值。'
  - '问题三求解: 构造差值矩阵和状态矩阵，随机生成候选调整方案，用有效性分数选择，程序化一阶段过滤低分、处理大极差、调用模型并输出。'
  - '问题四集成: 将交叉分发、新标准分、极差调整整合为完整两阶段评审模型，在2.1和2.2数据求解，与无复议、有复议方案对比。'
  - '评价与灵敏度: 分析时间复杂度、参数γ和优先级参数影响，讨论模型优缺点和改进方向。'
  key_formulas:
  - name: 交叉分发决策变量
    latex: X_{i,j}\in\{0,1\}
    description: 表示参赛队i是否分配给专家j，若分配则为1，否则为0。
  - name: 每作品专家数约束
    latex: \sum_{j\in B} X_{i,j}=5,\quad \forall i\in A
    description: 保证每件作品由5位专家评审。
  - name: 专家重复作品数与存在变量
    latex: y_{j,k}=|C_j\cap C_k|,\quad Z_{j,k}=\begin{cases}1,&y_{j,k}\neq 0\\0,&y_{j,k}=0\end{cases}
    description: 刻画专家j和专家k之间重复评审的作品数量及是否存在交集。
  - name: 问题一目标函数
    latex: \max\ \alpha\sum_{j\in B} n_j-\beta\sigma_n,\quad n_j=\sum_{k\in B} y_{j,k}
    description: 最大化专家重复作品总数，同时惩罚重复作品数的不均衡。
  - name: 原始标准分公式
    latex: x_{k,1}=50+10\times\frac{a_k-\bar a}{s}
    description: 将专家原始分标准化到均值50、标准差10的尺度。
  - name: 分值偏差
    latex: \delta_{0,j}=\frac{1}{r_j}\sum_{i\in F_j}\frac{D_{i,j}-\sum_{j\in B}D_{i,j}}{\sum_{j\in
      B}D_{i,j}}
    description: 衡量专家j的评分与专家群体总评分的相对偏差。
  - name: 排序偏差
    latex: \delta_{1,j}=\frac{1}{r_j}\sum_{i\in F_j}\frac{|E_{j,i}-H_{j,i}|}{r_j-1}
    description: 衡量专家j内部排序与专家群体总排序的一致性差异。
  - name: 专家可信度与相似系数
    latex: P_{0,j}=1-\delta_{0,j},\quad P_{1,j}=1-\delta_{1,j},\quad \chi_{u,v}=\frac{P_{0,u}P_{0,v}+P_{1,u}P_{1,v}}{M}
    description: 由偏差得到可信度，并构造专家间相似矩阵用于层次聚类。
  - name: 新标准分公式
    latex: x_k=\gamma x_{k,1}+(1-\gamma)W_j a_k
    description: 融合原始标准分和经专家可信度权重修正的原始分。
  - name: 排序差异度目标
    latex: \min\sqrt{\sum_{i=1}^n(s_i-t_i)^2}
    description: 以复议一等奖排序为参照，最小化新方案与权威排序的差异。
  - name: 极差模型目标函数
    latex: \min\ \alpha\bar\eta' +\beta\bar V,\quad \bar\eta'=\frac{1}{t}\sum_{i\in
      T}\eta'_i,\quad \bar V=\frac{1}{t}\sum_{i\in T}V_i
    description: 最小化调整后大极差作品的极差均值和标准分方差均值。
  - name: 最终总成绩
    latex: M_i=\sum_{j\in B'}Z''_{i,j}+\bar P_i
    description: 第二阶段调整后标准分之和加上第一阶段标准分均值，得到作品最终成绩。
  - name: 问题二最终标准分公式
    latex: x_k=0.9\times\left(50+10\times\frac{a_k-\bar a}{s}\right)+0.1\times W_j\times
      a_k
    description: 调参后得到的最优标准分计算式，γ=0.9。
  algorithm_outline:
  - language: pseudocode
    description: 问题一基于辅助矩阵和滑动窗口的交叉分发启发式算法。
    code: "输入 作品数 N=3000, 专家数 M=125, 每作品专家数 K=5, 候选数 M_c, 测试数 N_t\n初始化 con_array =\
      \ 0^N, p1 = 0^{M×N}\nfor j in 0..M-1:\n    if j <= 50:\n        生成 M_c 个随机候选向量\
      \ T\n        计算 T 与 (K-con_array) 的余弦相似度\n        选相似度最高的 N_t 个\n    else:\n\
      \        按 con_array 升序排序索引\n        用滑动窗口在排序索引上生成 N_t 个候选方案\n    对每个候选:\n \
      \       若 p1 已有分配使某作品超过 K，则置对应位置为 0\n        计算 zj_score, zj_num 等指标\n     \
      \   Score = alpha*score1 + (1-alpha)*score2\n    选择 Score 最大的候选作为专家 j 分配\n \
      \   p1[j,:] = best; con_array = sum(p1, axis=0)\n输出 p1"
  - language: pseudocode
    description: 问题二专家可信度计算、层次聚类赋权和新标准分调参算法。
    code: "读取附件评分矩阵 D\nfor 每个专家 j:\n    计算分值偏差 delta0_j 和排序偏差 delta1_j\n    P0_j=1-delta0_j,\
      \ P1_j=1-delta1_j\n构建相似矩阵 chi\n用层次聚类对专家分类并赋权 W_j\nfor gamma in 0..1 step 0.01:\n\
      \    x_k = gamma*(50+10*(a_k-mean)/std) + (1-gamma)*W_j*a_k\n    按总分排序，计算与复议一等奖排序的差异度\n\
      选差异度最小的 gamma 和权重\n输出新标准分公式与排序"
  - language: pseudocode
    description: 问题三极差模型启发式求解算法。
    code: "计算所有作品标准分极差 eta_i\nT = {i | eta_i >= 20}\nfor i in T:\n    计算均值 mean_i,\
      \ 差值矩阵 diff, 状态矩阵 state\n    确定候选调整位置 ID_i（差值最大或同向偏离的位置）\n    for 候选 c in 大量随机调整方案:\n\
      \        在 ID_i 上生成调整量 S，使分数趋近均值\n        计算调整后极差均值、方差、分布斜率\n        Score =\
      \ 有效性分数\n    选择 Score 最大的调整方案\n输出调整后标准分矩阵"
  assumption_analysis:
  - 假设3000支参赛队和125位评审专家随机给出，没有明显差别，仅考虑分配问题 → 合理但简化；实际中专家有领域专长和评分风格，放松后需加入专家-作品匹配约束或分层分配。
  - 假设专家原始评审结果独立且不受其他专家评分影响 → 在初评阶段大致合理；但复议和答辩会引入相互影响，放松后需建模专家协商网络和意见传播。
  - 假设专家评分差异可用统计分析方法衡量 → 合理，论文用偏差、方差、聚类；放松后可用序数模型、贝叶斯层次模型或稳健统计。
  - 假设最高分段和最低分段作品不受打分方案影响，仅中间段作品成绩会因方案不同产生波动 → 是降维假设；实际所有作品都可能波动，放松后需对全分数段建立调整模型。
  reusable_patterns:
  - '大规模0-1交叉分配模式: 用辅助矩阵记录每作品剩余可分配专家数，用滑动窗口在高需求作品上优先分配，再以交集指标评分选择候选，可迁移到评审、阅卷、任务分配、众包标注等场景。'
  - '专家可信度赋权模式: 以专家个体与群体在分值和排序上的一致性构造可信度，用相似矩阵和层次聚类赋权，再融入标准化公式，可迁移到主观评分、专家咨询、AHP群决策。'
  - '从人工复议数据学习规则并程序化模式: 先分析阈值、调整位置、调整幅度规律，再转化为带约束优化或启发式，可迁移到需要替代人工干预的质量控制、异常修正。'
  - '以权威排序为参照的参数调优模式: 将专家协商一致的复议结果作为金标准，用排序差异度、大极差数量等指标调参和验证，可迁移到无绝对真值的评价模型。'
  - '多阶段评审与过滤模式: 先用低成本标准分筛选低分无争议作品，再对入围作品多专家重评和大极差调整，平衡评审成本与可靠性。'
  common_pitfalls:
  - mistake: 把交叉分发只当做每作品5专家的随机分配，忽略专家间交集均衡。
    solution: 显式定义专家工作量、交集专家数、交集作品数三个指标，并在目标或约束中均衡。
  - mistake: 直接使用标准分而不检验专家作品集水平分布一致假设。
    solution: 加入专家可信度赋权或分层标准化，检验各专家作品集分布。
  - mistake: 极差阈值20固定套用所有数据。
    solution: 根据数据分位数或业务目标动态确定阈值，并做灵敏度分析。
  - mistake: 多目标线性加权前未归一化和量纲处理。
    solution: 对各子目标标准化或归一化，调参并报告权重敏感性。
  - mistake: 贪心启发式只跑一次，容易陷入局部最优。
    solution: 多随机重启、扩大候选池、混合局部搜索或元启发式。
  difficulty: 3
  difficulty_level: hard
  analysis:
    problem_summary: 在无标准答案的大规模创新竞赛中，设计可提高评分可比性、公平性和自动化程度的交叉分发、标准分计算、极差调整及完整两阶段评审模型。
    key_assumptions:
    - 参赛队和专家无明显差别，仅考虑分配问题。
    - 专家原始评审独立且不受其他专家评分影响。
    - 专家评分差异可用统计分析方法衡量。
    - 最高分段和最低分段作品不受打分方案影响，仅中间段波动。
    decision_variables: X_{i,j} 作品i是否分配给专家j；Q_{i,j} 是否调整作品i在专家j的标准分；S_{i,j} 调整量；W_j
      专家可信度权重；γ 标准分融合参数；α,β 目标权重。
    objective: 分配阶段最大化专家重复作品总数并最小化不均衡；标准分阶段最小化与复议权威排序差异；极差阶段最小化调整后极差均值和标准分方差均值；完整模型使最终排序接近有复议结果并减少大极差作品。
    constraints: 每作品由固定数量专家评审；专家工作量与交集指标均衡；调整位置需与均值偏差方向一致且优先差距大；调整量不越过均值；调整后均值曲线斜率变化受限；总分与排序规则一致。
  model:
    approach: 论文采用先分析数据规律、再建立优化模型、最后用启发式算法求解的路线。问题一将交叉分发抽象为0-1混合整数多目标规划，用辅助矩阵和滑动窗口贪心生成满足每作品5专家的大规模分配方案。问题二先比较现有方案，识别标准分未解决专家主观性和极差问题，进而以专家与群体在分值和排序上的一致性构造可信度，经相似矩阵和层次聚类赋权，把专家可信度融合进标准分公式，以复议一等奖排序为参照优化超参数。问题三从复议数据中提炼大极差阈值、调整位置和幅度规律，建立以调整位置Q和调整量S为决策变量的极差模型，目标最小化调整后极差均值和标准分方差均值，并用差值矩阵、状态矩阵和随机候选方案的有效性评分求解。问题四将前三问模块集成为完整两阶段评审模型：交叉分发、新标准分初评、过滤低分无争议作品、第二阶段重评并自动调整大极差，最后计算总分排序。整体求解以Python实现，使用NumPy和Pandas处理数据、SciPy层次聚类、随机搜索和贪心启发式。
    innovation: 将专家可信度以分值和排序双偏差度量并聚类赋权，融入标准分；从人工复议数据中学习大极差调整规则并转化为可程序化优化模型；用辅助矩阵和滑动窗口解决大规模交叉分发。
    solution_method: Python（NumPy、Pandas、SciPy、Matplotlib），层次聚类、贪心或启发式、随机候选、线性加权、参数调优、灵敏度分析。
  evaluation:
    strengths:
    - 问题拆解完整，从分发、评分、极差调整到整体评审形成闭环。
    - 模型与实际数据结合紧密，用复议结果作为金标准验证。
    - 提出专家可信度和极差程序化调整，创新性较强。
    - 算法时间复杂度较低，适合大规模场景。
    weaknesses:
    - 多目标权重和阈值多为经验设定，缺乏严格统计检验。
    - 极差模型依赖复议数据，跨数据集泛化能力有限。
    - 假设专家作品集水平分布一致等较强，可能影响标准分公平性。
    - 部分公式和符号在OCR中较乱，复现细节不足。
    lessons: 这篇论文提示我们，面对无标准答案的评价问题，可先用数据诊断评分偏差，再构造专家可信度和标准化模型；对于人工经验规则，应尽量提炼为显式约束和目标，并用启发式算法程序化。验证时若存在权威协商结果，可作为金标准计算排序差异度。多阶段评审和交叉分发是提高大规模评审公平性的有效框架。
  takeaways: []
  source: 第二十届中国研究生数学建模竞赛“华为杯”参赛论文，杭州电子科技大学，参赛队号23103360083
  quality_rating: 4
