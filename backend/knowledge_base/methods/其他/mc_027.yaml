    ## 🧠 小结

    1. 排队系统六要素 → Kendall 记号 → 选标准模型(M/M/1、M/M/c),先查 $\rho < 1$ 再动笔
    2. 生灭过程的局部平衡方程 $\lambda p_{n-1} = \mu p_n$ 是 M/M/1 一切结论的源头:$p_n = (1-\rho)\rho^n$,几何分布
    3. 四指标两公式:$L = \rho/(1-\rho)$、$L_q = \rho^2/(1-\rho)$,再由 Little 公式 $L = \lambda W$ 换算时间指标;记住 $L = L_q + \rho$ 与 $W = W_q + 1/\mu$ 两个自查式
    4. M/M/c 用 Erlang C 公式求等待概率;同样的服务强度,多台并联远比单台高效
    5. 完整答题链条:模型 → 稳态分布 → 指标 → 容量/台数优化 → 灵敏度分析,仿真验证公式,论文就立住了
