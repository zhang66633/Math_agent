  id: mc_79
  formulas:
  - 均值填充：$x_{ij} = \bar{x}_j$，其中 $x_{ij}$ 为第 $i$ 个样本第 $j$ 个特征的缺失值，$\bar{x}_j$ 为第 $j$ 个特征的均值。
  - Z-score 异常值判定：$Z_i = \frac{x_i - \bar{x}}{\sigma}$，当 $|Z_i| > 3$ 时判定为异常值，其中 $\bar{x}$ 为均值，$\sigma$ 为标准差。
  - Min-Max 归一化：$x'_i = \frac{x_i - \min(x)}{\max(x) - \min(x)}$，将原始值线性映射到 $[0,1]$ 区间。
  - Z-score 标准化：$x'_i = \frac{x_i - \bar{x}}{\sigma}$，其中 $\bar{x}$ 为均值，$\sigma$ 为标准差。
  - Box-Cox 变换：$x'_i = \begin{cases} \frac{x_i^\lambda - 1}{\lambda}, & \lambda \neq 0 \\ \ln(x_i), & \lambda
    = 0 \end{cases}$，其中 $\lambda$ 为变换参数。
