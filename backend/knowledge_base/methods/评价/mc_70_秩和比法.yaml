  quality_rating: 3
  tags:
    key_concepts:
    - 秩和比法
    chart_types:
    - '**RSR值对比图**：各方案RSR值'
    - '**分档直方图**：RSR分档分布'
    - '**秩次热力图**：秩次矩阵可视化'
    - '**排序对比图**：RSR排序与其他方法对比'
    - '**箱线图**：RSR值分布'
    source: math-modeling-skill
  id: mc_70
  formulas:
  - RSR_i = \frac{1}{m \cdot n} \sum_{j=1}^{n} R_{ij}，其中 m 为样本数，n 为指标数，R_{ij} 为第 i 个样本在第 j 个指标上的秩次。
  - 高优指标编秩：将指标值按升序排列，最小值编秩为 1，次小编秩为 2，依次类推。
  - 低优指标编秩：将指标值按降序排列，最大值编秩为 1，次大编秩为 2，依次类推。
  - 相同数值处理：若多个样本指标值相同，则取它们应得秩次的平均值作为各自秩次。
  - 分档界限：上等为 RSR \geq \bar{x} + 0.5s，中等为 \bar{x} - 0.5s < RSR < \bar{x} + 0.5s，下等为 RSR \leq \bar{x} - 0.5s，其中
    \bar{x} 和 s 分别为 RSR 的均值和标准差。
