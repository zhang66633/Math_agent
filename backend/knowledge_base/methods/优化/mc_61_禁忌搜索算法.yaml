method_card:
  name: 禁忌搜索算法
  name_en: Tabu Search, TS
  category:
  - 优化
  principle: '禁忌搜索算法通过记忆机制避免循环搜索，使用禁忌表记录最近访问的解，在指定迭代次数内不允许重复访问。


    **核心要素**：

    - **禁忌表**：存储禁忌对象

    - **禁忌长度**：对象被禁忌的迭代次数

    - **特赦规则**：某些情况下可解除禁忌

    - **候选集**：邻域中的候选解'
  applicable_when:
  - 问题具有离散或可离散化的解空间，且能定义邻域操作生成候选解。
  - 目标函数可计算但可能非凸、不可导或存在多个局部最优。
  - 需要显式记忆近期搜索历史以避免循环或重复访问同一解。
  - 允许通过禁忌长度和特赦规则控制搜索的集中性与多样性。
  - 问题规模较大，精确算法难以在可接受时间内求得全局最优解。
  typical_scenarios:
  - 组合优化问题中解空间巨大且存在大量局部最优时，可用禁忌搜索跳出局部最优。
  - 调度与排程问题中邻域操作容易产生循环搜索时，可用禁忌表避免重复访问。
  - 路径规划与网络设计问题中需要在离散解空间中高效搜索近优解时，适合使用禁忌搜索。
  - 资源分配与选址问题中目标函数复杂且难以求导时，可用禁忌搜索进行黑箱优化。
  - 需要平衡搜索多样性与集中性、且允许接受非改进解的优化场景中，可使用禁忌搜索。
  code_snippets:
  - language: python
    description: 禁忌搜索算法 实现要点
    code: "def tabu_search(initial_solution, objective_func, neighborhood_func,\n                tabu_tenure=10,\
      \ max_iterations=1000):\n    current_solution = initial_solution\n    best_solution = initial_solution\n\
      \    tabu_list = []\n\n    for iteration in range(max_iterations):\n        # 生成候选解\n        candidates\
      \ = neighborhood_func(current_solution)\n\n        # 过滤禁忌解\n        non_tabu_candidates = [c for\
      \ c in candidates if c not in tabu_list]\n\n        # 选择最优候选解\n        best_candidate = max(non_tabu_candidates,\
      \ key=objective_func)\n\n        # 更新当前解和禁忌表\n        current_solution = best_candidate\n      \
      \  tabu_list.append(best_candidate)\n        if len(tabu_list) > tabu_tenure:\n            tabu_list.pop(0)\n\
      \n        if objective_func(best_candidate) > objective_func(best_solution):\n            best_solution\
      \ = best_candidate\n\n    return best_solution\n"
  related_papers: []
  difficulty: 3
  quality_rating: 3
  tags:
    key_concepts:
    - 禁忌搜索算法
    chart_types:
    - '**搜索轨迹图**：解在搜索过程中的变化'
    - '**禁忌表状态**：禁忌对象的变化'
    - '**邻域结构图**：当前解的邻域'
    - '**最优解更新图**：全局最优的更新过程'
    source: math-modeling-skill
  id: mc_61
  formulas:
  - 禁忌表更新：T \leftarrow (T \setminus \{x_{old}\}) \cup \{x_{new}\}，其中 T 为禁忌表，x_{old} 为移出禁忌的对象，x_{new} 为加入禁忌的对象。
  - 禁忌长度约束：x \in T \text{ 在 } \tau \text{ 次迭代内被禁止}，其中 \tau 为禁忌长度，表示对象被禁忌的迭代次数。
  - 候选解选择：x_{next} = \arg\max_{x \in N(x_{current}) \setminus T} f(x)，其中 N(x_{current}) 为当前解的邻域，f 为目标函数。
  - 特赦规则：若 f(x) > f(x_{best}) 且 x \in T，则允许 x 被选中，其中 x_{best} 为当前最优解。
