  unit_id: modeler_pca_01
  content_md: |
    # 主成分分析(PCA)

    > **难度**:进阶 · **预计学习时长**:50 分钟 · **主讲智能体**:🧩 建模手 · **方法类别**:降维与统计

    ## 🎯 学习目标

    学完本单元,你应该能够:

    - 说清 PCA 的目标:用少数几个「主成分」方向保留原始数据尽可能多的方差
    - 手工完成小数据集的 PCA 全流程:中心化 → 协方差矩阵 → 特征分解 → 投影
    - 解释方差贡献率、累计方差解释率与「选前 $k$ 个主成分」的依据(碎石图)
    - 判断何时必须先**标准化**(相关矩阵)再 PCA,何时可直接用协方差矩阵
    - 用 PCA 做降维可视化、去相关 / 共线性、综合评价,并清楚它的局限(线性、无监督)

    ## 📖 核心概念

    ### 1. 为什么要降维

    高维数据带来三个麻烦:**可视化**难(人只能看 2~3 维)、**多重共线性**(变量间高度相关,回归系数不稳定)、**噪声与冗余**(部分维度几乎不含信息)。降维的目标是:找少数几个**新变量**(原始变量的线性组合),让它们保留原始数据的「大部分信息」。

    PCA 对「信息」的度量是**方差**——方差大的方向数据「散得开」、区分度高;方差接近零的方向,数据几乎挤在一起,丢掉也不可惜。

    ### 2. PCA 的两种等价视角

    - **最大方差视角(Hotelling)**:找第一个方向 $w_1$,使数据投影后的方差最大;再在与 $w_1$ 正交的方向里找方差最大者 $w_2$;以此类推
    - **最小重构误差视角(Pearson)**:找 $k$ 维线性子空间,使数据到该子空间的投影误差(残差平方和)最小

    两种定义的解完全相同:**主成分方向就是协方差矩阵的特征向量**,按特征值从大到小排列。

    ### 3. 标准流程四步

    1. **中心化**:每个变量减去自己的均值($\bar{x}_j$),使数据中心移到原点
    2. **(必要时)标准化**:若各变量**量纲不同**(身高 cm 与体重 kg),先除以标准差,否则方差大的变量会垄断主成分
    3. **求协方差矩阵**(或相关矩阵):$S = \frac{1}{n}X^T X$($X$ 为 $n \times p$ 中心化数据)
    4. **特征分解**:$S = W \Lambda W^T$,特征值从大到小排序,取前 $k$ 个特征向量作主成分方向;**得分** $Z = X W_k$

    ### 4. 主成分怎么「解释」

    - **载荷(loading)**:第 $j$ 个主成分方向上各原始变量的系数 $w_{ij}$,表示该成分是哪些变量的组合;载荷绝对值大的变量是该成分的「主角」
    - **方差解释率**:$\lambda_i / \sum_j \lambda_j$,第 $i$ 个主成分解释了多少比例的总方差
    - **双标图(biplot)**:把样本得分与变量载荷画在同一张散点图上,一眼看出「样本沿什么变量分化」

    ### 5. 选 $k$ 的三种依据

    - **累计方差解释率**:前 $k$ 个成分累计解释 80%~90% 以上(最常用,须在论文中报告)
    - **碎石图拐点**:特征值随序号的折线图,取「陡峭变平缓」的拐点前
    - **Kaiser 准则**:特征值 $\geq 1$(只适用于相关矩阵,即标准化后的数据)

    ## 🧮 公式与结论

    **主成分的优化定义**(第一主成分):

    $$\max_{w}\ w^T S w \quad \text{s.t.} \quad w^T w = 1 \quad \Rightarrow \quad S w = \lambda w$$

    用拉格朗日乘子法立得:目标取最大时 $w$ 是 $S$ 的最大特征值对应的**单位特征向量**,最大投影方差恰为 $\lambda_1$。

    **核心结论**:

    $$S = W \Lambda W^T, \qquad \lambda_1 \geq \lambda_2 \geq \dots \geq \lambda_p \geq 0$$

    $$第i个主成分解释率 = \frac{\lambda_i}{\sum_{j=1}^p \lambda_j}, \qquad 前k个累计解释率 = \frac{\sum_{i=1}^k \lambda_i}{\sum_{j=1}^p \lambda_j}$$

    $$得分矩阵\ Z = X W_k, \qquad \mathrm{Var}(Z的第j列) = \lambda_j$$

    **两个易混矩阵**:协方差矩阵 $S$(各变量**中心化**后)与相关矩阵 $R$(各变量**标准化**后)。量纲一致用 $S$,量纲不同务必用 $R$。

    **重构误差**:只用前 $k$ 个主成分的残差方差为 $\sum_{j=k+1}^{p} \lambda_j$——被丢掉的「信息量」的精确表达式。

    ## 💡 经典例题

    ### 例题 1:2 维手工 PCA 全流程

    > 4 个样本、2 个指标:$(3, 2),\ (2, 3),\ (-1, 0),\ (0, -1)$。做完整 PCA。

    **第一步:中心化**。均值 $(\bar{x}_1, \bar{x}_2) = (1, 1)$,中心化数据:

    $$X = \begin{bmatrix} 2 & 1 \\ 1 & 2 \\ -2 & -1 \\ -1 & -2 \end{bmatrix}$$

    **第二步:协方差矩阵**(除以 $n = 4$):

    $$S = \frac{1}{4} X^T X = \frac{1}{4}\begin{bmatrix} 10 & 8 \\ 8 & 10 \end{bmatrix} = \begin{bmatrix} 2.5 & 2 \\ 2 & 2.5 \end{bmatrix}$$

    **第三步:特征分解**。解 $|S - \lambda I| = (2.5 - \lambda)^2 - 4 = 0$:

    $$\lambda_1 = 4.5, \qquad \lambda_2 = 0.5$$

    对应特征向量(单位化):$w_1 = \left(\frac{1}{\sqrt{2}}, \frac{1}{\sqrt{2}}\right) \approx (0.707, 0.707)$,$w_2 = \left(-\frac{1}{\sqrt{2}}, \frac{1}{\sqrt{2}}\right)$。

    **第四步:方差解释率**:

    $$\frac{\lambda_1}{\lambda_1 + \lambda_2} = \frac{4.5}{5} = 90\%, \qquad \frac{\lambda_2}{5} = 10\%$$

    **第五步:得分**(投影 $Z = Xw_1$):

    | 样本 | 原数据 | PC1 得分 | PC2 得分 |
    |------|--------|---------|---------|
    | 1 | (3, 2) | $3/\sqrt{2} = 2.121$ | $-0.707$ |
    | 2 | (2, 3) | $2.121$ | $0.707$ |
    | 3 | (−1, 0) | $-2.121$ | $0.707$ |
    | 4 | (0, −1) | $-2.121$ | $-0.707$ |

    **验证**:PC1 得分的方差恰为 $4.5 = \lambda_1$,PC2 得分的方差恰为 $0.5 = \lambda_2$——主成分把方差「按特征值重新分配」了。

    **解析**:样本 1、2 是「两指标都大」的簇,样本 3、4 是「两指标都小」的簇,PC1(两个指标的等权平均)完美区分这两簇,贡献 90% 方差;PC2(两指标之差)只贡献 10%。注意特征向量的**符号可以整体翻转**($-w_1$ 也是特征向量),解释时看方向不看符号。

    ### 例题 2:鸢尾花数据——降维可视化实战

    > 鸢尾花数据集:150 个样本、4 个指标(花萼长、花萼宽、花瓣长、花瓣宽),3 个品种。用 PCA 降到 2 维并解释。

    **流程**(先标准化,4 个指标量纲虽同为 cm 但方差差异明显):

    | 主成分 | 特征值占比 | 累计解释率 |
    |--------|-----------|-----------|
    | PC1 | 72.96% | 72.96% |
    | PC2 | 22.85% | **95.81%** |
    | PC3 | 3.67% | 99.48% |
    | PC4 | 0.52% | 100% |

    前 2 个主成分保留 95.8% 的方差——4 维数据几乎无损地压到 2 维。

    **载荷矩阵**:

    | 指标 | PC1 | PC2 |
    |------|-----|-----|
    | 花萼长 | $+0.521$ | $+0.377$ |
    | 花萼宽 | $-0.269$ | $+0.923$ |
    | 花瓣长 | $+0.580$ | $+0.025$ |
    | 花瓣宽 | $+0.565$ | $+0.067$ |

    **解析**:PC1 上四个载荷同号且「花瓣」系数的绝对值大——PC1 是**「整体大小」**轴(花大还是花小);PC2 主要由花萼宽主导,是**「形状」**轴(相对花萼宽度)。把 150 个样本画在 PC1–PC2 平面,三个品种自然分成三簇,且 setosa 与其他两类明显分离——这就是 PCA 可视化 + 聚类预处理的标准用法。

    ### 例题 3:综合评价中的「第一主成分打分」

    > 10 个城市、6 个发展指标(全部正向化后),如何给城市综合排名?

    **思路**:标准化后做 PCA,取第一主成分得分作为综合得分。PC1 是「与所有指标都正相关」的方向,天然是综合指标;得分 = 各标准化指标按载荷加权求和:

    $$\text{得分}_i = \sum_{j=1}^{p} w_{1j} \frac{x_{ij} - \bar{x}_j}{s_j}$$

    **解析**:第一主成分法本质是**数据驱动的加权**,权重来自数据的相关性结构(载荷),避免了主观赋权;但它只在「PC1 载荷全正、解释率足够高」时才有意义——若 PC1 只解释 30% 方差,或载荷有正有负,综合打分就要小心。竞赛论文里常见的组合拳:标准化 → PCA 降维 → 熵权法 / TOPSIS 评价(参见《熵权法》《TOPSIS法》单元),PCA 负责「去相关、定权重」,评价模型负责「排名」。

    ## ⚠️ 常见易错点

    1. **量纲不同却不标准化**。身高(cm,方差数千)与体重(kg,方差数百)直接 PCA,第一主成分几乎就是身高,其他变量完全被淹没;量纲不同的数据必须用**相关矩阵**(即先标准化)
    2. **中心化与标准化混为一谈**。中心化只平移(减均值),标准化还缩放(除以标准差);用协方差矩阵必须中心化,用相关矩阵必须标准化
    3. **把特征值 0 当成计算错误**。样本数 $n$ 小于变量数 $p$ 时协方差矩阵秩亏($\text{rank} \leq \min(n-1, p)$),必有零特征值——不是 bug,是数据本身信息量有限;此时可用 SVD 直接对 $X$ 分解
    4. **解释主成分时过度断言**。PCA 是无监督线性方法,主成分是「方差最大方向」,不一定是「有业务意义的方向」;载荷只能说明线性组合关系,不能当因果或因子分析结论
    5. **不报告方差解释率**。只给得分图不给出「前 $k$ 个主成分解释了多少方差」,评审无法判断降维是否有损;选 $k$ 的依据(碎石图 / 累计 85%)必须写进论文
    6. **用 PCA 前不做异常值处理**。方差对离群点极敏感,一个异常样本就能把主成分方向「拽歪」;先做异常检测或稳健 PCA

    ## ✏️ 自测练习(选择题)

    **第 1 题** 关于「做 PCA 之前是否必须标准化」,下列说法**正确**的是:

    A. 不是必须。各变量量纲一致且方差量级相近时可只做中心化、用协方差矩阵;量纲不同(如身高与体重)或方差悬殊时必须先标准化、用相关矩阵
    B. 必须。任何数据在 PCA 前都要标准化到均值 0、方差 1
    C. 不需要。PCA 对量纲不敏感,标准化与否不影响结果
    D. 只需中心化;标准化会破坏数据信息,PCA 中不应使用

    <details><summary>查看答案与解析</summary>
    **答案:A**。PCA 对「信息」的度量是方差:若直接对量纲不同的变量(身高 cm 方差数千 vs 体重 kg 方差数百)做 PCA,第一主成分几乎就是身高,其他变量被彻底淹没。原则:想保留各变量的「绝对差异」就用协方差矩阵(仅中心化);想一视同仁就用相关矩阵(先标准化)。选项 B 把「视情况」绝对化;选项 C 否认了量纲对结果的决定性影响(同一份数据,协方差 PCA 与相关 PCA 可以给出完全不同的主成分);选项 D 说反了——标准化是 PCA 的**常规**预处理,「破坏信息」的顾虑只有在刻意保留方差差异时才成立,且此时也应说明理由。
    </details>

    **第 2 题** 某数据中心化后的协方差矩阵为 $S = \begin{bmatrix} 2.5 & 2 \\ 2 & 2.5 \end{bmatrix}$。求特征值、第一主成分方向与方差解释率:

    A. $\lambda_1 = 4.5$,$\lambda_2 = 0.5$;PC1 方向 $(1/\sqrt{2},\ 1/\sqrt{2})$;解释率 90% 与 10%
    B. $\lambda_1 = 2.5$,$\lambda_2 = 2$;PC1 方向 $(1,\ 1)$;解释率 55.6% 与 44.4%
    C. $\lambda_1 = 4.5$,$\lambda_2 = 0.5$;PC1 方向 $(1/\sqrt{2},\ -1/\sqrt{2})$;解释率 90% 与 10%
    D. $\lambda_1 = 4.5$,$\lambda_2 = 0.5$;PC1 方向 $(1/\sqrt{2},\ 1/\sqrt{2})$;解释率 10% 与 90%

    <details><summary>查看答案与解析</summary>
    **答案:A**。解特征方程 $|S - \lambda I| = (2.5-\lambda)^2 - 4 = 0$,得 $\lambda = 2.5 \pm 2$,即 $\lambda_1 = 4.5$、$\lambda_2 = 0.5$。大特征值 4.5 对应方向:$(S - 4.5I)w = 0$ 给出 $w \propto (1, 1)$,单位化得 $(1/\sqrt{2}, 1/\sqrt{2})$。解释率:$\frac{4.5}{4.5+0.5} = 90\%$ 与 $\frac{0.5}{5} = 10\%$。干扰项:选项 B 把**对角元**直接当特征值(忘记非对角元 2 的贡献)——只在对角阵时才成立;选项 C 拿成了第二(小)特征值对应的特征向量(主成分按特征值降序取,方向拿反);选项 D 把两个主成分的解释率对调(大特征值对应大解释率)。注意特征向量符号可整体翻转,$(-1/\sqrt{2},-1/\sqrt{2})$ 也是 PC1 方向。
    </details>

    **第 3 题** 关于「选择保留前 $k$ 个主成分」的依据,下列说法**正确**的是:

    A. 常用依据:累计方差解释率达到 80%~90%、碎石图的「陡峭转平缓」拐点、Kaiser 准则(特征值 $\ge 1$,仅适用于标准化后的相关矩阵)
    B. 恒取 $k = 2$,因为二维图最好展示,与解释率无关
    C. 必须保留全部主成分,丢弃任何成分都会损失信息
    D. 只看第一个特征值是否大于 1 即可

    <details><summary>查看答案与解析</summary>
    **答案:A**。选 $k$ 的三种标准依据:①**累计方差解释率**(前 $k$ 个成分累计解释 80%~90% 以上,最常用,须在论文中报告);②**碎石图拐点**(特征值随序号折线的「陡峭转平缓」处);③**Kaiser 准则**(特征值 ≥1)——注意它只在标准化数据(相关矩阵)下有意义,因为相关矩阵的对角元全是 1、总方差等于变量数,特征值 1 是「平均水平」。选项 B 把展示方便当成了选 $k$ 的依据(若前两个主成分只解释 30% 方差,降到 2 维会严重失真);选项 C 否认了降维的价值(丢弃的残差方差恰为 $\sum_{j=k+1}^{p}\lambda_j$,小特征值方向往往只是噪声);选项 D 是 Kaiser 准则的残缺版(该准则要求**所有**保留成分的特征值都 ≥1,而不是只看第一个)。
    </details>

    ## 🏆 竞赛实战链接

    - **出镜频率**:国赛 C 题的综合评价、B 题的多指标数据处理,美赛大数据题(如音乐影响、新闻主题)都常见「标准化 → PCA 降维 → 聚类 / 评价」的标准管线;PCA 也用于**消除多重共线性**后再回归
    - **论文加分点**:①报告**碎石图 + 累计方差解释率表**说明选 $k$ 的依据;②给出**载荷表并解释每个主成分的业务含义**(这是从「套算法」到「做分析」的分水岭);③画**双标图**或主成分散点图(按类别着色),一图胜千言;④与 t-SNE、因子分析对比,说明为什么这里选 PCA(线性、可解释)
    - **工具**:`sklearn.decomposition.PCA`(首选)、`numpy.linalg.eigh`(原理复现)、`matplotlib` 画碎石图与双标图

    ## 💻 代码实现

    ```python
    import numpy as np

    # 1. 手工 PCA 复现例题 1 (numpy 全流程)
    X = np.array([[3.0, 2.0], [2.0, 3.0], [-1.0, 0.0], [0.0, -1.0]])
    Xc = X - X.mean(axis=0)  # 中心化
    S = Xc.T @ Xc / len(Xc)  # 协方差矩阵
    w, V = np.linalg.eigh(S)  # 特征分解
    idx = np.argsort(w)[::-1]  # 特征值降序
    w, V = w[idx], V[:, idx]
    scores = Xc @ V  # 主成分得分
    print("协方差矩阵 S:\n", S)
    print("特征值:", w)  # [4.5 0.5]
    print("PC1 方向:", V[:, 0])  # [0.7071 0.7071]
    print("方差解释率:", w / w.sum())  # [0.9 0.1]
    print("得分:\n", np.round(scores, 4))

    # 2. sklearn 做鸢尾花 PCA (例题 2)
    from sklearn.datasets import load_iris
    from sklearn.decomposition import PCA
    from sklearn.preprocessing import StandardScaler

    X_iris = StandardScaler().fit_transform(load_iris().data)  # 先标准化
    pca = PCA(n_components=2).fit(X_iris)
    print("解释率:", np.round(pca.explained_variance_ratio_, 4))  # [0.7296 0.2285]
    print("累计:", round(pca.explained_variance_ratio_.sum(), 4))  # 0.9581
    print("载荷(主成分×原始指标):\n", np.round(pca.components_, 4))
    ```

    > 手工版输出与例题 1 全部吻合:特征值 4.5 / 0.5,解释率 90% / 10%,PC1 方向 $(0.707, 0.707)$。sklearn 版输出解释率 72.96% + 22.85% = 95.81%,载荷与例题 2 表格一致。注意 sklearn 的 `components_` 行是主成分、列是原始指标。

    ## 📚 延伸阅读

    - **经典书**:Jolliffe, *Principal Component Analysis* —— PCA 的权威专著;Hastie 等《统计学习导论》(ESL)第 14 章
    - **教材**:李航《统计学习方法》第 16 章主成分分析;茆诗松《概率论与数理统计教程》多元部分
    - **实战**:[sklearn PCA 文档](https://scikit-learn.org/stable/modules/generated/sklearn.decomposition.PCA.html)
    - **拓展**:核 PCA(非线性)、稀疏 PCA(载荷稀疏化)、因子分析(PCA 的统计模型近亲)、t-SNE / UMAP(可视化专用非线性降维)
    - **进阶关联**:学完本单元 → 接着学《熵权法》(主观性更小的另一种赋权)→ 《TOPSIS法》(综合评价框架)→ 《线性回归》(用主成分回归消除共线性)→ 《神经网络预测》(深度学习时代的非线性降维)

    ## 🧠 小结

    1. PCA 的目标:找方差最大的正交方向,用前 $k$ 个主成分保留大部分信息;主成分 = 协方差矩阵的特征向量,特征值 = 该方向的方差
    2. 流程四步:中心化 →(必要时)标准化 → 协方差 / 相关矩阵 → 特征分解取前 $k$ 个;得分 = 数据在特征向量上的投影
    3. 方差解释率 $\lambda_i / \sum\lambda_j$ 是 PCA 的「成绩单」:选 $k$ 看累计解释率(≥80%~90%)与碎石图拐点
    4. 量纲不同必须标准化(相关矩阵),否则方差大的变量垄断主成分;样本数少于变量数用 SVD
    5. 经典用法:降维可视化、去共线性、数据驱动赋权(第一主成分打分);局限:线性、无监督、对方差异常敏感
