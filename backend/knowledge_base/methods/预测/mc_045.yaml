method_card:
  id: mc_045
  name: 灰色关联分析
  name_en: Grey Relational Analysis
  category:
  - 评价
  - 统计
  principle: 灰色关联分析是一种根据因素之间发展态势的相似或相异程度来衡量因素间关联程度的方法。其核心思想是：几何形状越接近，关联程度越大。该方法通过计算比较数列与参考数列在各时刻的关联系数，再求平均值得到关联度，从而判断各因素对系统行为的影响大小。它不要求大样本和典型的分布规律，计算量小，适用于信息不完全、数据有限的灰色系统。
  formulas:
  - name: 关联系数
    latex: $$\xi_i(k) = \frac{\min_s \min_t |x_0(t) - x_s(t)| + \rho \max_s \max_t
      |x_0(t) - x_s(t)|}{|x_0(k) - x_i(k)| + \rho \max_s \max_t |x_0(t) - x_s(t)|}$$
    description: 比较数列x_i对参考数列x_0在k时刻的关联系数，ρ为分辨系数，通常取0.5
  - name: 关联度
    latex: $$r_i = \frac{1}{n} \sum_{k=1}^n \xi_i(k)$$
    description: 比较数列x_i对参考数列x_0的关联度，为各时刻关联系数的平均值
  applicable_when:
  - 数据量较少，无法满足统计方法的大样本要求
  - 数据分布无明显规律或不符合典型分布
  - 需要分析因素间动态关联程度
  - 系统信息不完全，属于灰色系统
  not_applicable_when:
  - 需要精确区分正负关联方向时需额外处理
  - 因素间存在明显非线性关系且需要精确建模时
  - 数据量充足且满足统计方法假设时，统计方法可能更优
  typical_scenarios:
  - 农业经济影响因素分析
  - 运动员专项成绩与训练指标关联分析
  - 宏观经济指标关联分析
  - 水利工程影响因素分析
  common_mistakes:
  - mistake: 未对原始数据进行无量纲化处理，直接计算关联系数
    solution: 计算前应先进行初值化、均值化等数据变换，消除量纲影响
  - mistake: 忽略指标的正负向差异，如时间越短越好的指标未做逆向化处理
    solution: 对于数值越小越好的指标，应取倒数或采用其他方式使方向一致
  code_snippets:
  - language: python
    description: 灰色关联分析计算示例
    code: "import numpy as np\n\ndef grey_relational_analysis(ref_seq, comp_seqs,\
      \ rho=0.5):\n    \"\"\"\n    灰色关联分析\n    ref_seq: 参考数列 (1D array)\n    comp_seqs:\
      \ 比较数列 (2D array, 每行一个比较数列)\n    rho: 分辨系数\n    \"\"\"\n    ref = np.array(ref_seq)\n\
      \    comps = np.array(comp_seqs)\n    m, n = comps.shape\n    \n    # 计算差序列\n\
      \    diff = np.abs(comps - ref)\n    \n    # 两级最小差和最大差\n    min_diff = np.min(diff)\n\
      \    max_diff = np.max(diff)\n    \n    # 计算关联系数\n    ksi = (min_diff + rho\
      \ * max_diff) / (diff + rho * max_diff)\n    \n    # 计算关联度\n    r = np.mean(ksi,\
      \ axis=1)\n    return r"
