    - 梯度下降
    - 矩阵乘法
  not_applicable_when:
  - 训练样本很少且噪声大，容易过拟合
  - 要求得到全局最优解或严格的解释性模型
  - 数据规模很大且算力或时间受限，BP收敛较慢
  - 需要处理序列上下文时，简单前馈BP网络不适合
