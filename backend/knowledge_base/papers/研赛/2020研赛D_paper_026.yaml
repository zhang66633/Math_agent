paper:
  id: paper_026
  year: 2020
  competition: 研赛
  problem_id: D
  title: 汽油辛烷值优化建模
  tags:
    problem_type:
    - 优化
    - 预测
    - 综合
    core_models:
    - 互信息非线性相关分析
    - 遗传算法-BP神经网络降维
    - BP神经网络预测
    - 小波神经网络
    - 粒子群优化算法
    techniques:
    - 皮尔逊相关分析
    - 偏相关分析
    - 拉依达准则(3σ)
    - 最大最小限幅
    - 轮盘赌选择
    - 单点交叉
    - 单点变异
    - Morlet小波
    - Levenberg-Marquardt算法
  problem_ref: ''
  problem_context: 汽油燃烧产生的尾气排放对大气环境有重要影响，汽油清洁化的重点是降低汽油中的硫、烯烃含量，同时尽量保持其辛烷值。然而汽油精制工艺是一个多变量的强非线性、强耦联性的复杂系统。某石化企业的催化裂化汽油精制脱硫装置运行4年，积累了大量历史数据。题目提供了325个样本数据，涉及367个变量（包括7个原料性质、2个待生吸附剂性质、2个再生吸附剂性质、2个产品性质以及354个操作变量）。由于操作变量每3分钟采样一次，而辛烷值一周仅测量2次，预处理中取操作变量两小时内的平均值与辛烷值测量值对应。问题要求：(1)依据'样本确定方法'对285号和313号样本进行预处理并加入附件一；(2)通过降维方法从367个变量中筛选出建模主要变量，使之具有代表性和独立性；(3)建立辛烷值损失预测模型并进行验证；(4)在保证产品硫含量不大于5μg/g的前提下，优化主要变量操作方案，使辛烷值损失降幅大于30%；(5)对133号样本以图形展示主要操作变量优化调整过程中辛烷值和硫含量的变化轨迹。
  methodology_chain:
  - '数据预处理: 依据''样本确定方法''对285号和313号样本进行整定，利用最大最小限幅剔除4个异常操作变量，利用拉依达准则(3σ)剔除4个异常样本，最终得到321个样本×364个变量的数据文件'
  - '线性相关分析: 对361个自变量与产品辛烷值做皮尔逊简单相关分析和偏相关分析，发现原料辛烷值与产品辛烷值相关系数达0.973，确定为第一个主要变量'
  - '互信息非线性降维: 计算各自变量与因变量的互信息值并排序，依次剔除自变量间相关系数大于0.5的冗余变量，最终筛选出15个主要变量'
  - '遗传算法-BP神经网络降维验证: 对28个候选变量进行二进制编码，以BP网络均方误差倒数为适应度，经100代遗传算法寻优得到14个最优变量组合，与模型一对比验证'
  - 'BP神经网络预测建模: 基于15个主要变量，分别建立单隐含层(9节点)和双隐含层(9-5节点)BP神经网络预测产品辛烷值，双隐含层误差在(-0.4%, 0.35%)之间'
  - '小波神经网络优化: 用Morlet小波基函数替代Sigmoid函数，建立小波神经网络预测模型，预测误差在(-0.15%, 0.3%)之间'
  - '硫含量预测建模: 剔除硫含量异常样本(3.2μg/g出现190次)，建立BP神经网络预测产品硫含量'
  - '粒子群寻优优化: 以BP神经网络预测模型为适应度函数，建立基于粒子群算法的操作变量优化模型，设定目标辛烷值损失区间为(0.5, 0.7)，最大迭代40次'
  - '可视化展示: 对133号样本，存储优化过程中粒子位置和速度矩阵，倒推操作变量调整轨迹，展示辛烷值和硫含量的变化过程'
  key_formulas:
  - name: 皮尔逊相关系数
    latex: r = \frac{\sum_{i=1}^{n}(x_i - \bar{x})(y_i - \bar{y})}{\sqrt{\sum_{i=1}^{n}(x_i
      - \bar{x})^2}\sqrt{\sum_{i=1}^{n}(y_i - \bar{y})^2}}
    description: 计算两个变量间的线性相关性，用于简单相关分析筛选与产品辛烷值线性相关的变量
  - name: 一阶偏相关系数
    latex: r_{ij\cdot h} = \frac{r_{ij} - r_{ih}r_{jh}}{\sqrt{(1-r_{ih}^2)(1-r_{jh}^2)}}
    description: 在控制第三个变量影响的条件下，分析两个变量间的净线性相关性
  - name: 信息熵
    latex: H(X) = -\sum_{x \in X} p(x)\log p(x)
    description: 度量随机变量X的不确定性程度，是互信息计算的基础
  - name: 互信息
    latex: I(X;Y) = H(X) - H(X|Y) = \sum_{x \in X}\sum_{y \in Y} p(x,y)\log\frac{p(x,y)}{p(x)p(y)}
    description: 量化两个随机变量之间的相互关联程度，可同时反映线性和非线性关系，用于非线性降维
  - name: 拉依达准则(3σ)
    latex: \sigma = \left[\frac{1}{n-1}\sum_{i=1}^{n}v_i^2\right]^{1/2} = \left\{\left[\sum_{i=1}^{n}x_i^2
      - \left(\sum_{i=1}^{n}x_i\right)^2/n\right]/(n-1)\right\}^{1/2}
    description: 计算标准差，将剩余误差绝对值超过3σ的样本视为异常值予以剔除
  - name: Sigmoid传递函数
    latex: f(x) = \frac{1}{1+\exp[-(x+\theta)/\theta_0]}
    description: BP神经网络隐含层的激活函数，实现非线性映射
  - name: BP网络误差函数
    latex: E(\omega,b) = \frac{1}{2}\sum_{k=1}^{s}(t_k - b_k)^2
    description: 衡量网络输出与期望输出的差异，用于反向传播调整权值和阈值
  - name: 遗传算法适应度函数
    latex: f_i = \frac{1}{\sum_{i=1}^{n}(y_i - \hat{y}_i)^2}
    description: 以BP网络预测误差平方和的倒数作为适应度，适应度越高表示该变量组合预测效果越好
  - name: 轮盘赌选择概率
    latex: p_i = \frac{f_i}{\sum_{i=1}^{N}f_i}
    description: 基于适应度比例的选择策略，适应度高的个体被选中概率更大
  - name: Morlet小波函数
    latex: \psi(t) = Ce^{-t^2/2}\cos(5t)
    description: 小波神经网络的基函数，替代Sigmoid函数以增强函数逼近能力
  - name: 小波基函数族
    latex: \psi_{a,b}(t) = \frac{1}{\sqrt{a}}\psi\left(\frac{t-b}{a}\right)
    description: 通过伸缩因子a和平移因子b对母小波进行变换，对应网络权值和阈值
  - name: 粒子群目标函数
    latex: F = RON损失_{调整值}(x) - RON损失_{目标值}
    description: 优化目标为最小化调整后辛烷值损失与目标损失值(0.5-0.7)的偏差
  algorithm_outline:
  - language: python
    description: 基于互信息的非线性相关分析降维算法
    code: "# 1. 数据标准化\nX_std = zscore(X)\n# 2. 计算每个自变量与因变量的互信息值\nMI = [mutual_info(X_std[:,i],\
      \ y) for i in range(n_features)]\n# 3. 按互信息值从大到小排序\nsorted_idx = argsort(MI)[::-1]\n\
      # 4. 依次筛选变量，剔除与已选变量相关系数>0.5的变量\nselected = [sorted_idx[0]]\nfor idx in sorted_idx[1:]:\n\
      \    if all(abs(corrcoef(X_std[:,idx], X_std[:,s])) <= 0.5 for s in selected):\n\
      \        selected.append(idx)\n# 5. 取前15个变量作为主要变量\nmain_vars = selected[:15]"
  - language: python
    description: 遗传算法-BP神经网络降维算法
    code: "# 1. 初始化种群：50个28位二进制串\npopulation = random_binary(pop_size=50, n_bits=28)\n\
      # 2. 迭代优化\nfor gen in range(100):\n    for individual in population:\n     \
      \   # 根据二进制编码选择变量\n        selected_vars = [v for v, bit in zip(candidates,\
      \ individual) if bit == 1]\n        # 用BP神经网络计算预测误差\n        mse = train_and_evaluate_bp(X[:,\
      \ selected_vars], y)\n        # 适应度 = 1/MSE\n        fitness = 1.0 / mse\n \
      \   # 3. 轮盘赌选择 + 最优保留\n    population = roulette_selection(population, fitness)\n\
      \    # 4. 单点交叉\n    population = single_point_crossover(population, pc=0.8)\n\
      \    # 5. 单点变异\n    population = single_point_mutation(population, pm=0.01)\n\
      # 6. 输出最优二进制编码对应的变量组合\nbest_vars = decode(best_individual)"
  - language: python
    description: 基于BP神经网络预测的粒子群寻优算法
    code: "# 1. 初始化粒子群\nfor i in range(40):  # 种群规模40\n    pop[i] = current_sample_values\
      \  # 位置=当前样本变量值\n    pop[i][0] = raw_RON  # 原料辛烷值不变\n    for j in range(1, 15):\n\
      \        pop[i][j] = delta[j] if random() > 0.5 else -delta[j]  # 速度初始化\n# 2.\
      \ 迭代优化\nfor gen in range(40):  # 最大迭代40次\n    for i in range(40):\n        #\
      \ 计算适应度\n        ron_loss = BP_predict(pop[i])\n        sulfur = BP_sulfur_predict(pop[i])\n\
      \        if ron_loss not in (0.5, 0.7) or sulfur > 4:\n            fitness[i]\
      \ = large_penalty\n        else:\n            fitness[i] = abs(ron_loss - target)\n\
      \        # 更新个体最优和全局最优\n        if fitness[i] < pbest_fitness[i]:\n        \
      \    pbest[i] = pop[i]\n        if fitness[i] < gbest_fitness:\n           \
      \ gbest = pop[i]\n        # 速度更新\n        for j in range(1, 15):\n         \
      \   v[i][j] = delta[j] if random() > 0.5 else -delta[j]\n        # 位置更新\n  \
      \      pop[i][j] += v[i][j]\n        # 边界处理\n        pop[i][j] = clip(pop[i][j],\
      \ popmin[j], popmax[j])"
  assumption_analysis:
  - '假设1: 测量数据都是真实数据，存在各种可能的误差 → 合理。工业数据必然包含测量噪声，该假设为后续数据清洗提供了理论基础。放松此假设则需引入更复杂的鲁棒估计方法。'
  - '假设2: 操作变量的取值范围完全参照附件四 → 合理但保守。附件四给出了工艺操作范围，但实际生产中可能有更严格的约束。放松后可能导致优化结果不可行。'
  - '假设3: 任意操作变量一次调整的幅度只能是±Δx_i → 简化假设。实际中调整幅度可能连续变化，但该假设使优化问题离散化，降低了求解难度。放松后需改用连续优化方法。'
  - '假设4: 任意操作变量每次正向或负向调整方向的概率是50% → 简化假设。实际中操作员有经验偏好，但该假设使粒子群初始化更均匀。放松后需引入先验知识。'
  - '假设5: 操作变量按照与采集频率相同的频率进行调整，即1次/3min → 合理。与数据采集频率一致，且40次调整对应2小时窗口，符合工艺实际。'
  reusable_patterns:
  - '可复用模式1: 线性+非线性双重降维策略——先用皮尔逊相关和偏相关分析筛选线性相关变量，再用互信息理论捕捉非线性关系，最后通过变量间相关性检验保证独立性。适用于任何高维非线性系统的特征选择问题。'
  - '可复用模式2: 双模型交叉验证降维——用互信息方法（模型一）和遗传算法-BP神经网络（模型二）分别降维，对比两者结果的重合度来验证变量选择的合理性。这种交叉验证思路可迁移到任何特征选择场景。'
  - '可复用模式3: 神经网络预测+智能优化算法的组合框架——先用BP神经网络建立预测模型，再将预测模型作为粒子群/遗传算法的适应度函数进行寻优。这是''代理模型+优化''的经典范式，适用于无法解析表达目标函数的优化问题。'
  - '可复用模式4: 逐步调整的可视化优化轨迹——在优化过程中存储每步的粒子位置和速度，倒推操作变量的调整轨迹，并展示目标指标的变化过程。适用于需要展示优化过程合理性的工业应用场景。'
  - '可复用模式5: 多模型对比选优策略——建立单隐含层BP、双隐含层BP、小波神经网络三种预测模型，从预测精度和误差分布均匀性两个维度综合评判，而非仅看精度指标。这种多维度评价思路值得借鉴。'
  common_pitfalls:
  - mistake: 在数据预处理阶段，直接删除所有超出限幅的样本，导致样本量大幅减少
    solution: 应区分异常样本数和异常变量数：对于异常样本数多的变量（如超过42%样本异常）应删除该变量，对于异常样本数少的变量（如仅1-10个样本异常）应保留变量而剔除个别异常样本
  - mistake: 互信息降维时只按互信息值排序选取前k个变量，忽略了变量间的冗余性
    solution: 在按互信息值排序后，需依次计算候选变量与已选变量的相关系数，若相关系数>0.5则剔除该候选变量，确保所选变量既具有代表性又具有独立性
  - mistake: BP神经网络训练时未固定随机种子，导致每次运行结果不一致
    solution: 论文采用了重复100次选取训练集/测试集并取平均误差的方法来降低随机性影响，同时可通过设置随机种子或多次交叉验证来保证结果可复现
  - mistake: 粒子群优化中直接使用原始变量值作为粒子位置，未考虑操作变量的可调整范围约束
    solution: 应结合附件四给出的操作范围，计算每个变量的可调整上下限（当前值±40×Δx_i），并在位置更新后进行边界裁剪
  - mistake: 仅用预测精度选择模型，忽略了误差分布的均匀性
    solution: 论文发现小波神经网络精度最高但双隐含层BP网络误差分布更均匀，最终选择了后者。选择模型时应综合考虑精度、稳定性、泛化能力等多个维度
  difficulty: 3
  difficulty_level: hard
  analysis:
    problem_summary: 在保证汽油产品硫含量达标的前提下，通过数据驱动方法建立辛烷值损失预测模型并优化操作变量，使辛烷值损失降幅超过30%
    key_assumptions:
    - 测量数据真实但存在误差
    - 操作变量范围参照附件四
    - 单步调整幅度为±Δx_i
    - 调整方向概率各50%
    - 调整频率为1次/3min，最多40次
    decision_variables: 15个主要变量中的14个操作变量（原料辛烷值RON作为原料属性不参与优化），记为x_i, i=2,3,...,15
    objective: 最小化调整后辛烷值损失与目标损失值(0.5, 0.7)的偏差，即min F = RON损失_调整值(x) - RON损失_目标值
    constraints: (1)产品硫含量 ≤ 5μg/g（实际加强为≤4μg/g以弥补预测精度不足）；(2)各操作变量在附件四规定的可调范围内；(3)调整后产品辛烷值
      < 原料辛烷值；(4)最多调整40次，单步幅度为±Δx_i
  model:
    approach: 论文采用'先降维后建模再优化'的整体思路。首先对原始数据进行严格预处理（限幅筛选+3σ准则），得到321个样本×364个变量的干净数据。然后采用两种降维方法并行：模型一基于互信息的非线性相关分析，先做线性相关分析确定原料辛烷值为强相关变量，再对剩余变量计算互信息值并剔除冗余变量，最终选出15个主要变量；模型二基于遗传算法-BP神经网络，用二进制编码表示变量组合，以BP网络预测误差倒数为适应度进行寻优，得到14个变量。对比两模型结果，选择模型一的15个变量。接着建立BP神经网络预测模型（单隐含层、双隐含层）和小波神经网络三种预测模型进行对比，选定双隐含层BP网络作为最终预测模型。最后以BP网络预测模型为适应度函数，建立粒子群寻优算法优化操作变量，在硫含量约束下使辛烷值损失最小化。
    innovation: 最突出的创新点在于：(1)将互信息理论引入汽油精制过程的非线性降维，同时结合线性相关分析和偏相关分析，实现了线性+非线性的双重筛选；(2)设计了遗传算法-BP神经网络降维模型作为互信息方法的交叉验证，通过两模型结果的重合度验证变量选择的合理性；(3)将粒子群算法进行针对性改造（速度取±Δx_i、原料辛烷值速度固定为0），使其适配工业操作变量逐步调整的实际约束。
    solution_method: 使用MATLAB软件实现全部算法，包括：SPSS和MATLAB进行相关分析，MATLAB实现互信息计算、遗传算法、BP神经网络（newff函数）、小波神经网络和粒子群优化算法。BP网络采用Levenberg-Marquardt训练算法，隐含层用Tansig函数，输出层用Purelin函数。
  evaluation:
    strengths:
    - 数据预处理严谨，严格按照'样本确定方法'的五点要求逐步处理，每一步都有明确的判断依据
    - 降维方法设计巧妙，线性+非线性双重筛选，且用两种独立方法交叉验证，保证了变量选择的代表性和独立性
    - 预测模型对比充分，建立了三种模型（单隐含层BP、双隐含层BP、小波神经网络），从精度和误差分布两个维度综合评价
    - 粒子群算法针对问题特点进行了合理改造，如原料辛烷值速度固定为0、速度取±Δx_i等，贴合工业实际
    - 问题五的可视化展示清晰直观，用红绿黑方块图展示操作变量调整过程，用双轴图展示辛烷值和硫含量变化轨迹
    weaknesses:
    - 遗传算法-BP神经网络降维模型仅对28个预筛选变量进行优化，未将所有364个变量纳入搜索，可能遗漏全局最优变量组合
    - 硫含量预测模型精度一般，论文也承认'预测效果一般'，仅通过加强约束（≤4μg/g）来弥补
    - 未讨论主要变量个数对预测精度的影响，15个变量的选择存在一定主观性
    - BP神经网络训练存在随机性，虽然重复100次取平均，但未报告标准差或置信区间
    - 问题四中目标区间(0.5, 0.7)的设定依据不够充分，仅参照同类装置最小损失值0.6个单位
    lessons: 这篇论文展示了处理高维非线性工业数据的完整方法论：从严格的数据清洗，到线性+非线性的双重降维，再到多模型对比预测，最后用智能优化算法求解操作方案。最值得学习的是'交叉验证'的思想——用两种独立方法做降维并对比结果，以及'代理模型+优化'的范式——将神经网络预测模型作为优化算法的适应度函数。此外，论文在建模过程中始终紧扣工业实际约束（如调整幅度、调整频率、硫含量限制），使模型具有工程可操作性。
