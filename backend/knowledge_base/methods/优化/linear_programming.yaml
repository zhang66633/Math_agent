    - **进阶关联**:学完本单元 → 接着学 [整数规划与分支定界](modeler_ip_01)(变量离散化)→ [凸优化与KKT条件](modeler_convex_opt)(推广到非线性)

    ## 🧠 小结

    1. LP 三要素:决策变量、目标函数、约束条件;建模先想清楚「控制什么、优化什么、受什么限制」
    2. 标准形式是算法入口:min 目标、等式约束、变量非负;四种化归手法要熟练
    3. 可行域是凸多面体,最优解必在顶点 → 单纯形法只在顶点间移动,检验数决定进基,最小比值决定出基
    4. 对偶 + 互补松弛 + 影子价格,是把「算出来的数」变成「论文里的话」的桥梁
    5. 上机:linprog 一行求解;但**手工会算一张单纯形表**才能理解软件输出、才能在论文里讲清楚模型
