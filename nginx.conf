# nginx 生产环境配置 — 前端静态托管 + /api 反向代理（含 WebSocket 升级）
# 由 docker-compose.yml 的 frontend 服务挂载到 /etc/nginx/conf.d/default.conf；
# 前端构建默认同源（VITE_API_BASE_URL=/api），API 与 WS 均经本文件反代。

upstream backend {
    server backend:8002;   # 对齐 backend/Dockerfile 的 EXPOSE 8002
    keepalive 32;
}

# WebSocket 升级头（Connection 头随 Upgrade 动态变化）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

# 速率限制: 每个 IP 每秒最多 10 个请求, 突发 20
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# 连接数限制: 每个 IP 最多 20 个并发连接
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name _;

    # gzip 压缩（SSE 流式响应不压缩，见 proxy_buffering off）
    gzip on;
    gzip_types text/plain text/css application/javascript text/xml application/xml text/markdown;
    gzip_min_length 256;
    gzip_vary on;

    # 安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    # ── 前端静态文件 ──────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # 静态资源缓存 (带 hash 的 JS/CSS 可长期缓存)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── API 反向代理（含 /api/ws 的 WebSocket 升级）──
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 升级（普通请求时两值为空，不影响）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # SSE 流式响应必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;

        # 速率限制
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 20;

        # 超时 (LLM 调用可能很长; WebSocket 长连接同值)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── 健康检查 ──────────────────────────────────
    location /health {
        proxy_pass http://backend/api/health;
        access_log off;
    }
}
