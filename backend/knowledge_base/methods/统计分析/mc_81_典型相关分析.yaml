    - '**显著性检验图**：各对典型变量的显著性'
    source: math-modeling-skill
  id: mc_81
  formulas:
  - \rho = \frac{a^T \Sigma_{XY} b}{\sqrt{a^T \Sigma_{XX} a \cdot b^T \Sigma_{YY} b}}，其中 \Sigma_{XX}, \Sigma_{YY},
    \Sigma_{XY} 分别为 X 和 Y 的协方差矩阵及互协方差矩阵，a, b 为典型权重向量。
  - \max_{a,b} a^T \Sigma_{XY} b \quad \text{s.t. } a^T \Sigma_{XX} a = 1, \; b^T \Sigma_{YY} b = 1，表示在单位方差约束下最大化两组线性组合的协方差。
  - \Sigma_{XY} \Sigma_{YY}^{-1} \Sigma_{YX} a = \lambda^2 \Sigma_{XX} a，为求解典型权重 a 的特征值问题，\lambda^2 为典型相关系数的平方。
  - \Sigma_{YX} \Sigma_{XX}^{-1} \Sigma_{XY} b = \lambda^2 \Sigma_{YY} b，为求解典型权重 b 的特征值问题。
  - \Lambda = \prod_{i=k}^{m} (1 - \lambda_i^2)，Wilks' Lambda 统计量，用于检验第 k 对及之后典型变量的显著性，m = \min(p, q)。
