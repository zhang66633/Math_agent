  content_md: |
    # TOPSIS理想解逼近法

    > **难度**:入门 · **预计学习时长**:45 分钟 · **主讲智能体**:🧩 建模手 · **方法类别**:综合评价

    ## 🎯 学习目标

    学完本单元,你应该能够:

    - 说清 TOPSIS 的核心思想:同时逼近正理想解、远离负理想解
    - 完成向量规范化、加权、理想解构造、距离与贴近度的全流程计算
    - 区分效益型与成本型指标在理想解构造中的处理差异
    - 用贴近度对方案排序,并解释「贴近度大 = 方案优」
    - 理解权重来源(主观/客观)对结果的影响,并会做权重敏感性分析

    > 前置:权重如何确定是 TOPSIS 的输入问题,建议先学《层次分析法(AHP)》单元与《熵权法与客观赋权》单元。

    ## 📖 核心概念

    ### 1. TOPSIS 的核心思想

    TOPSIS(Technique for Order Preference by Similarity to Ideal Solution)由 Hwang 和 Yoon 于 1981 年提出,是一种**逼近理想解的排序方法**。它的直觉非常朴素:

    - **正理想解**($V^+$):虚构的一个方案,每个指标都取所有方案中的最优值
    - **负理想解**($V^-$):每个指标都取所有方案中的最差值
    - 好的方案应该**离 $V^+$ 越近越好,离 $V^-$ 越远越好**——两者必须同时考虑(只看一个会出错,见易错点 4 与自测练习第 3 题)

    ### 2. 数据:决策矩阵与指标方向

    设 $m$ 个评价对象、$n$ 个指标,决策矩阵 $X = (x_{ij})_{m \times n}$。动手前先给每个指标**标明方向**:

    - **效益型**(正向):越大越好,如就业率、师生比、经费
    - **成本型**(负向):越小越好,如学费、污染浓度、延误时间

    指标方向搞反,结论必然荒谬,这是 TOPSIS 最常见的翻车点。

    ### 3. 规范化:为什么要做

    各指标量纲不同(百分比、比值、万元),不能直接加权相加。常用三种规范化:

    | 方法 | 公式(效益型) | 特点 |
    |------|--------------|------|
    | 向量规范化 | $z_{ij} = \dfrac{x_{ij}}{\sqrt{\sum_i x_{ij}^2}}$ | 经典 TOPSIS 标配,保序 |
    | 极差规范化 | $z_{ij} = \dfrac{x_{ij} - \min_i x_{ij}}{\max_i x_{ij} - \min_i x_{ij}}$ | 落到 [0,1],国赛常见,但分母为 0 时需处理 |
    | 线性比例法 | $z_{ij} = x_{ij} / \max_i x_{ij}$ | 只除最大值,实现最简单 |

    成本型指标的规范化方向相反(如极差法用 $\dfrac{\max_i x_{ij} - x_{ij}}{\max_i x_{ij} - \min_i x_{ij}}$)。本单元采用向量规范化;若用极差法,则正、负理想解自动退化为 $(1,1,\dots,1)$ 与 $(0,0,\dots,0)$。

    ### 4. 权重与加权规范化矩阵

    规范化后乘以权重向量 $w = (w_1,\dots,w_n)$, $\sum w_j = 1$:

    $$v_{ij} = w_j \, z_{ij}$$

    权重是 TOPSIS 的**外部输入**,来源可以是:AHP 等主观赋权(参见《层次分析法(AHP)》单元)、熵权法等客观赋权(参见《熵权法与客观赋权》单元),或二者组合。**权重一变,排序就可能变**——因此敏感性分析不是可选项。

    ### 5. 理想解、距离与贴近度

    $$\begin{aligned} V^+ &= \{ \max_i v_{ij} \mid j \in \text{效益型} \} \cup \{ \min_i v_{ij} \mid j \in \text{成本型} \} \\ V^- &= \{ \min_i v_{ij} \mid j \in \text{效益型} \} \cup \{ \max_i v_{ij} \mid j \in \text{成本型} \} \end{aligned}$$

    $$D_i^+ = \sqrt{\sum_{j=1}^{n} (v_{ij} - v_j^+)^2}, \qquad D_i^- = \sqrt{\sum_{j=1}^{n} (v_{ij} - v_j^-)^2}$$

    $$C_i = \frac{D_i^-}{D_i^+ + D_i^-} \in [0,1]$$

    $C_i$ 称为**贴近度**:方案恰好就是正理想解时 $C = 1$;恰好是负理想解时 $C = 0$。$C_i$ 越大方案越优,按 $C_i$ 降序即为最终排序。

    ## 🧮 公式与结论

    ### 标准流程(六步)

    1. 构造决策矩阵 $X$,标清每个指标方向
    2. 向量规范化:$z_{ij} = x_{ij}\big/\sqrt{\sum_i x_{ij}^2}$
    3. 加权:$v_{ij} = w_j z_{ij}$
    4. 构造 $V^+$、$V^-$(成本型取反方向)
    5. 计算欧氏距离 $D_i^+$、$D_i^-$
    6. 计算贴近度 $C_i = \dfrac{D_i^-}{D_i^+ + D_i^-}$ 并排序

    ### 两个重要性质

    - $C_i$ 对 $V^+$、$V^-$ 的选择**只依赖样本内部**,不依赖绝对标准——TOPSIS 给的是相对优劣,不是绝对好坏
    - 若把某个指标的正负方向同时取反(如把「学费」改成「学费的倒数」再规范),结果会略有差异但通常稳健;**方向只反一半**才是灾难

    ### 常见变体

    - **熵权 TOPSIS**:权重由熵权法给出,主客观结合的「无输入」流程,国赛出镜率最高的组合之一(完整算例见《熵权法与客观赋权》单元)
    - **灰色关联 TOPSIS**:用灰色关联度替代欧氏距离,适合小样本(参见《灰色关联分析》单元)
    - **马氏距离 TOPSIS**:用马氏距离消除指标相关性带来的双重计数,指标高度相关时更合理

    ## 💡 经典例题

    ### 例题 1:高校综合评价(完整手算)

    > 对 4 所高校按 4 项指标评价:就业率(%)、师生比、人均经费(万元)均为效益型,学费(万元)为成本型。权重由 AHP 得到:$w = (0.3,\ 0.2,\ 0.2,\ 0.3)$。
    >
    > $$X = \begin{bmatrix} 95 & 12 & 8 & 5 \\ 88 & 15 & 10 & 6 \\ 90 & 10 & 7 & 4 \\ 92 & 18 & 12 & 8 \end{bmatrix} \quad \text{(行:高校 A1-A4;列:就业率/师生比/经费/学费)}$$

    **第一步:向量规范化。** 列平方和:$(33333,\ 793,\ 357,\ 141)$,列范数 $\sqrt{}$ 得 $(182.573,\ 28.160,\ 18.894,\ 11.874)$。各元素除以列范数:

    $$Z = \begin{bmatrix} 0.5203 & 0.4261 & 0.4234 & 0.4211 \\ 0.4820 & 0.5327 & 0.5293 & 0.5053 \\ 0.4930 & 0.3551 & 0.3705 & 0.3369 \\ 0.5039 & 0.6392 & 0.6351 & 0.6737 \end{bmatrix}$$

    **第二步:加权。** $v_{ij} = w_j z_{ij}$:

    $$V = \begin{bmatrix} 0.1561 & 0.0852 & 0.0847 & 0.1263 \\ 0.1446 & 0.1065 & 0.1059 & 0.1516 \\ 0.1479 & 0.0710 & 0.0741 & 0.1011 \\ 0.1512 & 0.1278 & 0.1270 & 0.2021 \end{bmatrix}$$

    **第三步:理想解。** 前 3 列效益型取最大、第 4 列成本型取最小:

    $$V^+ = (0.1561,\ 0.1278,\ 0.1270,\ 0.1011), \qquad V^- = (0.1446,\ 0.0710,\ 0.0741,\ 0.2021)$$

    **第四步:距离与贴近度。** 以 A1 为例:

    $$\begin{aligned} D_1^+ &= \sqrt{0^2 + (0.0426)^2 + (0.0423)^2 + (0.0253)^2} = \sqrt{0.004246} = 0.0652 \\ D_1^- &= \sqrt{(0.0115)^2 + (0.0142)^2 + (0.0106)^2 + (0.0758)^2} = \sqrt{0.006192} = 0.0787 \end{aligned}$$

    $$C_1 = \frac{0.0787}{0.0652 + 0.0787} = 0.5470$$

    全部结果:

    | 高校 | $D^+$ | $D^-$ | 贴近度 $C$ | 排序 |
    |------|-------|-------|-----------|------|
    | A1 | 0.0652 | 0.0787 | **0.5470** | 2 |
    | A2 | 0.0599 | 0.0694 | **0.5369** | 3 |
    | A3 | 0.0781 | 0.1011 | **0.5643** | 1 |
    | A4 | 0.1012 | 0.0779 | **0.4351** | 4 |

    **结论:A3 > A1 > A2 > A4。**

    **解析**:A4 在师生比与经费两项领先、就业率也排第二,却因学费最贵(成本型指标权重高达 0.3)垫底;A3 的师生比、经费两项都垫底,但学费最低、就业率尚可,凭借成本型指标上的优势综合第一。这正是 TOPSIS 的补偿性:短板可以被长板补偿(距离是逐项平方求和的结构),但**权重大的指标上表现差一定吃亏**。

    ### 例题 2:权重敏感性——等权时结论反转了吗?

    把权重改为等权 $w = (0.25, 0.25, 0.25, 0.25)$ 重算(加权矩阵各元素变为原值的 0.25/0.3、0.25/0.2 等比缩放,理想解相应更新):

    | 高校 | $D^+$ | $D^-$ | $C$ |
    |------|-------|-------|-----|
    | A1 | 0.0780 | 0.0676 | 0.4643 |
    | A2 | 0.0572 | 0.0729 | 0.5603 |
    | A3 | 0.0973 | 0.0843 | 0.4641 |
    | A4 | 0.0843 | 0.0972 | 0.5355 |

    排序变为 **A2 > A4 > A1 > A3**,与例题 1 完全反转!原因:A2 在三项效益型指标上均衡占优,只有当学费权重高时其劣势才被放大。

    **解析**:这个例子示范了竞赛论文的标准动作——**权重敏感性分析**。做法:在合理范围内(如 ±10%、等权、熵权)扰动权重,报告排序的稳定程度。本例中排序对权重高度敏感,结论应表述为「在学费权重不低于 0.3 的偏好下 A3 最优」,而非武断的「A3 最优」。

    ### 例题 3:极差规范化 + 熵权 TOPSIS(流程说明)

    若指标含量纲差异悬殊的数据,可改用极差规范化(成本型取反向),此时 $V^+ = (1,1,1,1)$、$V^- = (0,0,0,0)$,距离公式不变。权重换成熵权法输出,即得到**熵权 TOPSIS**——规范 → 熵权 → 加权 → 理想解 → 贴近度的完整流水线,数值算例见《熵权法与客观赋权》单元。

    ## ⚠️ 常见易错点

    1. **指标方向写反或漏标**。成本型指标(费用、污染、时间)不反向处理,等于奖励最差方案;动手前先在决策矩阵旁标注「+/−」,论文中也要明示
    2. **忘记加权**。规范化后直接算距离,等于默认等权——除非刻意做等权敏感性分析,否则必须乘权重
    3. **只按 $D^+$ 排序**。离正理想解近 ≠ 好,还要看离负理想解远不远(自测练习第 3 题给了一个两者排序相反的实例);$C = D^-/(D^+ + D^-)$ 才是排序依据
    4. **把正理想解当成「绝对标杆」**。$V^+$ 由样本内最优值拼成,不是现实中可实现的目标方案;TOPSIS 输出相对排序,不输出绝对等级
    5. **规范化方法混用**。$V^+$、$V^-$ 的构造方式(取极值 vs 全 1/全 0)取决于规范化方法,极差法下再取样本极值会双重处理;前后必须一致
    6. **指标强相关不处理**。高度相关的两个指标会被重复计数(如「GDP」与「人均收入」),可用主成分分析先降维,或改用马氏距离 TOPSIS

    ## ✏️ 自测练习(选择题)

    **第 1 题** 关于 TOPSIS 中的正理想解 $V^+$,下列说法**正确**的是:

    A. $V^+$ 是由各指标在样本内的最优值拼成的虚构方案,通常没有任何真实评价对象能在所有指标上同时最优
    B. $V^+$ 一定对应样本中某个真实存在的评价对象
    C. $V^+$ 是现实中可以实现的目标方案,可作为绝对标杆使用
    D. 只有当样本量足够大时,$V^+$ 才可能对应真实对象

    <details><summary>查看答案与解析</summary>
    **答案:A**。正理想解是「每个指标都取所有方案最优值」拼出来的参照点——各指标的最优往往分散在不同对象上,所以 $V^+$ 几乎总是一个**虚构方案**,这正是「逼近理想解」中「逼近」二字的含义。由此带来的重要推论:TOPSIS 给出的是样本内部的**相对排序**,不是绝对好坏;换一批对象或换权重,$V^+$ 与排序都可能改变。选项 B 误把参照点当真实方案;选项 C 把相对参照误当绝对标杆;选项 D 把「是否虚构」与样本量挂钩——无论样本多大,「各指标全最优」的对象依然几乎不存在。
    </details>

    **第 2 题** 两个方案、两个指标(均为效益型),决策矩阵 $X = \begin{bmatrix} 4 & 8 \\ 3 & 6 \end{bmatrix}$,取等权。经向量规范化、加权并构造理想解后,两方案的贴近度为:

    A. $C_1 = 1$,$C_2 = 0$
    B. $C_1 = 0$,$C_2 = 1$
    C. $C_1 = C_2 = 0.5$
    D. $C_1 = 0.8$,$C_2 = 0.6$

    <details><summary>查看答案与解析</summary>
    **答案:A**。列范数:$\sqrt{4^2+3^2} = 5$、$\sqrt{8^2+6^2} = 10$,规范化后 $Z = \begin{bmatrix} 0.8 & 0.8 \\ 0.6 & 0.6 \end{bmatrix}$;等权(各 0.5)加权后 $V = \begin{bmatrix} 0.4 & 0.4 \\ 0.3 & 0.3 \end{bmatrix}$。方案 1 两个指标都取到列最大值,它**本身就是**正理想解:$V^+ = (0.4, 0.4)$,故 $D_1^+ = 0$、$D_1^- = \sqrt{0.02}$,$C_1 = \frac{D_1^-}{D_1^+ + D_1^-} = 1$;方案 2 恰是负理想解,$C_2 = 0$。选项 B 把分子分母用反($C = D^+/(D^++D^-)$),是「只盯着离正理想解近」的方向性错误;选项 C 误以为贴近度是两方案之间的相对比例;选项 D 把规范化值直接当成了贴近度——贴近度必须经过距离计算,不能跳步。
    </details>

    **第 3 题** 某评价问题中正理想解 $V^+ = (0, 0)$、负理想解 $V^- = (10, 10)$;方案 A 的加权值为 $(0.5,\ 7)$,方案 B 为 $(4.5,\ 4.5)$。若只按「离正理想解的距离 $D^+$」排序,与按 TOPSIS 贴近度 $C$ 排序,结论分别是:

    A. 只按 $D^+$:B 更优($D_B^+ = 6.364 < D_A^+ = 7.018$);按贴近度:A 更优($C_A = 0.587 > C_B = 0.550$)
    B. 只按 $D^+$:A 更优;按贴近度:B 更优
    C. 两种方式都判定 A 更优
    D. 两种方式都判定 B 更优

    <details><summary>查看答案与解析</summary>
    **答案:A**。先算距离:$D_A^+ = \sqrt{0.5^2 + 7^2} = 7.018$,$D_A^- = \sqrt{(0.5-10)^2 + (7-10)^2} = 9.962$;$D_B^+ = \sqrt{4.5^2 + 4.5^2} = 6.364$,$D_B^- = \sqrt{(4.5-10)^2 + (4.5-10)^2} = 7.778$。只看 $D^+$ 会判 B 优(它离正理想解更近),但贴近度 $C_A = \frac{9.962}{9.962+7.018} = 0.587 > C_B = \frac{7.778}{7.778+6.364} = 0.550$,**A 才是 TOPSIS 的优胜者**。原因:A 在指标 1 上几乎贴着正理想解(0.5 对 0),同时远离负理想解;只看 $D^+$ 丢掉了「远离 $V^-$」这一半信息。这正是 TOPSIS 必须同时使用两个距离、以 $C = D^-/(D^+ + D^-)$ 排序的原因。
    </details>

    ## 🏆 竞赛实战链接

    - **出镜频率**:TOPSIS 与熵权 TOPSIS 是国赛 C/D 类评价与决策题目的「标准答案之一」,也常见于美赛综合评价环节;几乎每年都有论文以它为骨架
    - **论文加分点**:①指标方向表(列出每个指标是效益型还是成本型,并说明规范化方法);②**权重敏感性分析**(等权、±10%、熵权对比,报告排序稳定性);③与 AHP 或熵权法的组合及组合理由;④结果可视化(贴近度柱状图 + 排序表)
    - **常见翻车点**:把成本型指标当效益型;极差规范化后 $V^+$ 仍取样本极值;权重与规范化方法的报告缺失导致不可复算
    - **工具**:numpy 几十行搞定;指标多时先做主成分分析降维再 TOPSIS,可显著提高论文的「技术含量」与可辩护性

    ## 💻 代码实现

    ```python
    import numpy as np

    X = np.array([[95, 12, 8, 5], [88, 15, 10, 6], [90, 10, 7, 4], [92, 18, 12, 8]], dtype=float)
    w = np.array([0.3, 0.2, 0.2, 0.3])
    cost = np.array([False, False, False, True])  # 第 4 列是成本型


    def topsis(X, w, cost):
        # 向量规范化 + 加权
        Z = X / np.sqrt((X**2).sum(axis=0))
        V = Z * w
        # 正/负理想解:成本型取反方向
        Vp = np.array([V[:, j].min() if cost[j] else V[:, j].max() for j in range(X.shape[1])])
        Vn = np.array([V[:, j].max() if cost[j] else V[:, j].min() for j in range(X.shape[1])])
        # 距离与贴近度
        Dp = np.sqrt(((V - Vp) ** 2).sum(axis=1))
        Dn = np.sqrt(((V - Vn) ** 2).sum(axis=1))
        return Dn / (Dp + Dn)


    C = topsis(X, w, cost)
    print("贴近度:", np.round(C, 4))  # [0.547  0.5369 0.5643 0.4351]
    print("排序  :", np.argsort(-C) + 1)  # [3 1 2 4]

    # 敏感性分析:等权
    C_eq = topsis(X, np.ones(4) / 4, cost)
    print("等权贴近度:", np.round(C_eq, 4))  # [0.4643 0.5603 0.4641 0.5355]
    ```

    ## 📚 延伸阅读

    - **原始文献**:Hwang, C.-L., & Yoon, K. (1981). *Multiple Attribute Decision Making: Methods and Applications*. Springer
    - **教材**:司守奎《数学建模算法与应用》第 12 章;知乎/B 站搜索「熵权TOPSIS 手把手」选播放量最高的教程
    - **进阶关联**:参见《熵权法与客观赋权》单元(熵权 TOPSIS 完整数值算例)→ 参见《层次分析法(AHP)》单元(AHP 权重输入)→ 参见《灰色关联分析》单元(灰色关联 TOPSIS 变体)→ 参见《模糊综合评价》单元(定性指标的另一种评价路线)

    ## 🧠 小结

    1. TOPSIS 思想一句话:离正理想解最近、离负理想解最远的方案最优;贴近度 $C = D^-/(D^+ + D^-)$ 同时包含这两个方向
    2. 六步流程:标方向 → 向量规范化 → 加权 → 构造 $V^+/V^-$ → 算距离 → 算贴近度排序;成本型指标在规范化与理想解两个环节都要「反向」
    3. 权重是外部输入,决定了结果的走向;权重敏感性分析是 TOPSIS 论文的标配动作
    4. 贴近度是相对排序而非绝对评分;换样本、换权重、换规范化方法,结论都可能变,如实报告这一点反而是严谨的表现
