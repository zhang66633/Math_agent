paper:
  id: paper_028
  year: 2019
  competition: 研赛
  problem_id: B
  title: 无线智能传播模型
  tags:
    problem_type:
    - 预测
    - 分类
    - 综合
    core_models:
    - Cost231-Hata模型
    - CatBoost
    - 随机森林(RF)
    - Standard Propagation Model (SPM)
    techniques:
    - 特征工程
    - 特征选择(CV/PCC/MIC)
    - 3D射线追踪
    - 机器学习回归
    - 机器学习分类
  problem_ref: ''
  problem_context: 本问题来源于5G网络规划与优化的实际工程场景。随着5G NR技术的商用部署，基站数量急剧增加，网络规划和优化面临巨大挑战。传统的无线传播模型（如Cost231-Hata、Okumura等）虽然计算简单，但精度有限，难以满足5G复杂场景下的覆盖预测需求。而基于射线追踪的确定性模型（如Volcano模型）虽然精度高，但计算复杂度极大，无法在大规模网络中快速应用。因此，如何结合传统经验模型与人工智能技术，构建高精度的无线智能传播模型，成为亟待解决的问题。题目提供了某城市5G基站的实际工程数据，包括基站工参（如天线高度、下倾角、方位角等）、地图数据（如建筑物高度、地物类型等）以及用户端测量的RSRP（参考信号接收功率）数据。要求参赛者完成三个任务：任务1：基于Cost231-Hata模型，结合数字地图数据，对RSRP进行预测，并分析模型误差；任务2：利用机器学习方法（如CatBoost），构建数据驱动的传播模型，预测RSRP，并评估模型精度；任务3：基于预测结果，识别弱覆盖区域（RSRP低于阈值），并给出覆盖优化建议。最终需要提交预测结果、模型代码及分析报告。
  methodology_chain:
  - '数据预处理: 读取基站工参、地图数据和RSRP测量数据，进行数据清洗、缺失值处理和坐标转换'
  - '特征工程: 提取基站和用户端的距离、高度差、方位角、下倾角、地物类型等特征，构建特征向量'
  - '任务1建模: 基于Cost231-Hata模型，结合数字地图数据计算路径损耗，预测RSRP，并计算RMSE评估误差'
  - '任务2建模: 使用CatBoost算法构建机器学习模型，输入特征包括工参和地图特征，输出RSRP预测值，通过交叉验证调参'
  - '特征选择: 使用CV、PCC、MIC等方法分析特征重要性，筛选关键特征'
  - '任务3建模: 基于预测的RSRP，设定阈值识别弱覆盖区域，使用分类模型（如随机森林）进行覆盖识别，并计算PCRR和RMSE'
  - '模型评估: 使用RMSE和PCRR等指标评估模型性能，对比不同模型的预测精度'
  - '结果分析: 分析弱覆盖区域分布，提出覆盖优化建议'
  key_formulas:
  - name: Cost231-Hata路径损耗模型
    latex: PL = 46.3 + 33.9 \log_{10} f - 13.82 \log_{10} h_b - \alpha(h_r) + (44.9
      - 6.55 \log_{10} h_b) \log_{10} d + C_m
    description: 计算路径损耗，其中f为频率(MHz)，h_b为基站天线高度(m)，h_r为移动台天线高度(m)，d为距离(km)，C_m为地物修正因子
  - name: RSRP计算公式
    latex: RSRP = P_t - PL
    description: RSRP等于发射功率减去路径损耗
  - name: 3D距离计算
    latex: d = \sqrt{(x_1 - x_0)^2 + (y_1 - y_0)^2 + (h_1 - h_0)^2}
    description: 计算基站与用户端之间的3D欧氏距离
  - name: RMSE
    latex: RMSE = \sqrt{\frac{1}{n} \sum_{i=1}^{n} (y_i - \hat{y}_i)^2}
    description: 均方根误差，用于评估预测精度
  - name: PCRR
    latex: PCRR = \frac{\text{正确识别的弱覆盖样本数}}{\text{总弱覆盖样本数}}
    description: 弱覆盖识别率，用于评估分类模型性能
  algorithm_outline:
  - language: python
    description: Cost231-Hata模型预测RSRP
    code: "def cost231_hata(f, h_b, h_r, d, C_m):\n    alpha = (1.1 * np.log10(f)\
      \ - 0.7) * h_r - (1.56 * np.log10(f) - 0.8)\n    PL = 46.3 + 33.9 * np.log10(f)\
      \ - 13.82 * np.log10(h_b) - alpha + (44.9 - 6.55 * np.log10(h_b)) * np.log10(d)\
      \ + C_m\n    return PL\n\nRSRP_pred = P_t - cost231_hata(f, h_b, h_r, d, C_m)"
  - language: python
    description: CatBoost模型训练与预测
    code: 'from catboost import CatBoostRegressor

      from sklearn.model_selection import train_test_split


      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2)

      model = CatBoostRegressor(iterations=1000, learning_rate=0.05, depth=6)

      model.fit(X_train, y_train)

      y_pred = model.predict(X_test)

      rmse = np.sqrt(mean_squared_error(y_test, y_pred))'
  - language: python
    description: 弱覆盖识别
    code: 'threshold = -105  # RSRP阈值

      y_pred_class = (y_pred < threshold).astype(int)

      from sklearn.ensemble import RandomForestClassifier

      clf = RandomForestClassifier()

      clf.fit(X_train, y_train_class)

      y_pred_class = clf.predict(X_test)

      pcrr = recall_score(y_test_class, y_pred_class)'
  assumption_analysis:
  - '假设1: 基站发射功率恒定 → 实际中可能动态调整，放松后需引入功率控制模型'
  - '假设2: 传播环境为宏蜂窝城市环境 → 适用于Cost231-Hata模型，若为微蜂窝或室内需调整模型'
  - '假设3: 地物类型对路径损耗的影响可通过C_m修正 → 合理，但C_m的取值需根据实际地物校准'
  - '假设4: 用户端高度固定 → 实际中用户高度变化，放松后需考虑高度修正因子'
  - '假设5: 信号传播主要受距离和地物影响 → 忽略了多径效应和快衰落，放松后需引入更复杂的信道模型'
  reusable_patterns:
  - '可复用模式1: 传统经验模型+机器学习残差修正 → 先用物理模型预测，再用ML学习残差，提升精度'
  - '可复用模式2: 多维度特征工程 → 结合工参、地理、距离等多源数据构建特征，提升模型表达能力'
  - '可复用模式3: 特征选择方法组合 → 使用CV、PCC、MIC等多种方法综合评估特征重要性'
  - '可复用模式4: 分类+回归联合建模 → 先回归预测连续值，再分类识别弱覆盖，解决实际问题'
  common_pitfalls:
  - mistake: 直接使用Cost231-Hata模型而不进行地物修正
    solution: 根据数字地图中的地物类型，调整C_m参数，或引入机器学习修正
  - mistake: 忽略特征之间的多重共线性
    solution: 使用PCC和VIF检测共线性，剔除冗余特征
  - mistake: 弱覆盖阈值设定不合理
    solution: 根据实际网络标准（如RSRP<-105dBm）设定阈值，并结合业务需求调整
  - mistake: 模型过拟合
    solution: 使用交叉验证、正则化、早停等方法防止过拟合
  difficulty: 3
  difficulty_level: medium
  analysis:
    problem_summary: 基于基站工参和地图数据，构建无线传播模型预测RSRP，并识别弱覆盖区域
    key_assumptions:
    - 发射功率恒定
    - 宏蜂窝城市环境
    - 地物影响可通过修正因子体现
    decision_variables: RSRP预测值、弱覆盖区域标识
    objective: 最小化RSRP预测误差(RMSE)，最大化弱覆盖识别率(PCRR)
    constraints: 模型复杂度、计算资源、数据质量
  model:
    approach: 论文采用两阶段建模思路：第一阶段基于传统Cost231-Hata模型，结合数字地图数据计算路径损耗，得到RSRP的初步预测；第二阶段利用CatBoost机器学习算法，以基站工参、地图特征、距离等为输入，RSRP为输出，构建数据驱动的预测模型。同时，通过CV、PCC、MIC等方法进行特征选择，优化模型性能。最后，基于预测的RSRP，设定阈值识别弱覆盖区域，并使用随机森林分类模型进行覆盖识别，计算PCRR和RMSE评估模型性能。
    innovation: 将传统经验模型与机器学习相结合，利用CatBoost处理类别特征和高维数据的能力，提升RSRP预测精度；同时引入多种特征选择方法，增强模型可解释性。
    solution_method: Python编程，使用CatBoost、scikit-learn、pandas、numpy等库，进行数据预处理、特征工程、模型训练与评估。
  evaluation:
    strengths:
    - 结合传统模型与机器学习，思路清晰
    - 特征工程全面，考虑多源数据
    - 模型评估指标合理，RMSE和PCRR兼顾
    weaknesses:
    - 未详细说明地物修正因子的具体取值
    - 未考虑多径效应和快衰落
    - 弱覆盖阈值设定缺乏敏感性分析
    lessons: 在实际工程问题中，传统物理模型与数据驱动方法结合往往能取得更好效果；特征工程和特征选择是提升模型性能的关键；多指标评估能更全面反映模型优劣。
