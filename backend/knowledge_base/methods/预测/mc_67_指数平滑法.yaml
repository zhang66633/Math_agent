  id: mc_67
  formulas:
  - 简单指数平滑：$F_{t+1} = \alpha y_t + (1 - \alpha) F_t$，其中$y_t$为t时刻观测值，$F_t$为t时刻预测值，$\alpha \in (0,1)$为平滑系数。
  - Holt水平方程：$L_t = \alpha y_t + (1 - \alpha)(L_{t-1} + T_{t-1})$，其中$L_t$为t时刻水平，$T_t$为t时刻趋势，$\alpha$为水平平滑系数。
  - Holt趋势方程：$T_t = \beta(L_t - L_{t-1}) + (1 - \beta)T_{t-1}$，其中$\beta \in (0,1)$为趋势平滑系数。
  - Holt预测：$F_{t+m} = L_t + m T_t$，其中$m$为向前预测步数。
  - Holt-Winters季节方程：$S_t = \gamma \frac{y_t}{L_t} + (1 - \gamma)S_{t-s}$，预测：$F_{t+m} = (L_t + m T_t) S_{t-s+m}$，其中$S_t$为季节成分，$s$为季节周期长度，$\gamma
    \in (0,1)$为季节平滑系数。
