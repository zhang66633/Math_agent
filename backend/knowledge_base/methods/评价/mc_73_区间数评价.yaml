  id: mc_73
  formulas:
  - 区间数：$\tilde{a} = [a^L, a^U]$，其中 $a^L \leq a^U$，$a^L$ 为下界，$a^U$ 为上界。
  - 区间加法：$\tilde{a} + \tilde{b} = [a^L + b^L, a^U + b^U]$，用于合并区间信息。
  - 正向指标标准化：$\tilde{r}_{ij} = \left[ \frac{a_{ij}^L}{\max_k a_{kj}^U}, \frac{a_{ij}^U}{\max_k a_{kj}^U}
    \right]$，其中 $a_{ij}$ 为第 $i$ 个方案第 $j$ 个指标的区间值。
  - 负向指标标准化：$\tilde{r}_{ij} = \left[ \frac{\min_k a_{kj}^L}{a_{ij}^U}, \frac{\min_k a_{kj}^U}{a_{ij}^L}
    \right]$，用于成本型指标。
  - 区间距离：$D(\tilde{a}, \tilde{b}) = \sqrt{(a^L - b^L)^2 + (a^U - b^U)^2}$，用于计算与正负理想解的距离。
