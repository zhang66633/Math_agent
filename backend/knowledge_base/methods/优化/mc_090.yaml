method_card:
  id: mc_090
  name: 确定性存贮模型（EOQ/EPQ及变体）
  name_en: Deterministic Inventory Models (EOQ/EPQ and variants)
  category:
  - 优化
  principle: 经济订购批量（EOQ）模型是存贮论中经典的确定性模型，用于在需求连续均匀、不允许缺货、补充时间极短的假设下，确定最优订货批量以最小化总库存成本。模型通过平衡订货费（每次固定）与存贮费（与库存量成正比），推导出使单位时间平均总费用最小的订货量Q*、订货周期T*和最小费用C*。核心思想是当订货费与存贮费相等时总费用最小，公式为Q*
    = sqrt(2 D C_D / C_P)，其中D为需求率，C_D为单次订货费，C_P为单位存贮费。
  formulas:
  - name: EOQ模型平均总费用
    latex: $$C(Q)=\frac{1}{2}C_P Q+\frac{C_D D}{Q}$$
    description: 单位时间平均存贮费与订货费之和，Q为订货批量。
  - name: EOQ最优订货量
    latex: $$Q^*=\sqrt{\frac{2 C_D D}{C_P}}$$
    description: 对平均总费用求导并令为零得到的经济订购批量。
  - name: EOQ最优订货周期
    latex: $$T^*=\frac{Q^*}{D}=\sqrt{\frac{2 C_D}{D C_P}}$$
    description: 最优订货量对应的订货间隔期。
  - name: EOQ最小平均总费用
    latex: $$C^*=\sqrt{2 C_D D C_P}$$
    description: 将最优订货量代入费用函数后的最小单位时间总费用。
  - name: 一般模型最优存贮周期
    latex: $$T^*=\sqrt{\frac{2 C_D(C_P+C_S)}{D C_P C_S(1-D/P)}}$$
    description: 允许缺货且补充需要一定时间的一般模型最优周期。
  - name: 一般模型经济生产批量
    latex: $$Q^*=D T^*=\sqrt{\frac{2 C_D D(C_P+C_S)}{C_P C_S(1-D/P)}}$$
    description: 一般模型的最优每次生产或订货量。
  - name: EPQ模型最优生产量
    latex: $$Q^*=\sqrt{\frac{2 C_D D}{C_P(1-D/P)}}$$
    description: 不允许缺货但补充需一定时间时的最优生产批量。
  - name: EPQ最小平均总费用
    latex: $$C^*=\sqrt{2 C_D D C_P(1-D/P)}$$
    description: EPQ模型对应的最小平均总费用。
  - name: 允许缺货且补充时间极短模型最优订货量
    latex: $$Q^*=\sqrt{\frac{2 C_D D(C_P+C_S)}{C_P C_S}}$$
    description: 允许缺货且补货瞬时（一般模型中P趋于无穷）时的最优订货量。
  - name: 经济订购批量（EOQ）
    latex: $$Q^*=\sqrt{\frac{2C_D D}{C_P}}$$
    description: 对C(Q)求导并令为零得到的最优订货量，平衡存贮费与订货费。
  - name: 最优订货周期
    latex: $$T^*=\frac{Q^*}{D}=\sqrt{\frac{2C_D}{D C_P}}$$
    description: 最优订货间隔期，等于最优订货量除以需求率D。
  - name: EOQ最小费用
    latex: $$C^*=\sqrt{2 C_D C_P D}$$
    description: 将Q*代入总费用函数得到的最小单位时间平均费用。
  - name: 经济生产批量模型最优生产周期
    latex: $$T^*=\sqrt{\frac{2C_D(C_P+C_S)}{D C_P C_S(1-D/P)}}$$
    description: 模型二允许缺货且补充需一定时间时的最优存贮周期，P为生产速度。
  - name: 经济生产批量
    latex: $$Q^*=D T^*$$
    description: 最优生产批量等于需求率乘以最优存贮周期。
  - name: 不允许缺货、补充时间较长的最优费用
    latex: $$C^*=\sqrt{2 C_D C_P D(1-D/P)}$$
    description: 模型三中对应最优生产量的最小平均总费用。
  - name: 经济订购批量
    latex: $$Q^* = \sqrt{\frac{2 D C_D}{C_P}}$$
    description: 最优订货批量，使总费用最小
  - name: 最佳订货周期
    latex: $$T^* = \frac{Q^*}{D} = \sqrt{\frac{2 C_D}{D C_P}}$$
    description: 最优订货间隔时间
  - name: 最小平均总费用
    latex: $$C^* = \sqrt{2 D C_D C_P}$$
    description: 单位时间的最小平均总费用（订货费+存贮费）
  applicable_when:
  - 需求率D可视为常数，需求连续均匀
  - 订购费C_D、单位存贮费C_P、缺货费C_S等参数已知且稳定
  - 补货或生产速率P稳定，且P>D（EPQ及一般模型）
  - 缺货策略明确：不允许缺货可令C_S趋于无穷，允许缺货则取有限值
  - 单一物品、无批量折扣且库容和资金约束可忽略
  - 需求连续、均匀且需求率D为常数
  - 订货费C_D、单位存贮费C_P等费用参数已知且稳定
  - 不允许缺货或允许缺货但缺货损失费可量化
  - 补充可瞬时完成或以恒定速率P连续补充
  - 单品种、单存储点、无库存空间和资金约束
  - 需求连续均匀且为常数
  - 不允许缺货（缺货费无穷大）
  - 补充时间极短（可视为瞬时到货）
  - 每次订货量不变，订购费固定
  - 单位存贮费为常数
  not_applicable_when:
  - 需求具有明显随机性或季节性波动
  - 存在批量折扣、价格变化或多级供应链联合优化
  - 多物品联合订购或库存容量、资金约束强
  - 补货提前期随机或服务水平和缺货成本难以量化
  - 需求随机、波动明显，需要概率分布描述
  - 存在数量折扣、价格折扣或运输批量优惠
  - 多品种、多级库存或库存空间与资金有限
  - 提前期随机或不允许用确定性近似
  - 货物价值随时间变化、易变质或存在过期损失
  - 需求随机或波动较大
  - 允许缺货或补充需要时间
  - 订货费或存贮费非线性变化
  - 存在数量折扣或价格变动
  typical_scenarios:
  - 零售或电商企业确定固定需求商品的每次订货量
  - 制造企业确定生产批量与生产周期
  - 图书设备等产品的生产-存贮计划
  - 确定再订货点和安全库存水平
  - 零售商品的最经济定期进货批量与周期
  - 生产企业自制自销设备的批量组织
  - 需求稳定的备品备件订货决策
  - 生产速率高于需求速率时的库存补充计划
  - 企业采购原材料或商品的库存管理
  - 零售业确定最优订货批量
  - 制造业中标准件的库存控制
  common_mistakes:
  - mistake: 将基本EOQ公式直接用于允许缺货或补货需一定时间的情形，忽略缺货费和生产速率。
    solution: 根据是否允许缺货和补货时间选择模型一至模型四，采用对应公式。
  - mistake: 公式中的单位不统一，如年需求与日保管费混用。
    solution: 统一时间单位，将需求率和费用率换算到同一时间基准。
  - mistake: 由连续EOQ得到非整数订货次数或批量后直接取小数。
    solution: 订货次数或批量需为整数时，比较相邻整数方案的全年费用后选优。
  - mistake: 忽略拖后订货点L=D t0，导致缺货。
    solution: 若补货存在固定提前期，应设置再订货点L为提前期内需求量。
  - mistake: 混淆需求率D与生产速度P，或忽略P>D条件。
    solution: 在生产需一定时间模型中使用(1-D/P)因子，并检查P>D是否成立。
  - mistake: 把年需求量和日需求量混用，导致费用单位不一致
    solution: 统一时间单位后再代入公式，例如将年需求换成日需求或按年统一费率。
  - mistake: 求出最优订货次数不是整数时直接四舍五入
    solution: 比较相邻整数次订货对应的年度总费用，选择费用较小者。
  - mistake: 将基本EOQ公式误用于允许缺货或生产补充时间较长的场景
    solution: 先判断是否存在缺货费C_S或生产速率P，选择对应模型（EPQ/缺货模型）。
  - mistake: 忽略订货点L或提前期
    solution: 若存在定时/定点订货情形，需按L=Dt_0设置订货点，当库存降到L即订货。
  - mistake: 将EOQ模型直接用于需求波动大或季节性明显的场景
    solution: 应使用随机存贮模型或考虑安全库存的动态规划方法
  - mistake: 忽略订货周期必须为整数（如天数、月数）导致实际执行偏差
    solution: 计算后需对订货次数取整，并比较相邻整数解的总费用
  code_snippets:
  - language: python
    description: 计算基本EOQ和EPQ模型的最优批量、周期与最小费用
    code: "import math\n\ndef eoq(D, C_D, C_P):\n    Q = math.sqrt(2 * C_D * D / C_P)\n\
      \    T = Q / D\n    C = math.sqrt(2 * C_D * D * C_P)\n    return Q, T, C\n\n\
      def epq(D, C_D, C_P, P):\n    Q = math.sqrt(2 * C_D * D / (C_P * (1 - D / P)))\n\
      \    T = Q / D\n    C = math.sqrt(2 * C_D * D * C_P * (1 - D / P))\n    return\
      \ Q, T, C\n\nQ1, T1, C1 = eoq(100, 10, 0.005)\nQ2, T2, C2 = epq(100, 10, 0.005,\
      \ 200)\nprint(Q1, T1, C1)\nprint(Q2, T2, C2)\n"
