    lessons: 这篇论文最重要的启示是：在复杂物理场景的机器学习建模中，领域知识驱动的特征工程往往比模型结构本身更重要。通过将传统经验模型中的非线性组合转化为特征，可以显著降低模型学习难度。同时，多维度特征评价体系（方差+Pearson+Spearman+随机森林）比单一指标更稳健。此外，可视化不仅是展示工具，更是发现数据问题和验证模型效果的重要手段。
