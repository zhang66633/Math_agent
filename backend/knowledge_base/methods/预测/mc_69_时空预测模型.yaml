  id: mc_69
  formulas:
  - X \in \mathbb{R}^{N \times T \times F}：时空数据表示，N 为空间节点数，T 为时间步长，F 为特征维度。
  - X_t = \sum_{k=1}^{p} \Phi_k X_{t-k} + \sum_{l=1}^{q} \Theta_l \epsilon_{t-l} + \epsilon_t：STARIMA 时空扩展，\Phi_k
    为自回归系数，\Theta_l 为移动平均系数，\epsilon_t 为误差项。
  - H^{(l+1)} = \sigma(\tilde{D}^{-\frac{1}{2}}\tilde{A}\tilde{D}^{-\frac{1}{2}} H^{(l)} W^{(l)})：图卷积层，\tilde{A}=A+I
    为加入自连接的邻接矩阵，\tilde{D}_{ii}=\sum_j \tilde{A}_{ij} 为度矩阵，W^{(l)} 为可学习权重，\sigma 为激活函数。
  - \alpha_{ij}^t = \frac{\exp(score(s_i^t, s_j^t))}{\sum_{k \in \mathcal{N}(i)} \exp(score(s_i^t, s_k^t))}：时空注意力权重，s_i^t
    为节点 i 在时刻 t 的状态表示，\mathcal{N}(i) 为节点 i 的邻居集合。
  - \hat{X}_{t+1:t+H} = \text{Decoder}(\text{Encoder}(X_{t-T:t}, G))：预测输出，X_{t-T:t} 为历史输入序列，G 为空间图，H 为预测步长。
