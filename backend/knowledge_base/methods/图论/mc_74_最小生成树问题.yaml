  name: 最小生成树问题
  name_en: Minimum Spanning Tree, MST
  category:
  - 图论
  principle: '最小生成树是指在一个连通的无向图中，找到一棵包含所有顶点且总权重最小的树。


    #### 2.1 Prim算法


    从一个顶点开始，逐步添加权重最小的边，直到包含所有顶点。


    **算法步骤**：

    1. 选择任意顶点作为起始点

    2. 在已访问顶点和未访问顶点之间找权重最小的边

    3. 将该边和对应顶点加入树

    4. 重复2-3直到所有顶点都被访问


    **时间复杂度**：$O(E \log V)$（使用优先队列）


    #### 2.2 Kruskal算法


    按边的权重从小到大选择，不形成回路则加入，直到有$V-1$条边。


    **算法步骤**：

    1. 将所有边按权重排序

    2. 从小到大选择边

    3. 若边连接两个不同连通分量，则加入

    4. 重复2-3直到有$V-1$条边


    使用**并查集**检测回路。


    **时间复杂度**：$O(E \log E)$'
  applicable_when: []
