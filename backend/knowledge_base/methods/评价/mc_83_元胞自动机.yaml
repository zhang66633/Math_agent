method_card:
  name: 元胞自动机
  name_en: Cellular Automata, CA
  category:
  - 综合评价
  principle: '元胞自动机是离散动力系统，由元胞空间、状态集、邻域和演化规则组成。


    #### 4.1 基本要素


    **元胞空间**：规则的网格（一维、二维）


    **状态集**：有限状态集，如$\{0, 1\}$


    **邻域**：

    - Von Neumann邻域：上下左右4个邻居

    - Moore邻域：周围8个邻居


    **演化规则**：$S_i^{t+1} = f(S_{N(i)}^t)$


    其中$S_i^t$是元胞$i$在时刻$t$的状态，$N(i)$是元胞$i$的邻域。


    #### 4.2 初等元胞自动机（一维）


    256种规则，由规则号8位二进制决定。


    **Wolfram分类**：

    - Class I：演化到均匀状态

    - Class II：演化到周期结构

    - Class III：混沌行为

    - Class IV：复杂结构（如Rule 110）


    #### 4.3 生命游戏（Game of Life）


    Conway的经典二维CA。


    **规则**：

    1. 活细胞周围有2-3个活邻居则存活

    2. 死细胞周围恰好有3个活邻居则复活

    3. 其他情况细胞死亡


    #### 4.4 交通流元胞自动机


    **Nagel-Schreckenberg模型**：


    步骤：

    1. 加速：$v_i \to \min(v_i + 1, v_{max})$

    2. 减速：$v_i \to \min(v_i, gap_i)$

    3. 随机慢化：以概率$p$，$v_i \to \max(v_i - 1, 0)$

    4. 移动：$x_i \to x_i + v_i$'
