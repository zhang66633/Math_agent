    ## 🧠 小结

    1. 神经网络 = 多层「线性变换 + 非线性激活」;万能逼近定理是它的理论底气,但需要数据量支撑
    2. 反向传播就是链式法则:误差信号 × 本层输入,逐层回传;手算一遍微型网络就全懂了
    3. 激活函数决定梯度流:sigmoid 易梯度消失,ReLU 是默认;学习率与损失曲线是调参的两大抓手
    4. 过拟合的标准剧本:训练损失降、验证损失升 → 早停 / L2 / Dropout
    5. 竞赛纪律:标准化、正确划分、双曲线展示、与简单模型对比——四件事做全,神经网络章节才有说服力
