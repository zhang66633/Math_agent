    chart_types:
    - '**错误率曲线**：训练/测试错误率随轮数变化'
    - '**分类器权重图**：各弱分类器权重'
    - '**决策边界图**：分类边界可视化'
    - '**特征重要性图**：特征重要性排序'
    - '**残差图**：残差随轮数变化（回归）'
    source: math-modeling-skill
  id: mc_88
  formulas:
  - 样本权重初始化：$w_i^{(1)} = 1/n$，其中$n$为样本数，$i=1,2,\ldots,n$。
  - 分类错误率：$\epsilon_t = \sum_{i=1}^{n} w_i^{(t)} \mathbb{I}(y_i \neq h_t(x_i))$，其中$w_i^{(t)}$为第$t$轮第$i$个样本权重，$h_t(x_i)$为第$t$个弱分类器预测，$\mathbb{I}(\cdot)$为指示函数。
  - 分类器权重：$\alpha_t = \frac{1}{2} \ln\left(\frac{1-\epsilon_t}{\epsilon_t}\right)$，其中$\epsilon_t$为第$t$轮分类错误率。
  - 样本权重更新：$w_i^{(t+1)} = \frac{w_i^{(t)} \exp(-\alpha_t y_i h_t(x_i))}{\sum_{j=1}^{n} w_j^{(t)} \exp(-\alpha_t
    y_j h_t(x_j))}$，其中$y_i$为真实标签，$h_t(x_i)$为弱分类器输出。
  - 最终分类器：$H(x) = \text{sign}\left( \sum_{t=1}^{T} \alpha_t h_t(x) \right)$，其中$T$为弱分类器总数，$\alpha_t$为分类器权重。
